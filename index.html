<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="format-detection" content="telephone=no"/>
<title>歯周基本検査アプリ</title>
<style>
  :root{
    --blue:#2563eb; --blue-d:#1d4ed8; --blue-bg:#eaf1fe;
    --bg:#eef1f5; --card:#fff; --ink:#1b2733; --soft:#5b6876; --faint:#97a3af;
    --line:#e2e8f0; --line2:#eef2f6;
    --ok:#0f8a78; --ok-bg:#e7f5f2; --warn:#bd7b12; --warn-bg:#fdf2dd; --bad:#c43838; --bad-bg:#fbe7e7;
    --bop:#e23838; --amber:#f59e0b;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45;-webkit-overflow-scrolling:touch;}
  button,label{touch-action:manipulation;user-select:none;-webkit-user-select:none;}
  input,select,textarea{font-size:16px;font-family:var(--sans);}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px 48px;}
  .wrap.wide{max-width:900px;}
  header.bar{background:var(--card);box-shadow:0 1px 3px rgba(27,39,51,.06);padding:14px 18px;position:sticky;top:0;z-index:30;}
  header.bar .back{color:var(--blue);font-size:.82rem;font-weight:500;background:none;border:0;padding:0;margin-bottom:4px;cursor:pointer;}
  header.bar h1{font-size:1.05rem;margin:0;font-weight:650;}
  header.bar .sub{font-size:.72rem;color:var(--soft);margin-top:2px;}
  .card{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(27,39,51,.06),0 6px 18px rgba(27,39,51,.05);}
  .ic{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:.95rem;background:#fff;}
  .ic:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-bg);}
  label.fl{display:block;font-size:.78rem;font-weight:500;color:#374151;margin-bottom:5px;}
  .err{font-size:.72rem;color:#ef4444;margin-top:4px;}
  .btn-primary{width:100%;padding:15px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-weight:600;font-size:.95rem;cursor:pointer;}
  .btn-primary:active{background:var(--blue-d);}
  .row{display:flex;gap:12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* list */
  .plist-item{width:100%;text-align:left;border:0;background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(27,39,51,.06);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:10px;}
  .plist-item:active{background:#f8fafc;}
  .pname{font-size:1rem;font-weight:600;}
  .pkana{font-size:.72rem;color:var(--faint);margin-left:8px;}
  .pmeta{font-size:.72rem;color:var(--soft);margin-top:2px;}
  .chev{color:#cbd5e1;font-size:1.2rem;}

  /* stats */
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .stat{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(27,39,51,.06);padding:10px;text-align:center;}
  .stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.3rem;font-weight:600;}
  .stat .v.alert{color:var(--bad);}
  .stat .l{font-size:.62rem;color:var(--soft);margin-top:3px;}

  .banner{border-radius:12px;background:#fffbeb;border:1px solid #fde68a;padding:11px 14px;font-size:.85rem;color:#92400e;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.68rem;color:var(--soft);padding:0 4px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .sw{width:13px;height:13px;border-radius:4px;}
  .dotr{width:9px;height:9px;border-radius:50%;background:var(--bop);}
  .amb{width:14px;height:14px;border-radius:50%;background:var(--amber);}

  /* arch */
  .arch-label{font-size:.62rem;color:var(--faint);letter-spacing:.14em;text-align:center;margin:2px 0 5px;}
  .arch{overflow-x:hidden;}
  .arch-inner{display:flex;justify-content:center;gap:6px;min-width:0;padding:2px 2px 6px;}
  .quad{display:flex;gap:3px;flex:1 1 0;min-width:0;}
  /* 領域グループ（臼歯部＝青系／前歯部＝砂色。左右の臼歯部は同色） */
  .tgroup{display:flex;gap:3px;min-width:0;border-radius:10px;padding:4px 3px;}
  .tgroup.post{background:#e9eff7;}
  .tgroup.ant{background:#f7f0e6;}
  .rlbar{display:flex;justify-content:space-between;align-items:center;padding:0 8px;}
  .rlbar .rl{font-size:.74rem;font-weight:700;color:var(--soft);}
  .tooth{position:relative;flex:1 1 0;min-width:0;min-height:70px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;padding:4px 1px 0;cursor:pointer;transition:transform .07s;overflow:hidden;}
  .tooth:active{transform:scale(.95);}
  .tooth .tn{font-family:var(--mono);font-size:.58rem;color:var(--faint);line-height:1;}
  .tooth .pp{flex:1;display:flex;align-items:center;justify-content:center;padding:2px 0;}
  .tooth .dnum{display:inline-flex;align-items:center;justify-content:center;min-width:1.55em;height:1.55em;padding:0 .12em;border-radius:999px;box-sizing:border-box;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.2rem;font-weight:600;color:#c0cad4;}
  .tooth .dnum.bop{border:2px solid var(--bop);}   /* BOP＝赤丸 */
  .tooth .dnum.pus{border:2px solid #2563eb;}       /* 排膿＝青丸 */
  .tooth .trow{width:100%;text-align:center;font-family:var(--mono);font-size:.62rem;line-height:1.55;border-top:1px solid var(--line2);}
  .tooth .trow.tmob{color:#b45309;}
  .dotb{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;}
  .dotb.bop{background:var(--bop);} .dotb.pus{background:#2563eb;}
  .tooth .prv{position:absolute;top:2px;left:3px;font-size:.5rem;font-weight:700;color:#94a3b8;line-height:1;}
  .plq-row{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-bottom:10px;}
  .plq-t{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:44px 44px 44px;gap:2px;border:1px solid var(--line);border-radius:10px;padding:2px;background:#fff;}
  .plq-t.miss{background:repeating-linear-gradient(135deg,#f1f3f6,#f1f3f6 4px,#e7eaef 4px,#e7eaef 8px);}
  .plq-t button{border:1.5px solid #fecaca;border-radius:8px;background:#fff;color:#991b1b;font-weight:700;font-size:.8rem;cursor:pointer;padding:0;}
  .plq-t button.on{background:#dc2626;border-color:#dc2626;color:#fff;}
  .plq-t .pn{border:none;background:transparent;color:var(--soft);font-family:var(--mono);font-size:.78rem;}
  .plq-t .pn.rec{color:#166534;}
  .plq-t .pn.none{background:#f0fdf4;border-radius:8px;}
  .fseg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;}
  .fseg button{min-width:64px;min-height:44px;border:none;background:#fff;font-weight:700;font-size:.9rem;cursor:pointer;color:#374151;}
  .fseg button.on{background:#0f766e;color:#fff;}
  .fseg button.on.bad{background:#dc2626;}
  .dotb.prevbop{background:transparent;border:1.5px solid #fca5a5;box-sizing:border-box;}
  .tooth .chg{position:absolute;top:1px;right:1px;width:15px;height:15px;border-radius:50%;background:var(--amber);color:#fff;font-size:.55rem;font-weight:700;display:flex;align-items:center;justify-content:center;}

  /* editor */
  .pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;}
  .pad button{font-family:var(--mono);font-size:1.05rem;font-weight:600;padding:11px 0;border:1px solid var(--line);background:#fff;border-radius:9px;color:var(--ink);cursor:pointer;}
  .pad button.on{background:var(--blue);border-color:var(--blue);color:#fff;}
  .pad button:disabled{opacity:.4;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;font-family:var(--mono);font-weight:600;padding:10px 0;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;color:var(--ink);}
  .seg button.on{background:#374151;border-color:#374151;color:#fff;}
  .seg button:disabled{opacity:.4;}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .stepper button{width:40px;padding:9px 0;border:0;background:#fff;font-size:1.1rem;cursor:pointer;}
  .stepper button:disabled{opacity:.4;}
  .stepper .sv{font-family:var(--mono);min-width:36px;text-align:center;font-weight:600;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:9px 0;}
  .tog{padding:10px 14px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font-size:.84rem;color:#374151;font-weight:500;}
  .tog.bop{background:var(--bop);border-color:var(--bop);color:#fff;}
  .tog.pus{background:#2563eb;border-color:#2563eb;color:#fff;}
  .tog.miss{background:#64748b;border-color:#64748b;color:#fff;}
  .tog:disabled{opacity:.4;}
  .navb{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding-top:12px;border-top:1px solid var(--line2);}
  .navb .nb{padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:.82rem;cursor:pointer;color:var(--ink);}
  .advchk{display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--soft);background:none;border:0;cursor:pointer;}
  .advchk .bx{width:20px;height:20px;border:1px solid #cbd5e1;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;}
  .advchk.on .bx{background:var(--blue);border-color:var(--blue);}

  .hist{width:100%;text-align:left;background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(27,39,51,.06);padding:14px 16px;cursor:pointer;margin-bottom:10px;border:0;}
  .hist:active{background:#f8fafc;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:12px 22px;border-radius:16px;font-size:.85rem;font-weight:600;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.18);}
  .note{font-size:.68rem;color:var(--faint);text-align:center;padding-top:14px;}
  .linkbtn{font-size:.84rem;color:var(--blue);background:none;border:0;font-weight:500;cursor:pointer;padding:0;}
  ::-webkit-scrollbar{height:6px;}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px;}

  /* ── 印刷 / PDF出力（紙チャート風・依存ゼロ） ── */
  #print-area{display:none;color:#111;}
  #print-area .phead{margin-bottom:8px;}
  #print-area .pttl{font-size:15pt;font-weight:700;margin:0 0 6px;}
  #print-area .ptag{font-size:9pt;font-weight:600;border:1px solid #444;border-radius:4px;padding:1px 6px;vertical-align:middle;}
  #print-area table.pinfo{width:100%;border-collapse:collapse;font-size:10pt;margin-bottom:4px;}
  #print-area table.pinfo td{padding:2px 8px 2px 0;}
  #print-area .psum{font-size:10pt;margin:2px 0 10px;padding:4px 8px;background:#f2f2f2;border-radius:4px;display:inline-block;}
  #print-area .parch{margin-bottom:10px;}
  #print-area .parch-l{font-size:9pt;color:#555;letter-spacing:.1em;margin:0 0 2px 2px;}
  #print-area table.pchart{border-collapse:collapse;width:100%;table-layout:fixed;}
  #print-area .pchart th,#print-area .pchart td{border:1px solid #888;text-align:center;font-size:9pt;padding:2px 1px;line-height:1.3;}
  #print-area .pchart th.rl,#print-area .pchart td.rl{width:64px;background:#eee;font-size:8pt;font-weight:600;}
  #print-area .pchart th{background:#f4f4f4;font-size:8.5pt;}
  #print-area .pchart td.miss{background:repeating-linear-gradient(135deg,#eee,#eee 3px,#dcdcdc 3px,#dcdcdc 6px);color:#888;}
  #print-area .pchart .s{display:inline-block;width:1.55em;}
  #print-area .pchart .deep{font-weight:800;}
  #print-area .pchart .dU{text-decoration:underline;}
  #print-area .bopdot{color:#c00;font-style:normal;}
  #print-area .bopc{display:inline-block;border:1.3px solid #c00;border-radius:999px;min-width:1.25em;padding:0 .12em;line-height:1.25;color:#000;}
  #print-area .pusm{font-size:6.5pt;color:#1d4ed8;font-weight:700;margin-left:1px;}
  #print-area .prvm{font-size:6pt;color:#555;margin-left:1px;}
  #print-area .pqc{font-size:6.5pt;letter-spacing:-.02em;}
  #print-area .pusdot{color:#1d4ed8;font-style:normal;}
  #print-area .pleg{font-size:8.5pt;color:#444;margin-top:4px;}
  #print-area .pfoot{font-size:8pt;color:#888;margin-top:10px;text-align:right;}
  /* ── 文書（様式1・様式3）印刷レイアウト ── */
  #print-area .dsheet{color:#000;font-size:10pt;line-height:1.5;page-break-after:always;}
  #print-area .dsheet:last-child{page-break-after:auto;}
  #print-area .dhead{display:flex;justify-content:space-between;gap:4mm;font-size:8pt;color:#333;margin-bottom:1mm;}
  #print-area .dttl{text-align:center;font-size:15pt;font-weight:800;letter-spacing:.08em;margin:0;line-height:1.3;}
  #print-area .dttl small{font-size:10.5pt;font-weight:700;}
  #print-area .ddate{text-align:right;font-size:9.5pt;margin:.6mm 0 1mm;}
  #print-area .dcopy{display:inline-block;font-size:10.5pt;font-weight:800;border:1.8px solid #333;border-radius:999px;padding:0 2.6mm;vertical-align:middle;}
  #print-area table.dgrid{width:100%;border-collapse:collapse;margin-top:1.6mm;}
  #print-area table.dgrid th,#print-area table.dgrid td{border:1.2px solid #333;padding:1.3mm 2mm;font-size:9.5pt;text-align:left;vertical-align:top;}
  #print-area table.dgrid th{font-weight:700;text-align:center;vertical-align:middle;background:#f2f2f2;}
  #print-area .dbox{border:1.2px solid #333;padding:1.4mm 2.4mm;margin-top:1.6mm;}
  #print-area .dlab{font-weight:700;}
  #print-area .dck{display:inline-block;margin:0 2.4mm .3mm 0;white-space:nowrap;color:#444;}
  #print-area .dck.on{font-weight:700;color:#000;}
  #print-area .dnote{font-size:9pt;margin-top:1.2mm;}
  #print-area .dfoot{display:flex;justify-content:space-between;align-items:flex-end;gap:4mm;border:1.2px solid #333;padding:1.6mm 3mm;margin-top:2mm;}
  /* v0.13 チェアサイドの見やすさ・押しやすさ（手袋でも押せる44px以上・離れても読める文字） */
  .wrap.wide{max-width:1140px;}
  .nb{min-height:44px;padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:.84rem;cursor:pointer;color:var(--ink);}
  .navb .nb{min-height:44px;min-width:76px;}
  .advchk{min-height:44px;padding:0 6px;}
  .pad button{min-height:50px;font-size:1.25rem;}
  .seg button{min-height:48px;font-size:1.05rem;}
  .tog{min-height:48px;}
  .stepper button{width:52px;min-height:44px;}
  header.bar .back{min-height:30px;padding:4px 12px 4px 0;}
  header.bar{padding-right:200px;}
  .tooth .tn{font-size:.72rem;}
  .tooth .chg{width:17px;height:17px;font-size:.6rem;}
  .tooth .prv{font-size:.6rem;}
  header.bar .back{min-height:36px;}
  #hdr-save{min-height:44px;}
  .edgrid>div>.fl:first-child,.edgrid>div>label:first-child{margin-top:0!important;}
  @media (min-width:900px){.edgrid{display:grid;grid-template-columns:1fr 1.35fr;gap:22px;align-items:start;}.edgrid .tog{min-height:52px;}}
  header.bar .back{margin-bottom:0;}
  header.bar{padding-top:10px;padding-bottom:10px;}
  @media (min-width:1000px){.tooth{min-height:72px;}.tooth .dnum{font-size:1.6rem;}.tooth .tn{font-size:.82rem;}.tooth .trow{font-size:.8rem;}}
  @media print{
    #app,#toast{display:none!important;}
    #print-area{display:block!important;}
    body{background:#fff;}
  }
</style>
<style id="pgstyle">@media print{@page{size:A4 landscape;margin:10mm;}}</style>
<script>
/* VAULT-CLIENT:BEGIN v1 ─ 院内保管庫クライアント
   正本: Ai/院内保管庫/client/vault-client.js（アプリ側は直接直さず tools/inline_vault_client.py で差し替える）

   アプリのデータを「保存のたびに」院内の Mac mini（院内保管庫）へ複製する。
   - アプリの保存は今までどおり端末内。ここは失敗してもアプリの動作を一切止めない（例外を外へ出さない）
   - 合言葉・保管庫の住所・端末名は同じ配信元（github.io）の全アプリで共有（1台のiPadで1回入れればよい）
   - 患者データは localStorage に書かない（書くのは設定と送信状態だけ）

   使い方（各アプリ）:
     const vault = createVault({
       app: 'perio', label: '歯周検査', appVersion: APP_VERSION,
       getSnapshot: () => ({ data: {...}, counts: {patients: 3, exams: 10} }),   // 同期/非同期どちらでも
       listBlobIds: async () => [...],  getBlob: async id => 'data:image/jpeg;base64,...',   // 写真がある場合だけ
       restore: async (data, blobs) => ({ ok: true, message: '復元しました' }),   // blobs = {ids, get(id)}
     });
     保存が終わるたびに → vault.markDirty()
     同じIDの写真を差し替えたら → vault.forgetBlob(id)（次回その写真を送り直す）
     設定画面に → vault.mountSettings(element)
     見出しなどに → vault.mountBadge(element)
*/
(function (global) {
  'use strict';
  if (global.createVault) return;

  var DEFAULT_URL = 'https://mini.hatadental.net:8443';
  var CFG_KEY = 'vault.cfg';                       // {url, token, device}（全アプリ共通）
  var DEBOUNCE_MS = 3000;
  var SNAP_TIMEOUT_MS = 30000;
  var BLOB_TIMEOUT_MS = 60000;
  var HEARTBEAT_MS = 6 * 3600 * 1000;              // 変更がなくても6時間に1回は送る（重複はサーバーが捨てる）
  var BLOB_VERIFY_MS = 24 * 3600 * 1000;           // 1日1回、サーバー側の写真一覧と突き合わせる
  var TICK_MS = 30 * 60 * 1000;                    // 開いたままでも30分ごとに状態を確認

  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function now() { return Date.now(); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtTime(t) {
    if (!t) return '';
    var d = new Date(t); if (isNaN(d)) return '';
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    var today = new Date(); var same = d.toDateString() === today.toDateString();
    return (same ? '今日 ' : (d.getMonth() + 1) + '/' + d.getDate() + ' ') + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function sumCounts(c) { var n = 0; if (c) for (var k in c) if (typeof c[k] === 'number') n += c[k]; return n; }
  function countsText(c, labels) {
    if (!c) return '';
    var out = [];
    for (var k in c) out.push((labels && labels[k] || k) + ' ' + c[k]);
    return out.join('・');
  }
  function randDevice() {
    var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '';
    for (var i = 0; i < 4; i++) s += a[Math.floor(Math.random() * a.length)];
    return 'iPad-' + s;
  }
  var DEVICE_RE = /^[\w぀-ヿ㐀-鿿ｦ-ﾟ\-]{1,32}$/;

  function getCfg() {
    var c = lsGet(CFG_KEY, null);
    if (!c || typeof c !== 'object') return null;
    return c;
  }
  function isConfigured(c) { return !!(c && c.url && c.token && c.device); }
  function urlProblem(u) {
    if (!/^https?:\/\/[^\s/]+/.test(u || '')) return '住所の形式が違います（https:// から始めてください）';
    var local = /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?(\/|$)/.test(u);
    if (/^http:/.test(u) && !local) return '鍵付き（https://）の住所が必要です';
    if (/^http:/.test(u) && location.protocol === 'https:' && !local) return 'この画面は https なので http の住所には送れません';
    return '';
  }

      $('token').value = c.token || '';
      $('url').value = c.url || DEFAULT_URL;
      function msg(kind, text) { var m = $('msg'); m.className = 'vlt-msg ' + kind; m.textContent = text; }
      function drawSt(s) {
        var v = STATE_VIEW[s.state] || STATE_VIEW.pending;
        var extra = s.state === 'ok' && s.lastOkAt ? '（' + fmtTime(s.lastOkAt) + '）' : (s.lastError && s.state !== 'ok' ? '：' + s.lastError : '');
        $('st').innerHTML = '<i class="vlt-dot" style="background:' + v[0] + '"></i>' + esc(v[1] + extra);
      }
      drawSt(status());
      onStatus(drawSt, box);

      box.querySelector('[data-a="save"]').onclick = function () {
        var dev = $('device').value.trim(), tok = $('token').value, url = $('url').value.trim().replace(/\/+$/, '');
        if (!DEVICE_RE.test(dev)) return msg('ng', 'iPad の名前は32文字以内で、記号は「-」「_」だけ使えます');
        if (tok.length < 8) return msg('ng', '合言葉を入れてください（8文字以上）');
        var up = urlProblem(url); if (up) return msg('ng', up);
        var old = getCfg() || {};
        var next = { url: url, token: tok, device: dev, v: 1 };
        msg('info', '確認しています…');
        api(next, 'GET', '/v1/auth', undefined, 15000).then(function () {
          lsSet(CFG_KEY, next);
          authFailedToken = null;
          if (old.device && old.device !== dev) { sentSet = {}; st.blobsVerifiedAt = 0; saveState(); }
          msg('ok', '✅ Mac mini につながりました。これから保存のたびに自動で送ります。');
          return checkExistingThenPush(dev);
        }).catch(function (e) { msg('ng', '❌ ' + e.message); });
      };
      box.querySelector('[data-a="push"]').onclick = function () {
        if (!isConfigured(getCfg())) return msg('ng', '先に合言葉を入れて「保存して接続を確認」を押してください');
        msg('info', '送っています…');
        pushNow('manual').then(function (r) {
          if (r.ok) msg('ok', r.dup ? '✅ Mac mini の保管分は最新です' : '✅ Mac mini に送りました' + (r.blobs && r.blobs.sent ? '（写真 ' + r.blobs.sent + ' 件）' : ''));
          else msg('ng', '❌ ' + r.error);
        });
      };
      // 同じ名前の iPad の保管分があって、この端末が空なら、上書きする前に復元を勧める
      function checkExistingThenPush(dev) {
        return Promise.resolve(opt.getSnapshot()).then(function (s) {
          var localTotal = sumCounts(s && s.counts);
          return listSnaps().then(function (devs) {
            var mine = devs.filter(function (d) { return d.device === dev; })[0];
            var srvTotal = mine && mine.latest ? sumCounts(mine.latest.counts) : 0;
            if (localTotal === 0 && srvTotal > 0) {
              msg('info', '「' + dev + '」の名前で Mac mini に保管されたデータがあります（' + countsText(mine.latest.counts, labels) + '・' + fmtTime(mine.latest.at) + '）。この端末は空なので、下の「Mac mini から復元する」で戻せます。');
              $('rsbox').open = true;
              return drawDevs();
            }
            markDirty();
          });
        }).catch(function () { markDirty(); });
      }
      function drawDevs() {
        var wrap = $('devs');
        wrap.innerHTML = '<p class="vlt-sub">読み込み中…</p>';
        return listSnaps().then(function (devs) {
          if (!devs.length) { wrap.innerHTML = '<p class="vlt-sub">まだ何も保管されていません。</p>'; return; }
          wrap.innerHTML = '';
          devs.forEach(function (d) {
            var row = document.createElement('div'); row.className = 'vlt-dev';
            var opts = (d.history || []).map(function (h) {
              return '<option value="' + esc(h.file) + '">' + esc(fmtTime(h.at) + '　' + countsText(h.counts, labels) + (h.reason === 'pre-restore' ? '　（復元前の控え）' : '')) + '</option>';
            }).join('');
            row.innerHTML = '<b>' + esc(d.device) + '</b>' + (d.device === (getCfg() || {}).device ? '　<span class="vlt-sub">（この iPad）</span>' : '') +
              '<div class="vlt-sub">最終 ' + esc(d.latest ? fmtTime(d.latest.at) : '—') + (d.blobs ? '・写真 ' + d.blobs + ' 件' : '') + '</div>' +
              '<select>' + opts + '</select><div class="vlt-row"><button class="vlt-warn">この内容で復元</button></div>';
            row.querySelector('button').onclick = function () {
              var file = row.querySelector('select').value;
              var h = (d.history || []).filter(function (x) { return x.file === file; })[0] || {};
              var q = '「' + d.device + '」の ' + fmtTime(h.at) + ' の内容（' + countsText(h.counts, labels) + '）で、この端末のデータを置き換えます。\n\n今この端末に入っている内容は、置き換える前に Mac mini に控えます。\n\nよろしいですか？';
              if (!confirm(q)) return;
              var btns = box.querySelectorAll('button'); Array.prototype.forEach.call(btns, function (b) { b.disabled = true; });
              restoreFrom(d.device, file, function (t) { msg('info', t); }).then(function (res) {
                if (res && res.ok) msg('ok', '✅ ' + (res.message || '復元しました'));
                else msg('ng', '❌ ' + ((res && res.message) || '復元できませんでした'));
              }).catch(function (e) { msg('ng', '❌ ' + e.message); }).then(function () {
                Array.prototype.forEach.call(btns, function (b) { b.disabled = false; });
              });
            };
            wrap.appendChild(row);
          });
        }).catch(function (e) { wrap.innerHTML = ''; msg('ng', '❌ ' + e.message); });
      }
      box.querySelector('[data-a="list"]').onclick = drawDevs;
    }

    // ── 起動時・画面の出入り・定期チェック ──
    function kick() {
      var cfg = getCfg();
      if (!isConfigured(cfg)) { setLive('off'); return; }
      if (restoring || inflight) return;
      if (authBlocked()) { setLive('auth', live.lastError || '合言葉が違います'); return; }
      if (st.pending || st.blobsPending) { setLive('pending'); schedule(2000); }
      else if (!st.lastOkAt || now() - st.lastOkAt > HEARTBEAT_MS) { schedule(5000); setLive(st.lastOkAt ? 'ok' : 'pending'); }
      else if (live.state !== 'guard' && live.state !== 'error') setLive('ok');
    }
    // 開いたままの端末（打刻iPadなど）でも30分ごとに確認する
    function tick() { try { kick(); } catch (e) {} setTimeout(tick, TICK_MS); }
    try {
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden' && st.pending && isConfigured(getCfg()) && !authBlocked()) pushNow('auto');
        if (document.visibilityState === 'visible') kick();
      });
      global.addEventListener('online', function () { if (st.pending) schedule(1000); });
      setTimeout(kick, 0);
      setTimeout(tick, TICK_MS);
    } catch (e) {}

    // 同じIDのまま中身が差し替わった写真（在庫の商品写真など）は、これを呼ぶと次回送り直す
    function forgetBlob(id) {
      try { blobGen[id] = (blobGen[id] || 0) + 1; if (sentSet[id]) { delete sentSet[id]; saveState(); } markDirty(); } catch (e) {}
    }

    return {
      markDirty: markDirty, forgetBlob: forgetBlob, pushNow: function () { return pushNow('manual'); }, status: status, onStatus: onStatus,
      listSnaps: listSnaps, restoreFrom: restoreFrom, mountSettings: mountSettings, mountBadge: mountBadge,
      _listenerCount: function () { return listeners.length; },
      isConfigured: function () { return isConfigured(getCfg()); },
      _debug: { st: st, sentSet: function () { return sentSet; } }
    };
  }

  global.createVault = createVault;
})(typeof window !== 'undefined' ? window : this);
/* VAULT-CLIENT:END */
</script>

<body>
<div id="app"></div>
<div id="toast"></div>
<div id="print-area"></div>

<script>
(function(){
// ───────── helpers (既存アプリより流用) ─────────
// PocketBase のレコードID形式（15桁の英小文字＋数字）に合わせる。作成時にこのIDを渡すのでIDの付替えが不要。
const generateId=()=>{const c='abcdefghijklmnopqrstuvwxyz0123456789';let s='';for(let i=0;i<15;i++)s+=c[Math.floor(Math.random()*36)];return s;};
const pad2=n=>String(n).padStart(2,'0');
const daysInMonth=(y,m)=>(y&&m)?new Date(y,m,0).getDate():31;
const CUR_Y=new Date().getFullYear();
const ERAS=[{name:'令和',start:2019},{name:'平成',start:1989,end:2019},{name:'昭和',start:1926,end:1989},{name:'大正',start:1912,end:1926}];
const eraMaxYear=e=>(e.end?e.end-e.start+1:CUR_Y-e.start+1);
const eraObj=n=>ERAS.find(x=>x.name===n);
function toWareki(y){for(const e of ERAS){if(y>=e.start)return{era:e.name,ey:y-e.start+1};}return{era:'大正',ey:1};}
const hira2kata=s=>(s||'').replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
function computeAge(b){if(!b)return null;const d=new Date(b),n=new Date();let y=n.getFullYear()-d.getFullYear();const m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))y--;return y;}
const ymdToday=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());};
const ymdJP=s=>{if(!s)return'';const[y,m,d]=s.split('-');return y+'/'+m+'/'+d;};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ───────── 歯周検査 定数/ロジック ─────────
const UPPER=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
const LOWER=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const ORDER=[...UPPER,...LOWER];
const TT={1:'中切歯',2:'側切歯',3:'犬歯',4:'第一小臼歯',5:'第二小臼歯',6:'第一大臼歯',7:'第二大臼歯',8:'第三大臼歯'};
// 乳歯（混合歯列P混検用）：位置1-5＝A-E。6-8は永久歯のみ。
const PRIMARY_LETTER={1:'A',2:'B',3:'C',4:'D',5:'E'};
const PRIMARY_NAME={1:'乳中切歯',2:'乳側切歯',3:'乳犬歯',4:'第一乳臼歯',5:'第二乳臼歯'};
const canBePrimary=n=>{const p=n%10;return p>=1&&p<=5;};
function regionName(n){const q=Math.floor(n/10),p=n%10;const jaw=(q===1||q===2)?'上顎':'下顎';const side=(q===1||q===4)?'右':'左';return jaw+side+TT[p];}
function regionNameT(n,t){if(t&&t.primary&&PRIMARY_NAME[n%10]){const q=Math.floor(n/10);const jaw=(q===1||q===2)?'上顎':'下顎';const side=(q===1||q===4)?'右':'左';return jaw+side+PRIMARY_NAME[n%10];}return regionName(n);}
function toothDisp(n,t){return (t&&t.primary&&PRIMARY_LETTER[n%10])?PRIMARY_LETTER[n%10]:n;}
// 六点法の部位：頬側3（近心/中央/遠心）＋舌側3（近心/中央/遠心）。index 0-2=頬側, 3-5=舌側
const SITE6=['mb','b','db','ml','l','dl'];
const SITE_SHORT={mb:'近心',b:'中央',db:'遠心',ml:'近心',l:'中央',dl:'遠心'};
const SITE_ROWS=[['頬側',['mb','b','db']],['舌側',['ml','l','dl']]];
// 六点法の部位を「口の中の位置どおり」に並べる（院長回答 Q6）。画面・紙の左→右＝患者の右側（1・4番台の歯）は遠心→近心、左側（2・3番台）は近心→遠心
function siteRowKeys(n,row){const base=row==='b'?['mb','b','db']:['ml','l','dl'];const q=Math.floor(n/10);return (q===1||q===4)?base.slice().reverse():base;}
function siteRows(n){return [['頬側',siteRowKeys(n,'b')],['舌側',siteRowKeys(n,'l')]];}
// 入力の順番：巡回の向きに合わせて途切れず進む（上顎は画面の左→右、下顎は右→左に進むので下顎は並びを逆にたどる）。頬側3→舌側3
function siteOrder(n){const q=Math.floor(n/10);const up=q===1||q===2;const b=siteRowKeys(n,'b'),l=siteRowKeys(n,'l');
  return (up?b.concat(l):b.slice().reverse().concat(l.slice().reverse())).map(k=>SITE6.indexOf(k));}
const SITE_LR=n=>{const q=Math.floor(n/10);return (q===1||q===4)?'遠 中 近':'近 中 遠';};
const EXAM_LABEL={basic:'基本検査（一点法）',precision:'精密検査（六点法）',mixed:'P混検（混合歯列・一点法）'};
const isOnePoint=t=>t==='basic'||t==='mixed';
function freshTeeth(){const o={};ORDER.forEach(n=>o[n]={ppd:null,mobility:null,bop:false,pus:false,missing:false,ppd6:null,bop6:null,primary:false,plq:null});return o;}
// プラークチャート（O'Leary の4面）：plq=[頬側,近心,遠心,舌側]（true＝プラークあり）。null＝未記録。精密検査・P混検のときだけ使う（院長回答 Q4）
const PLQ=['b','m','d','l'];const PLQ_JA={b:'頬',m:'近',d:'遠',l:'舌'};
const hasPlaque=type=>type==='precision'||type==='mixed';
// PCR＝プラークのある面÷記録した歯の面数。P混検は乳歯も数える（今ある歯すべて）
function pcrOf(t,type){let surf=0,rec=0,present=0;ORDER.forEach(n=>{const x=t[n];if(!x||x.missing)return;if(type!=='mixed'&&x.primary)return;present++;
    if(Array.isArray(x.plq)){rec++;surf+=x.plq.filter(Boolean).length;}});
  return {pct:rec?Math.round(surf/(rec*4)*100):null,rec,present,surf};}
// P混検の口全体の所見（院長回答 Q5：1口腔で 発赤・腫脹／歯石／出血）
const FINDINGS=[['redness','発赤・腫脹'],['calculus','歯石'],['bleeding','出血']];
function freshFindings(){return {redness:'',calculus:'',bleeding:''};}
// 外部（PocketBase等）由来の歯データを全歯そろった形に補完（欠けた歯番は初期値で埋める）
function normalizeTeeth(t){const o=freshTeeth();if(t)ORDER.forEach(n=>{if(t[n])Object.assign(o[n],t[n]);});return o;}
const sevOf=p=>p==null?null:p<=3?'ok':p<=5?'warn':'bad';
const SEV={ok:{bg:'var(--ok-bg)',fg:'var(--ok)'},warn:{bg:'var(--warn-bg)',fg:'var(--warn)'},bad:{bg:'var(--bad-bg)',fg:'var(--bad)'}};
const clone=o=>JSON.parse(JSON.stringify(o));
// 六点法の最深部PPD（表示・色分け・4mm判定に使用）と、いずれかの部位でBOP
function toothMaxPpd(t){if(t.missing)return null;if(t.ppd6){let mx=null;t.ppd6.forEach(v=>{if(v!=null)mx=(mx==null?v:Math.max(mx,v));});return mx;}return t.ppd;}
function toothAnyBop(t){if(t.missing)return false;if(t.bop6)return t.bop6.some(Boolean);return !!t.bop;}
function toothChanged(c,b){if(!b||!c)return false;
  // 深さ未入力の部位の出血だけ変えた場合も「変」
  if(c.ppd6||b.ppd6||c.bop6||b.bop6){const a=c.ppd6||[],d=b.ppd6||[],ba=c.bop6||[],bd=b.bop6||[];
    for(let i=0;i<6;i++){if((a[i]==null?null:a[i])!==(d[i]==null?null:d[i]))return true;if(!!ba[i]!==!!bd[i])return true;}
    return (c.mobility||0)!==(b.mobility||0)||!!c.missing!==!!b.missing||!!c.primary!==!!b.primary;}
  // 動揺度の「未入力」と「0」は変化とみなさない（前回未入力→今回0で全歯に「変」が付くのを防ぐ）
  return c.ppd!==b.ppd||(c.mobility||0)!==(b.mobility||0)||!!c.bop!==!!b.bop||!!c.pus!==!!b.pus||!!c.missing!==!!b.missing||!!c.primary!==!!b.primary;}
// 新しい検査の初期値用：出血・排膿はその日のプロービングの所見なので前回から持ち越さない
function stripBop(t){const o=clone(t);ORDER.forEach(n=>{const x=o[n];if(!x)return;x.bop=false;x.pus=false;if(x.bop6)x.bop6=null;x.plq=null;});return o;} // プラークも毎回その日の所見
// 保存前に知らせる「未入力」の洗い出し（保存は止めない）
function examGaps(t,type){const out={noPpd:[],partial:[],bopOnly:[],noMob:true,usable:0};
  ORDER.forEach(n=>{const x=t[n];if(!x||x.missing||x.primary)return;out.usable++;
    if(x.mobility!=null)out.noMob=false;
    if(type==='precision'){const v=x.ppd6||[];const got=[0,1,2,3,4,5].filter(i=>v[i]!=null).length;
      if(got===0)out.noPpd.push(n);else if(got<6)out.partial.push(n);
      if(x.bop6&&x.bop6.some((b,i)=>b&&v[i]==null))out.bopOnly.push(n);}
    else{if(x.ppd==null){out.noPpd.push(n);if(x.bop||x.pus)out.bopOnly.push(n);}}});
  if(!out.usable)out.noMob=false;
  return out;}
function examStats(t,type){let mTeeth=0,bopPos=0,bopTot=0,deep=0,pusCnt=0;
  ORDER.forEach(n=>{const x=t[n];if(!x||x.missing||x.primary)return;
    if(type==='precision'){if(!x.ppd6)return;let measured=false;
      x.ppd6.forEach((v,i)=>{if(v!=null){measured=true;bopTot++;if(x.bop6&&x.bop6[i])bopPos++;if(v>=4)deep++;}});
      if(measured)mTeeth++;
    }else{if(x.pus)pusCnt++;if(x.ppd==null)return;mTeeth++;bopTot++;if(x.bop)bopPos++;if(x.ppd>=4)deep++;}});
  return{measured:mTeeth,bopPct:bopTot?Math.round(bopPos/bopTot*100):null,deep,deepUnit:type==='precision'?'部位':'歯',pus:pusCnt};}
function changedCount(t,b){if(!b)return 0;let c=0;ORDER.forEach(n=>{if(toothChanged(t[n],b[n]))c++;});return c;}

function byDateDesc(arr){return arr.map((x,i)=>[x,i]).sort((a,b)=>(new Date(b[0].date)-new Date(a[0].date))||(b[1]-a[1])).map(p=>p[0]);}
// ───────── サンプルデータ ─────────
function sampleBaseline(){const t=freshTeeth();[18,28,38,48].forEach(n=>t[n].missing=true);ORDER.forEach(n=>{if(!t[n].missing)t[n].ppd=2+(n%2);});t[16].ppd=4;t[16].bop=true;t[26].ppd=5;t[26].bop=true;t[36].ppd=4;t[46].bop=true;t[31].mobility=1;return t;}
const monthsAgo=m=>{const d=new Date();d.setMonth(d.getMonth()-m);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());};

// ───────── ストア（メモリ保持・本番はPocketBase等へ） ─────────
const store={
  patients:[
    {id:'p001',no:'#0001',chartNo:'10234',sei:'山田',mei:'太郎',seiKana:'ヤマダ',meiKana:'タロウ',name:'山田 太郎',kana:'ヤマダ タロウ',birth:'1968-05-12',gender:'male',notes:'SPT移行'},
    {id:'p002',no:'#0002',chartNo:'10241',sei:'佐藤',mei:'花子',seiKana:'サトウ',meiKana:'ハナコ',name:'佐藤 花子',kana:'サトウ ハナコ',birth:'1979-11-03',gender:'female',notes:''},
    {id:'p003',no:'#0003',chartNo:'10255',sei:'鈴木',mei:'一郎',seiKana:'スズキ',meiKana:'イチロウ',name:'鈴木 一郎',kana:'スズキ イチロウ',birth:'1990-02-20',gender:'male',notes:''},
  ],
  exams:[{id:'e001',patientId:'p001',date:monthsAgo(6),examiner:'衛生士A',type:'basic',teeth:sampleBaseline()}],
  staff:[{id:'st1',name:'衛生士A'},{id:'st2',name:'衛生士B'}],
  docs:[], // 文書（様式1初回/継続・様式3）：{id,patientId,kind,date,data}
  clinic:{name:'はた歯科医院',addr:'',tel:'',doctor:''}, // 印字用の医院情報（担当者・医院情報の画面で編集）
  nextNo(){const mx=this.patients.reduce((m,p)=>Math.max(m,parseInt((p.no||'').replace('#',''))||0),0);return '#'+String(mx+1).padStart(4,'0');},
  getPatient(id){return this.patients.find(p=>p.id===id);},
  // 新しい順。同じ日付なら後から作った方（一覧の後ろ）を新しいとみなす
  patientExams(pid){return byDateDesc(this.exams.filter(e=>e.patientId===pid));},
  patientDocs(pid){return byDateDesc(this.docs.filter(d=>d.patientId===pid));},
};

// ───────── データ層（端末内保存 ⇄ PocketBase ⇄ メモリ 切替アダプタ） ─────────
// ★PocketBase導入時：ミニPCでPBを起動し、下の url に院内サーバーのアドレスを入れるだけ。設定例：'http://192.168.1.50:8090'
//   url='' のあいだは【端末内保存】。LOCAL.on=false でメモリのみに戻せる。
const PB={url:''};
const APP_VERSION='0.13.0';const DATA_SCHEMA=1;
// 端末内保存の書き先：IndexedDB（容量はGB単位）が本命。IndexedDB を一度も使えていない端末だけ従来の localStorage で動かす。
// localStorage は Safari では配信元ごとに5MB（1字2バイトで数える）で、同じ配信元の院内アプリと枠を共有するため、1日30〜40件では約1か月で満杯になる。
const LOCAL={on:true,key:'perio_app_data_v1',backend:null,idbName:'perio_app',migratedMark:'perio_idb_migrated',lastSavedAt:null};
// 接続状態：'local'（端末内保存）/ 'memory'（保存なし）/ 'online'（PB接続OK）/ 'offline'（PB到達不可）
let netState='memory';
let storageProblem=''; // 端末への保存を止めている理由（ホームに赤帯で出す）
// ★注意：localStorage も IndexedDB も【配信URL（オリジン）単位】。URLが変わるとデータは引き継がれない。
//   テスト運用は必ず固定URL（GitHub Pages等）で。一時トンネルURLでの実データ入力は禁止。
function localAvail(){try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);return true;}catch(e){return false;}}
function localPayload(){return {schema:DATA_SCHEMA,app:APP_VERSION,savedAt:new Date().toISOString(),
  patients:store.patients,exams:store.exams,docs:store.docs,staff:store.staff,clinic:store.clinic};}
function loadLocalLS(){
  let raw=null;try{raw=localStorage.getItem(LOCAL.key);}catch(e){return null;}
  if(!raw)return null;
  try{const d=JSON.parse(raw);if(!d||!Array.isArray(d.patients))throw new Error('形式不正');return d;}
  catch(e){return {__broken:true,raw};}
}
function applyLoaded(d){
  // ★先に全件を検証・整形してから一括置換（途中で例外→患者だけ置換の不整合を防ぐ）
  const pts=(d.patients||[]).filter(p=>p&&typeof p==='object');
  const exs=(d.exams||[]).filter(e=>e&&typeof e==='object').map(e=>({...e,type:e.type||'basic',teeth:normalizeTeeth(e.teeth)}));
  const dcs=(d.docs||[]).filter(x=>x&&typeof x==='object');
  const stf=(d.staff||[]).filter(x=>x&&typeof x==='object');
  store.patients=pts;store.exams=exs;store.docs=dcs;store.staff=stf;
  if(d.clinic&&typeof d.clinic==='object')Object.assign(store.clinic,d.clinic);
}
// 置き換えて端末に保存。保存に失敗したら画面の中身も元に戻して false（画面と端末の保存が食い違わないように）
async function applyLoadedAndSave(d){
  const prev={patients:store.patients,exams:store.exams,docs:store.docs,staff:store.staff,clinic:Object.assign({},store.clinic)};
  applyLoaded(d);
  if(await persistAll())return true;
  store.patients=prev.patients;store.exams=prev.exams;store.docs=prev.docs;store.staff=prev.staff;
  Object.keys(store.clinic).forEach(k=>delete store.clinic[k]);Object.assign(store.clinic,prev.clinic);
  return false;
}

// ── IndexedDB（患者・検査・文書は1件ずつ別レコード。保存は変えた1件だけ書くので件数が増えても遅くならない） ──
const IDB_STORES=['patients','exams','docs'];
let idbConn=null;
// 一覧の並び（登録順）を保つための通し番号。レコードは {id, seq, v:元のデータ} で持ち、データの形は変えない
const idbSeq={patients:new Map(),exams:new Map(),docs:new Map()};let idbMaxSeq=0;
function idbReq(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function idbOpen(){return new Promise((res,rej)=>{
  let r;try{r=indexedDB.open(LOCAL.idbName,1);}catch(e){rej(e);return;}
  r.onupgradeneeded=()=>{const d=r.result;
    IDB_STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});});
    if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta'); // staff / clinic / info
    if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');};  // 下書き・壊れたデータの退避
  r.onsuccess=()=>{const d=r.result;d.onversionchange=()=>{try{d.close();}catch(_){}};res(d);};
  r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));});}
// 1つのトランザクションで書く。全部書けたときだけ true（途中で失敗すれば何も書かれない）
function idbTx(stores,fn){return new Promise(res=>{
  let tx;try{tx=idbConn.transaction(stores,'readwrite');}catch(e){res(false);return;}
  tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);tx.onabort=()=>res(false);
  try{fn(tx);}catch(e){try{tx.abort();}catch(_){}res(false);}});}
function idbRec(col,obj){let s=idbSeq[col].get(obj.id);if(s==null){s=++idbMaxSeq;idbSeq[col].set(obj.id,s);}return {id:obj.id,seq:s,v:obj};}
async function idbLoadAll(){
  const tx=idbConn.transaction(['patients','exams','docs','meta'],'readonly');
  const all=s=>idbReq(tx.objectStore(s).getAll());const meta=k=>idbReq(tx.objectStore('meta').get(k));
  const [ps,es,ds,staff,clinic,info]=await Promise.all([all('patients'),all('exams'),all('docs'),meta('staff'),meta('clinic'),meta('info')]);
  const seqs={};let mx=0;
  const un=(col,arr)=>{seqs[col]=new Map();return (arr||[]).filter(r=>r&&r.v&&typeof r.v==='object').sort((a,b)=>a.seq-b.seq)
    .map(r=>{seqs[col].set(r.id,r.seq);if(r.seq>mx)mx=r.seq;return r.v;});};
  const data={patients:un('patients',ps),exams:un('exams',es),docs:un('docs',ds),staff:Array.isArray(staff)?staff:[],clinic:clinic&&typeof clinic==='object'?clinic:null};
  return {info:info||null,data,seqs,maxSeq:mx};
}
async function idbReplaceAll(info){
  const maps={};let seq=0;const cols={patients:store.patients,exams:store.exams,docs:store.docs};
  const ok=await idbTx(['patients','exams','docs','meta'],tx=>{
    for(const c of IDB_STORES){const os=tx.objectStore(c);os.clear();maps[c]=new Map();
      for(const o of cols[c]){if(!o||o.id==null)continue;seq++;maps[c].set(o.id,seq);os.put({id:o.id,seq,v:o});}}
    const m=tx.objectStore('meta');m.put(store.staff,'staff');m.put(store.clinic,'clinic');if(info)m.put(info,'info');});
  if(ok){IDB_STORES.forEach(c=>{idbSeq[c]=maps[c];});idbMaxSeq=seq;}
  return ok;
}
function lsPersistAll(){try{localStorage.setItem(LOCAL.key,JSON.stringify(localPayload()));return true;}catch(e){return false;}}

// ── 保存の窓口（戻り値 Promise<boolean>。false＝端末に書けなかった → 呼び出し側で画面の変更を元に戻す） ──
// 保存を止めている（storageProblem）ときは「保存できなかった」と返す。PocketBase やメモリのみのときは従来どおり成功扱い
function persistSkip(){return !storageProblem;}
function persistDone(ok){if(ok){LOCAL.lastSavedAt=new Date().toISOString();try{if(vault)vault.markDirty();}catch(_){}scheduleStorageInfo();}return ok;}
async function persistPut(col,objs){if(netState!=='local')return persistSkip();const list=Array.isArray(objs)?objs:[objs];
  return persistDone(LOCAL.backend==='idb'?await idbTx([col],tx=>{const os=tx.objectStore(col);list.forEach(o=>os.put(idbRec(col,o)));}):lsPersistAll());}
async function persistDel(col,id){if(netState!=='local')return persistSkip();
  return persistDone(LOCAL.backend==='idb'?await idbTx([col],tx=>tx.objectStore(col).delete(id)):lsPersistAll());}
async function persistMeta(){if(netState!=='local')return persistSkip();
  return persistDone(LOCAL.backend==='idb'?await idbTx(['meta'],tx=>{const m=tx.objectStore('meta');m.put(store.staff,'staff');m.put(store.clinic,'clinic');}):lsPersistAll());}
async function persistAll(info){if(netState!=='local')return persistSkip();
  return persistDone(LOCAL.backend==='idb'?await idbReplaceAll(info):lsPersistAll());}

// ── 起動時の読み込み ──
const sameJSON=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function storeSnapshot(){return {patients:store.patients,exams:store.exams,docs:store.docs,staff:store.staff,clinic:store.clinic};}
function brokenAlert(){try{alert('⚠ 端末内の保存データが壊れていたため読み込めませんでした。\n壊れたデータは端末内に退避してあります（消えていません）。\nバックアップJSONをお持ちなら「💾 バックアップ」画面から復元してください。');}catch(_){}}
function holdVault(){vaultHold=VAULT_HOLD_MSG;try{localStorage.setItem(VAULT_HOLD_KEY,'1');}catch(_){}} // 読み直しても停止が続くよう端末に記録
// IndexedDB で起動できたら true。一度も使えていない端末で開けなければ false（→ localStorage で起動）
async function loadIDB(){
  if(typeof indexedDB==='undefined'||!indexedDB)return false;
  let marked=false;try{marked=!!localStorage.getItem(LOCAL.migratedMark);}catch(_){}
  try{idbConn=await idbOpen();}
  catch(e){idbConn=null;
    if(!marked)return false;
    // 移行済みの端末：古い localStorage に戻すと、IndexedDB 側の新しい記録と食い違うので保存を止める
    storageProblem='端末の保存場所（IndexedDB）を開けませんでした。記録は消えていません。アプリを閉じて開き直してください。直らないときは入力せず、院長に連絡してください。';
    netState='memory';return true;}
  let got;
  try{got=await idbLoadAll();}
  catch(e){idbConn=null;storageProblem='端末の保存データを読み込めませんでした（記録は消えていません）。アプリを閉じて開き直してください。';netState='memory';return true;}
  LOCAL.backend='idb';netState='local';
  if(got.info){ // 通常の起動
    applyLoaded(got.data);IDB_STORES.forEach(c=>{idbSeq[c]=got.seqs[c];});idbMaxSeq=got.maxSeq;
    try{if(!marked)localStorage.setItem(LOCAL.migratedMark,'1');
      const old=loadLocalLS(); // 移行後に残った古い写しは、移行時点より新しくなければ片づける（院内アプリ共有の5MB枠を空ける）
      if(old&&!old.__broken&&(!old.savedAt||!got.info.migratedAt||old.savedAt<=got.info.migratedAt))localStorage.removeItem(LOCAL.key);}catch(_){}
    return true;}
  const now=new Date().toISOString();
  const d=loadLocalLS();
  if(d&&d.__broken){ // 壊れた保存データ：IndexedDB に退避し、読み戻して確かめてから見本で起動
    const k='broken_'+now;
    let kept=await idbTx(['kv'],tx=>tx.objectStore('kv').put({at:now,raw:d.raw},k));
    if(kept){try{const r=await idbReq(idbConn.transaction(['kv'],'readonly').objectStore('kv').get(k));kept=!!r&&r.raw===d.raw;}catch(_){kept=false;}}
    if(!kept){storageProblem='端末内の保存データが壊れていて、退避用のコピーも作れませんでした。元のデータを守るため、この端末への保存を止めています（見本データで表示中・入力は保存されません）。院長に連絡してください。';
      netState='memory';LOCAL.backend=null;try{alert('⚠ '+storageProblem);}catch(_){}return true;}
    holdVault();brokenAlert();
    if(await persistAll({schema:DATA_SCHEMA,createdAt:now,from:'broken-localStorage',brokenKey:k})){
      try{localStorage.removeItem(LOCAL.key);localStorage.setItem(LOCAL.migratedMark,'1');}catch(_){}}
    return true;}
  if(d){ // 従来の localStorage から移す：写す → 読み戻して1件ずつ照合 → 一致したら元を消す
    applyLoaded(d);
    const want=storeSnapshot();
    let ok=await persistAll({schema:DATA_SCHEMA,migratedAt:now,from:'localStorage',counts:{patients:want.patients.length,exams:want.exams.length,docs:want.docs.length}});
    if(ok){try{const back=await idbLoadAll();ok=sameJSON(back.data.patients,want.patients)&&sameJSON(back.data.exams,want.exams)&&sameJSON(back.data.docs,want.docs)&&sameJSON(back.data.staff,want.staff)&&sameJSON(back.data.clinic,want.clinic);}catch(_){ok=false;}}
    if(ok){try{localStorage.removeItem(LOCAL.key);localStorage.setItem(LOCAL.migratedMark,'1');}catch(_){}return true;}
    // 照合に失敗：IndexedDB の中途半端な写しを消し、今回は従来どおり localStorage で動かす（元データはそのまま）
    await idbTx(['patients','exams','docs','meta'],tx=>{['patients','exams','docs','meta'].forEach(s=>tx.objectStore(s).clear());});
    idbConn=null;LOCAL.backend='ls';return true;}
  // 初回（保存データなし）：見本込みで保存を確立
  if(await persistAll({schema:DATA_SCHEMA,createdAt:now,from:'new'})){try{localStorage.setItem(LOCAL.migratedMark,'1');}catch(_){}}
  return true;
}
// IndexedDB が使えない端末：従来の localStorage で動かす
function loadLS(){
  LOCAL.backend='ls';netState='local';
  const d=loadLocalLS();
  if(d&&d.__broken){
    // ★退避用のコピーを書けて、読み戻して一致したときだけ見本で上書きする（容量不足で退避できないのに上書きして元データを消す事故を防ぐ）
    let kept=false;try{localStorage.setItem(LOCAL.key+'_broken',d.raw);kept=localStorage.getItem(LOCAL.key+'_broken')===d.raw;}catch(_){}
    holdVault();
    if(!kept){storageProblem='端末内の保存データが壊れていて、退避用のコピーも作れませんでした。元のデータを守るため、この端末への保存を止めています（見本データで表示中・入力は保存されません）。院長に連絡してください。';
      netState='memory';LOCAL.backend=null;try{alert('⚠ '+storageProblem);}catch(_){}return;}
    brokenAlert();lsPersistAll();
    try{if(!localStorage.getItem(VAULT_HOLD_KEY))localStorage.setItem(VAULT_HOLD_KEY,'1');}catch(_){} // 見本で置き換えて空きができた後にもう一度
    return;}
  if(d)applyLoaded(d); // 保存済みデータを復元。無ければサンプルのまま（初回）＝バックアップ画面の「全データ初期化」でまっさらにできる
  else lsPersistAll();  // 初回はサンプル込みで保存を確立
}

// ── 保存容量の見える化（Safari の localStorage は1字2バイトで数える。IndexedDB はブラウザの見積もり） ──
const LS_QUOTA=5*1024*1024;
let storageInfo=null,storageInfoTimer=null;
function lsOriginBytes(){let n=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);const v=localStorage.getItem(k)||'';n+=(k.length+v.length)*2;}}catch(_){}return n;}
async function refreshStorageInfo(){
  const r={lsBytes:lsOriginBytes(),usage:null,quota:null,persisted:null};
  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();r.usage=e.usage;r.quota=e.quota;}}catch(_){}
  try{if(navigator.storage&&navigator.storage.persisted)r.persisted=await navigator.storage.persisted();}catch(_){}
  storageInfo=r;return r;}
function scheduleStorageInfo(){clearTimeout(storageInfoTimer);storageInfoTimer=setTimeout(()=>{refreshStorageInfo().catch(()=>{});},1500);}
// 使用率（0〜1）。不明なら null
function storageLevel(){
  if(!storageInfo)return null;
  if(LOCAL.backend==='idb')return (storageInfo.quota>0&&storageInfo.usage!=null)?storageInfo.usage/storageInfo.quota:null;
  if(LOCAL.backend==='ls')return storageInfo.lsBytes/LS_QUOTA;
  return null;}
const fmtBytes=b=>b==null?'—':b<1024*1024?(b/1024).toFixed(1)+' KB':b<1024*1024*1024?(b/1024/1024).toFixed(1)+' MB':(b/1024/1024/1024).toFixed(2)+' GB';
function storageBannerHTML(){
  if(storageProblem)return `<div class="banner" style="margin-top:14px;background:#fee2e2;border-color:#fca5a5;color:#991b1b;font-weight:600">⚠ ${esc(storageProblem)}</div>`;
  const lv=storageLevel();if(lv==null||lv<0.7)return '';
  const red=lv>=0.85;
  return `<div class="banner" style="margin-top:14px;background:${red?'#fee2e2':'#fef3c7'};border-color:${red?'#fca5a5':'#fcd34d'};color:${red?'#991b1b':'#92400e'};font-weight:600">⚠ 端末の保存容量が ${Math.round(lv*100)}% に達しています。${red?'まもなく保存できなくなります。':''}今すぐ「💾 バックアップ」でJSONを書き出してください。</div>`;}

// 保存に失敗したことを、閉じるまで消えない帯で知らせる
const SAVE_FAIL_MSG='保存できませんでした。入力は画面に残っています。「💾 バックアップ」でJSONを書き出してから、端末の空き容量を確認してください。';
function showErr(msg){try{let b=document.getElementById('errbar');if(!b){b=document.createElement('div');b.id='errbar';document.body.appendChild(b);}
  b.innerHTML=`<div role="alert" style="position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#b91c1c;color:#fff;border-radius:14px;padding:14px 52px 14px 16px;font-size:.9rem;font-weight:700;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.25)">⚠ ${esc(msg)}<button onclick="this.parentNode.remove()" aria-label="閉じる" style="position:absolute;right:8px;top:8px;border:none;background:rgba(255,255,255,.22);color:#fff;border-radius:10px;width:40px;height:40px;font-size:1.1rem;cursor:pointer">×</button></div>`;}catch(_){}}

function pbUrl(col,id){return PB.url+'/api/collections/'+encodeURIComponent(col)+'/records'+(id?'/'+encodeURIComponent(id):'');}
function mapPatientToPB(p){return {id:p.id,no:p.no,chartNo:p.chartNo||'',sei:p.sei||'',mei:p.mei||'',seiKana:p.seiKana||'',meiKana:p.meiKana||'',name:p.name||'',kana:p.kana||'',birth:p.birth||'',gender:p.gender||'',notes:p.notes||'',recNo:p.recNo||''};}
function mapPatientFromPB(r){return {id:r.id,no:r.no,chartNo:r.chartNo,sei:r.sei,mei:r.mei,seiKana:r.seiKana,meiKana:r.meiKana,name:r.name,kana:r.kana,birth:r.birth,gender:r.gender,notes:r.notes,recNo:r.recNo};}
function mapExamToPB(e){return {id:e.id,patientId:e.patientId,date:e.date,examiner:e.examiner||'',type:e.type||'basic',teeth:e.teeth,carried:e.carried||[],createdAt:e.createdAt||'',updatedAt:e.updatedAt||'',rev:e.rev||0,findings:e.findings||null};}
function mapExamFromPB(r){const e={id:r.id,patientId:r.patientId,date:r.date,examiner:r.examiner,type:r.type||'basic',teeth:normalizeTeeth(r.teeth)};
  if(Array.isArray(r.carried))e.carried=r.carried;if(r.createdAt)e.createdAt=r.createdAt;if(r.updatedAt)e.updatedAt=r.updatedAt;if(r.rev)e.rev=r.rev;if(r.findings)e.findings=r.findings;return e;}
function mapDocToPB(d){return {id:d.id,patientId:d.patientId,kind:d.kind,date:d.date,data:d.data};}
function mapDocFromPB(r){return {id:r.id,patientId:r.patientId,kind:r.kind,date:r.date,data:r.data||{}};}
async function pbList(col){const r=await fetch(pbUrl(col)+'?perPage=1000&sort=created');if(!r.ok)throw new Error(col+' '+r.status);return (await r.json()).items||[];}
function pbWrite(col,obj,isNew,mapFn){
  const url=isNew?pbUrl(col):pbUrl(col,obj.id);
  fetch(url,{method:isNew?'POST':'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(mapFn(obj))})
    .then(r=>{if(!r.ok)throw new Error(col+' '+r.status);})
    .catch(()=>{obj._unsynced=true;netState='offline';toast('⚠ サーバー未同期（後で再送が必要）');});
}
// 保存系はすべて Promise<boolean>。新規の追加は失敗したら画面の一覧からも取り除く（更新の巻き戻しは呼び出し側）
const db={
  connected:()=>!!PB.url,
  async load(){
    if(this.connected()){
      try{const [ps,es]=await Promise.all([pbList('patients'),pbList('exams')]);
        store.patients=ps.map(mapPatientFromPB);store.exams=es.map(mapExamFromPB);netState='online';
        try{store.docs=(await pbList('docs')).map(mapDocFromPB);}catch(_){/* docsコレクション未作成なら空のまま */}}
      catch(e){netState='offline';toast('⚠ サーバーに接続できません。メモリ表示中');}
      return;
    }
    if(LOCAL.on){
      if(await loadIDB())return;
      if(localAvail()){loadLS();return;}
    }
    netState='memory';
  },
  async savePatient(p,isNew){if(isNew)store.patients.push(p);if(this.connected())pbWrite('patients',p,isNew,mapPatientToPB);
    const ok=await persistPut('patients',p);if(!ok&&isNew)store.patients=store.patients.filter(x=>x!==p);return ok;},
  async savePatients(list){list.forEach(p=>{if(this.connected())pbWrite('patients',p,false,mapPatientToPB);});return persistPut('patients',list);},
  async saveExam(e,isNew){if(isNew)store.exams.push(e);if(this.connected())pbWrite('exams',e,isNew,mapExamToPB);
    const ok=await persistPut('exams',e);if(!ok&&isNew)store.exams=store.exams.filter(x=>x!==e);return ok;},
  async deleteExam(id){const prev=store.exams;store.exams=prev.filter(e=>e.id!==id);
    const ok=await persistDel('exams',id);if(!ok){store.exams=prev;return false;}
    if(this.connected())fetch(pbUrl('exams',id),{method:'DELETE'}).catch(()=>{});return true;},
  async saveDoc(d,isNew){if(isNew)store.docs.push(d);if(this.connected())pbWrite('docs',d,isNew,mapDocToPB);
    const ok=await persistPut('docs',d);if(!ok&&isNew)store.docs=store.docs.filter(x=>x!==d);return ok;},
  async deleteDoc(id){const prev=store.docs;store.docs=prev.filter(d=>d.id!==id);
    const ok=await persistDel('docs',id);if(!ok){store.docs=prev;return false;}
    if(this.connected())fetch(pbUrl('docs',id),{method:'DELETE'}).catch(()=>{});return true;},
  saveMeta(){return persistMeta();},
};

// ── 入力途中の下書き（検査・文書）。保存を押す前に Safari が落ちても、開き直して続きから再開できる ──
// iPad の Safari では「ページを離れる前の警告（beforeunload）」が働かないため、入力のたびに自動で書いておく。
const DRAFT_KEY={exam:'draft_exam',doc:'draft_doc'};
let drafts={exam:null,doc:null},draftTimer={};
async function draftWrite(kind,obj){
  if(netState!=='local')return false;
  if(LOCAL.backend==='idb')return idbTx(['kv'],tx=>{const kv=tx.objectStore('kv');if(obj)kv.put(obj,DRAFT_KEY[kind]);else kv.delete(DRAFT_KEY[kind]);});
  try{const k='perio_'+DRAFT_KEY[kind];if(obj)localStorage.setItem(k,JSON.stringify(obj));else localStorage.removeItem(k);return true;}catch(_){return false;}}
async function draftReadAll(){
  const out={exam:null,doc:null};if(netState!=='local')return out;
  for(const kind of ['exam','doc']){
    try{if(LOCAL.backend==='idb'){out[kind]=(await idbReq(idbConn.transaction(['kv'],'readonly').objectStore('kv').get(DRAFT_KEY[kind])))||null;
        const lk='perio_'+DRAFT_KEY[kind];let old=null;try{const raw=localStorage.getItem(lk);old=raw?JSON.parse(raw):null;}catch(_){}
        if(old&&(!out[kind]||String(old.at)>String(out[kind].at))){if(await draftWrite(kind,old)){out[kind]=old;try{localStorage.removeItem(lk);}catch(_){}}}
        else if(old){try{localStorage.removeItem(lk);}catch(_){}}}
      else{const raw=localStorage.getItem('perio_'+DRAFT_KEY[kind]);out[kind]=raw?JSON.parse(raw):null;}}catch(_){out[kind]=null;}}
  // 患者がいない・形が合わない下書きは使わない
  if(out.exam&&!(out.exam.teeth&&store.getPatient(out.exam.pid)))out.exam=null;
  if(out.doc&&!(out.doc.data&&store.getPatient(out.doc.pid)))out.doc=null;
  return out;}
function examDraftObj(){return (pe&&pe.dirty)?{v:1,pid:pe.pid,examId:pe.examId||null,type:pe.type,date:pe.date,examiner:pe.examiner,teeth:clone(pe.teeth),
  touch:{ppd:[...touchSet('ppd')],mob:[...touchSet('mob')],bop:[...touchSet('bop')]},findings:pe.findings,at:new Date().toISOString()}:null;}
function docDraftObj(){return (dc&&dc.dirty)?{v:1,pid:dc.pid,docId:dc.docId||null,kind:dc.kind,data:clone(dc.data),copy:dc.copy,at:new Date().toISOString()}:null;}
function flushDraft(kind){clearTimeout(draftTimer[kind]);const o=kind==='exam'?examDraftObj():docDraftObj();if(!o)return;drafts[kind]=o;draftWrite(kind,o);}
function scheduleDraft(kind){clearTimeout(draftTimer[kind]);draftTimer[kind]=setTimeout(()=>flushDraft(kind),600);}
function clearDraft(kind){clearTimeout(draftTimer[kind]);drafts[kind]=null;draftWrite(kind,null).then(ok=>{if(!ok)setTimeout(()=>{if(!drafts[kind])draftWrite(kind,null);},1000);});}
function draftSummary(kind){const d=drafts[kind];if(!d)return '';const p=store.getPatient(d.pid);
  const at=new Date(d.at);const when=isNaN(at)?'':`${at.getMonth()+1}/${at.getDate()} ${pad2(at.getHours())}:${pad2(at.getMinutes())}`;
  if(kind==='exam'){ // 前回値が最初から入っているので「前回（または保存済みの元の検査）から変えた歯」の数を出す
    const base=d.examId?store.exams.find(e=>e.id===d.examId):store.patientExams(d.pid).find(e=>(e.type||'basic')===d.type);
    let n=0;if(base)n=changedCount(d.teeth,base.teeth);else ORDER.forEach(k=>{const x=d.teeth[k];if(x&&(x.ppd!=null||(x.ppd6&&x.ppd6.some(v=>v!=null))))n++;});
    return `${esc(p?p.name:'')}・${EXAM_LABEL[d.type]||'検査'}${d.examId?'（編集）':''}（${when}・${base?'変更':'入力'} ${n}歯）`;}
  return `${esc(p?p.name:'')}・${DOC_KIND[d.kind]||'文書'}（${when}）`;}
function draftBannerHTML(){
  return ['exam','doc'].filter(k=>drafts[k]).map(k=>`<div class="banner" style="margin-top:14px;background:#eff6ff;border-color:#93c5fd;color:#1e3a8a">
    <div style="font-weight:700">📝 保存されていない${k==='exam'?'検査':'文書'}があります</div>
    <div style="font-size:.82rem;margin-top:2px">${draftSummary(k)}</div>
    <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
      <button class="btn-primary" style="width:auto;padding:10px 18px" onclick="APP.resumeDraft('${k}')">続きから再開</button>
      <button style="padding:10px 18px;border:1px solid #93c5fd;border-radius:12px;background:#fff;color:#1e3a8a;font-weight:600;cursor:pointer" onclick="APP.discardDraft('${k}')">破棄する</button></div></div>`).join('');}

// ───────── 院内保管庫（Mac mini への自動バックアップ） ─────────
// 端末に保存するたびに（persistDone）複製を Mac mini へ送る。端末内の保存・表示には影響しない。
// 合言葉・住所・iPadの名前は同じ配信元の院内アプリ共通（💾 バックアップ画面で設定）。正本=Ai/院内保管庫/
// ★実データを読み込み終わってから作る（init の db.load の後）。セルフテストや読込前の見本データを送らないため。
const VAULT_LABELS={patients:'患者',exams:'検査',docs:'文書'};
let vault=null;
// 送信を止める理由（保存データが壊れて見本で起動した時）。端末に記録し、Mac mini からの復元・ファイル復元・全データ初期化で解除
const VAULT_HOLD_KEY='perio_vault_hold';
const VAULT_HOLD_MSG='この端末の保存データが壊れていたため、見本のまま起動しています。Mac mini への送信は止めています（Mac mini の保管分を見本で上書きしないため）。「Mac mini から復元する」で戻すか、見本を捨てて始めるなら「全データ初期化」をしてください';
let vaultHold=(()=>{try{return localStorage.getItem(VAULT_HOLD_KEY)?VAULT_HOLD_MSG:null;}catch(_){return null;}})();
function clearVaultHold(){vaultHold=null;try{localStorage.removeItem(VAULT_HOLD_KEY);}catch(_){}}
function initVault(){vault=createVault({app:'perio',label:'歯周検査',appVersion:APP_VERSION,
  // 保存時刻(savedAt)は外す：中身が同じなら Mac mini 側で重複として捨てられ、控えが無駄に増えない
  getSnapshot:()=>{if(vaultHold)throw new Error(vaultHold);const d=localPayload();delete d.savedAt;return {data:d,counts:{patients:store.patients.length,exams:store.exams.length,docs:store.docs.length}};},
  restore:async d=>{
    if(!d||!Array.isArray(d.patients)||!Array.isArray(d.exams))return {ok:false,message:'受け取ったデータの形式が違います'};
    if(!await applyLoadedAndSave(d))return {ok:false,message:'端末への保存に失敗しました（容量不足の可能性）。データは元のままです'};
    // 置き換えに成功してから、編集中の画面・患者フォームの入力と下書きを捨てる（復元した内容を古い入力で上書きしないように）
    if(pe&&pe.dirty)pe.dirty=false; if(dc&&dc.dirty)dc.dirty=false; pf=null; clearDraft('exam');clearDraft('doc');
    clearVaultHold();
    setTimeout(()=>{route={name:'home'};render();},1500);
    return {ok:true,message:`患者 ${store.patients.length}名・検査 ${store.exams.length}件・文書 ${store.docs.length}件を復元しました。まもなく患者一覧に戻ります。`};
  }});}
function mountVaultBadge(){try{vault.mountBadge(document.getElementById('vault-badge'));}catch(_){}}

// ───────── ルーター ─────────
let route={name:'home'};
const app=document.getElementById('app');
function go(r){if(route.name==='perio'&&pe&&pe.dirty&&r.name!=='perio'){if(!confirm('保存されていない変更があります。破棄して移動しますか？'))return;clearDraft('exam');}
  if(route.name==='doc'&&dc&&dc.dirty&&r.name!=='doc'){if(!confirm('保存されていない文書があります。破棄して移動しますか？'))return;clearDraft('doc');}
  if(vc&&vc.active)vStop();clearPrint();route=r;render();window.scrollTo(0,0);}
// 印刷用の中身は時間では消さない（iPad の印刷画面は window.print() の後も開いたままのことがあり、先に消すと白紙になる）。
// 次に画面を移るときと、次の印刷の直前に片づける。
let printTitle=null;
function clearPrint(){const a=document.getElementById('print-area');if(a)a.innerHTML='';if(printTitle!=null){document.title=printTitle;printTitle=null;}}
function startPrint(html,title,pageCss){clearPrint();document.getElementById('pgstyle').textContent=pageCss;
  document.getElementById('print-area').innerHTML=html;printTitle=document.title;document.title=title;window.print();}
window.addEventListener('afterprint',()=>{if(printTitle!=null){document.title=printTitle;printTitle=null;}});
function toast(msg){const warn=/^⚠/.test(msg);const t=document.getElementById('toast');t.innerHTML='<div class="toast"'+(warn?' style="background:#b45309"':'')+'>'+(warn?'':'✅ ')+esc(msg)+'</div>';setTimeout(()=>{t.innerHTML='';},warn?2800:1500);}
function render(){
  if(route.name==='patientForm')return renderPatientForm(route.patientId);
  if(route.name==='patientDetail')return renderPatientDetail(route.patientId);
  if(route.name==='perio')return renderPerio(route.patientId,route.examId,route.type);
  if(route.name==='viz')return renderViz(route.patientId);
  if(route.name==='doc')return renderDoc(route.patientId);
  if(route.name==='import')return renderImport();
  if(route.name==='staff')return renderStaff();
  if(route.name==='backup')return renderBackup();
  return renderHome();
}

const kanaBuf={};
function bindKana(inputId,kanaField,key){

  el.addEventListener('compositionend',e=>{const buf=kanaBuf[key]||'';kanaBuf[key]='';if(pf.kanaLock[kanaField]||!buf)return;const k=hira2kata(buf);if(!k)return;pf[kanaField]=(pf[kanaField]||'')+k;const kf=document.getElementById(kanaField==='seiKana'?'f-seik':'f-meik');if(kf)kf.value=pf[kanaField];});
  el.addEventListener('input',e=>{pf[key]=e.target.value;if(e.target.value===''&&!pf.kanaLock[kanaField]){pf[kanaField]='';const kf=document.getElementById(kanaField==='seiKana'?'f-seik':'f-meik');if(kf)kf.value='';}});
}

function storageMeterHTML(){
  const i=storageInfo;const lv=storageLevel();const pct=lv==null?null:Math.min(100,lv*100);
  const where=LOCAL.backend==='idb'?'IndexedDB（大容量の保存場所）':LOCAL.backend==='ls'?'localStorage（上限5MB・同じ配信元の院内アプリと共有）':'なし（保存されません）';
  const used=LOCAL.backend==='idb'?(i&&i.usage!=null?fmtBytes(i.usage)+' ／ 上限 約'+fmtBytes(i.quota):'計測中…')
    :LOCAL.backend==='ls'?(i?fmtBytes(i.lsBytes)+' ／ 上限 5.0 MB':'計測中…'):'—';
