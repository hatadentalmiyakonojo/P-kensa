<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="format-detection" content="telephone=no"/>
<title>歯周基本検査アプリ</title>
<style>
  :root{
    --blue:#2563eb; --blue-d:#1d4ed8; --blue-bg:#eaf1fe;
    --bg:#eef1f5; --card:#fff; --ink:#1b2733; --soft:#5b6876; --faint:#97a3af;
    --line:#e2e8f0; --line2:#eef2f6;
    --ok:#0f8a78; --ok-bg:#e7f5f2; --warn:#bd7b12; --warn-bg:#fdf2dd; --bad:#c43838; --bad-bg:#fbe7e7;
    --bop:#e23838; --amber:#f59e0b;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45;-webkit-overflow-scrolling:touch;}
  button,label{touch-action:manipulation;user-select:none;-webkit-user-select:none;}
  input,select,textarea{font-size:16px;font-family:var(--sans);}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px 48px;}
  .wrap.wide{max-width:900px;}
  header.bar{background:var(--card);box-shadow:0 1px 3px rgba(27,39,51,.06);padding:14px 18px;position:sticky;top:0;z-index:30;}
  header.bar .back{color:var(--blue);font-size:.82rem;font-weight:500;background:none;border:0;padding:0;margin-bottom:4px;cursor:pointer;}
  header.bar h1{font-size:1.05rem;margin:0;font-weight:650;}
  header.bar .sub{font-size:.72rem;color:var(--soft);margin-top:2px;}
  .card{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(27,39,51,.06),0 6px 18px rgba(27,39,51,.05);}
  .ic{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:.95rem;background:#fff;}
  .ic:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-bg);}
  label.fl{display:block;font-size:.78rem;font-weight:500;color:#374151;margin-bottom:5px;}
  .err{font-size:.72rem;color:#ef4444;margin-top:4px;}
  .btn-primary{width:100%;padding:15px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-weight:600;font-size:.95rem;cursor:pointer;}
  .btn-primary:active{background:var(--blue-d);}
  .row{display:flex;gap:12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* list */
  .plist-item{width:100%;text-align:left;border:0;background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(27,39,51,.06);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:10px;}
  .plist-item:active{background:#f8fafc;}
  .pname{font-size:1rem;font-weight:600;}
  .pkana{font-size:.72rem;color:var(--faint);margin-left:8px;}
  .pmeta{font-size:.72rem;color:var(--soft);margin-top:2px;}
  .chev{color:#cbd5e1;font-size:1.2rem;}

  /* stats */
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .stat{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(27,39,51,.06);padding:10px;text-align:center;}
  .stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.3rem;font-weight:600;}
  .stat .v.alert{color:var(--bad);}
  .stat .l{font-size:.62rem;color:var(--soft);margin-top:3px;}

  .banner{border-radius:12px;background:#fffbeb;border:1px solid #fde68a;padding:11px 14px;font-size:.85rem;color:#92400e;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.68rem;color:var(--soft);padding:0 4px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .sw{width:13px;height:13px;border-radius:4px;}
  .dotr{width:9px;height:9px;border-radius:50%;background:var(--bop);}
  .amb{width:14px;height:14px;border-radius:50%;background:var(--amber);}

  /* arch */
  .arch-label{font-size:.62rem;color:var(--faint);letter-spacing:.14em;text-align:center;margin:2px 0 5px;}
  .arch{overflow-x:hidden;}
  .arch-inner{display:flex;justify-content:center;gap:6px;min-width:0;padding:2px 2px 6px;}
  .quad{display:flex;gap:3px;flex:1 1 0;min-width:0;}
  /* 領域グループ（臼歯部＝青系／前歯部＝砂色。左右の臼歯部は同色） */
  .tgroup{display:flex;gap:3px;min-width:0;border-radius:10px;padding:4px 3px;}
  .tgroup.post{background:#e9eff7;}
  .tgroup.ant{background:#f7f0e6;}
  .rlbar{display:flex;justify-content:space-between;align-items:center;padding:0 8px;}
  .rlbar .rl{font-size:.74rem;font-weight:700;color:var(--soft);}
  .tooth{position:relative;flex:1 1 0;min-width:0;min-height:70px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;padding:4px 1px 0;cursor:pointer;transition:transform .07s;overflow:hidden;}
  .tooth:active{transform:scale(.95);}
  .tooth .tn{font-family:var(--mono);font-size:.58rem;color:var(--faint);line-height:1;}
  .tooth .pp{flex:1;display:flex;align-items:center;justify-content:center;padding:2px 0;}
  .tooth .dnum{display:inline-flex;align-items:center;justify-content:center;min-width:1.55em;height:1.55em;padding:0 .12em;border-radius:999px;box-sizing:border-box;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.2rem;font-weight:600;color:#c0cad4;}
  .tooth .dnum.bop{border:2px solid var(--bop);}   /* BOP＝赤丸 */
  .tooth .dnum.pus{border:2px solid #2563eb;}       /* 排膿＝青丸 */
  .tooth .trow{width:100%;text-align:center;font-family:var(--mono);font-size:.62rem;line-height:1.55;border-top:1px solid var(--line2);}
  .tooth .trow.tmob{color:#b45309;}
  .dotb{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;}
  .dotb.bop{background:var(--bop);} .dotb.pus{background:#2563eb;}
  .tooth .chg{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--amber);color:#fff;font-size:.55rem;font-weight:700;display:flex;align-items:center;justify-content:center;}

  /* editor */
  .pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;}
  .pad button{font-family:var(--mono);font-size:1.05rem;font-weight:600;padding:11px 0;border:1px solid var(--line);background:#fff;border-radius:9px;color:var(--ink);cursor:pointer;}
  .pad button.on{background:var(--blue);border-color:var(--blue);color:#fff;}
  .pad button:disabled{opacity:.4;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;font-family:var(--mono);font-weight:600;padding:10px 0;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;color:var(--ink);}
  .seg button.on{background:#374151;border-color:#374151;color:#fff;}
  .seg button:disabled{opacity:.4;}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .stepper button{width:40px;padding:9px 0;border:0;background:#fff;font-size:1.1rem;cursor:pointer;}
  .stepper button:disabled{opacity:.4;}
  .stepper .sv{font-family:var(--mono);min-width:36px;text-align:center;font-weight:600;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:9px 0;}
  .tog{padding:10px 14px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font-size:.84rem;color:#374151;font-weight:500;}
  .tog.bop{background:var(--bop);border-color:var(--bop);color:#fff;}
  .tog.pus{background:#2563eb;border-color:#2563eb;color:#fff;}
  .tog.miss{background:#64748b;border-color:#64748b;color:#fff;}
  .tog:disabled{opacity:.4;}
  .navb{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding-top:12px;border-top:1px solid var(--line2);}
  .navb .nb{padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:.82rem;cursor:pointer;color:var(--ink);}
  .advchk{display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--soft);background:none;border:0;cursor:pointer;}
  .advchk .bx{width:20px;height:20px;border:1px solid #cbd5e1;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;}
  .advchk.on .bx{background:var(--blue);border-color:var(--blue);}

  .hist{width:100%;text-align:left;background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(27,39,51,.06);padding:14px 16px;cursor:pointer;margin-bottom:10px;border:0;}
  .hist:active{background:#f8fafc;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:12px 22px;border-radius:16px;font-size:.85rem;font-weight:600;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.18);}
  .note{font-size:.68rem;color:var(--faint);text-align:center;padding-top:14px;}
  .linkbtn{font-size:.84rem;color:var(--blue);background:none;border:0;font-weight:500;cursor:pointer;padding:0;}
  ::-webkit-scrollbar{height:6px;}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px;}

  /* ── 印刷 / PDF出力（紙チャート風・依存ゼロ） ── */
  #print-area{display:none;color:#111;}
  #print-area .phead{margin-bottom:8px;}
  #print-area .pttl{font-size:15pt;font-weight:700;margin:0 0 6px;}
  #print-area .ptag{font-size:9pt;font-weight:600;border:1px solid #444;border-radius:4px;padding:1px 6px;vertical-align:middle;}
  #print-area table.pinfo{width:100%;border-collapse:collapse;font-size:10pt;margin-bottom:4px;}
  #print-area table.pinfo td{padding:2px 8px 2px 0;}
  #print-area .psum{font-size:10pt;margin:2px 0 10px;padding:4px 8px;background:#f2f2f2;border-radius:4px;display:inline-block;}
  #print-area .parch{margin-bottom:10px;}
  #print-area .parch-l{font-size:9pt;color:#555;letter-spacing:.1em;margin:0 0 2px 2px;}
  #print-area table.pchart{border-collapse:collapse;width:100%;table-layout:fixed;}
  #print-area .pchart th,#print-area .pchart td{border:1px solid #888;text-align:center;font-size:9pt;padding:2px 1px;line-height:1.3;}
  #print-area .pchart th.rl,#print-area .pchart td.rl{width:64px;background:#eee;font-size:8pt;font-weight:600;}
  #print-area .pchart th{background:#f4f4f4;font-size:8.5pt;}
  #print-area .pchart td.miss{background:repeating-linear-gradient(135deg,#eee,#eee 3px,#dcdcdc 3px,#dcdcdc 6px);color:#888;}
  #print-area .pchart .s{display:inline-block;width:1.55em;}
  #print-area .pchart .deep{font-weight:800;}
  #print-area .pchart .dU{text-decoration:underline;}
  #print-area .bopdot{color:#c00;font-style:normal;}
  #print-area .pusdot{color:#1d4ed8;font-style:normal;}
  #print-area .pleg{font-size:8.5pt;color:#444;margin-top:4px;}
  #print-area .pfoot{font-size:8pt;color:#888;margin-top:10px;text-align:right;}
  /* ── 文書（様式1・様式3）印刷レイアウト ── */
  #print-area .dsheet{color:#000;font-size:10pt;line-height:1.5;page-break-after:always;}
  #print-area .dsheet:last-child{page-break-after:auto;}
  #print-area .dhead{display:flex;justify-content:space-between;gap:4mm;font-size:8pt;color:#333;margin-bottom:1mm;}
  #print-area .dttl{text-align:center;font-size:15pt;font-weight:800;letter-spacing:.08em;margin:0;line-height:1.3;}
  #print-area .dttl small{font-size:10.5pt;font-weight:700;}
  #print-area .ddate{text-align:right;font-size:9.5pt;margin:.6mm 0 1mm;}
  #print-area .dcopy{display:inline-block;font-size:10.5pt;font-weight:800;border:1.8px solid #333;border-radius:999px;padding:0 2.6mm;vertical-align:middle;}
  #print-area table.dgrid{width:100%;border-collapse:collapse;margin-top:1.6mm;}
  #print-area table.dgrid th,#print-area table.dgrid td{border:1.2px solid #333;padding:1.3mm 2mm;font-size:9.5pt;text-align:left;vertical-align:top;}
  #print-area table.dgrid th{font-weight:700;text-align:center;vertical-align:middle;background:#f2f2f2;}
  #print-area .dbox{border:1.2px solid #333;padding:1.4mm 2.4mm;margin-top:1.6mm;}
  #print-area .dlab{font-weight:700;}
  #print-area .dck{display:inline-block;margin:0 2.4mm .3mm 0;white-space:nowrap;color:#444;}
  #print-area .dck.on{font-weight:700;color:#000;}
  #print-area .dnote{font-size:9pt;margin-top:1.2mm;}
  #print-area .dfoot{display:flex;justify-content:space-between;align-items:flex-end;gap:4mm;border:1.2px solid #333;padding:1.6mm 3mm;margin-top:2mm;}
  @media print{
    #app,#toast{display:none!important;}
    #print-area{display:block!important;}
    body{background:#fff;}
  }
</style>
<style id="pgstyle">@media print{@page{size:A4 landscape;margin:10mm;}}</style>

<body>
<div id="app"></div>
<div id="toast"></div>
<div id="print-area"></div>
<input id="csvfile" type="file" accept=".csv,text/csv" style="display:none"/>
<input id="bkfile" type="file" accept=".json,application/json" style="display:none"/>
<script>
(function(){
// ───────── helpers (既存アプリより流用) ─────────
// PocketBase のレコードID形式（15桁の英小文字＋数字）に合わせる。作成時にこのIDを渡すのでIDの付替えが不要。
const generateId=()=>{const c='abcdefghijklmnopqrstuvwxyz0123456789';let s='';for(let i=0;i<15;i++)s+=c[Math.floor(Math.random()*36)];return s;};
const pad2=n=>String(n).padStart(2,'0');
const daysInMonth=(y,m)=>(y&&m)?new Date(y,m,0).getDate():31;
const CUR_Y=new Date().getFullYear();
const ERAS=[{name:'令和',start:2019},{name:'平成',start:1989,end:2019},{name:'昭和',start:1926,end:1989},{name:'大正',start:1912,end:1926}];
const eraMaxYear=e=>(e.end?e.end-e.start+1:CUR_Y-e.start+1);
const eraObj=n=>ERAS.find(x=>x.name===n);
function toWareki(y){for(const e of ERAS){if(y>=e.start)return{era:e.name,ey:y-e.start+1};}return{era:'大正',ey:1};}
const hira2kata=s=>(s||'').replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
function computeAge(b){if(!b)return null;const d=new Date(b),n=new Date();let y=n.getFullYear()-d.getFullYear();const m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))y--;return y;}
const ymdToday=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());};
const ymdJP=s=>{if(!s)return'';const[y,m,d]=s.split('-');return y+'/'+m+'/'+d;};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ───────── 歯周検査 定数/ロジック ─────────
const UPPER=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
const LOWER=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const ORDER=[...UPPER,...LOWER];
const TT={1:'中切歯',2:'側切歯',3:'犬歯',4:'第一小臼歯',5:'第二小臼歯',6:'第一大臼歯',7:'第二大臼歯',8:'第三大臼歯'};
// 乳歯（混合歯列P混検用）：位置1-5＝A-E。6-8は永久歯のみ。
const PRIMARY_LETTER={1:'A',2:'B',3:'C',4:'D',5:'E'};
const PRIMARY_NAME={1:'乳中切歯',2:'乳側切歯',3:'乳犬歯',4:'第一乳臼歯',5:'第二乳臼歯'};
const canBePrimary=n=>{const p=n%10;return p>=1&&p<=5;};
function regionName(n){const q=Math.floor(n/10),p=n%10;const jaw=(q===1||q===2)?'上顎':'下顎';const side=(q===1||q===4)?'右':'左';return jaw+side+TT[p];}
function regionNameT(n,t){if(t&&t.primary&&PRIMARY_NAME[n%10]){const q=Math.floor(n/10);const jaw=(q===1||q===2)?'上顎':'下顎';const side=(q===1||q===4)?'右':'左';return jaw+side+PRIMARY_NAME[n%10];}return regionName(n);}
function toothDisp(n,t){return (t&&t.primary&&PRIMARY_LETTER[n%10])?PRIMARY_LETTER[n%10]:n;}
// 六点法の部位：頬側3（近心/中央/遠心）＋舌側3（近心/中央/遠心）。index 0-2=頬側, 3-5=舌側
const SITE6=['mb','b','db','ml','l','dl'];
const SITE_SHORT={mb:'近心',b:'中央',db:'遠心',ml:'近心',l:'中央',dl:'遠心'};
const SITE_ROWS=[['頬側',['mb','b','db']],['舌側',['ml','l','dl']]];
const EXAM_LABEL={basic:'基本検査（一点法）',precision:'精密検査（六点法）',mixed:'P混検（混合歯列・一点法）'};
const isOnePoint=t=>t==='basic'||t==='mixed';
function freshTeeth(){const o={};ORDER.forEach(n=>o[n]={ppd:null,mobility:null,bop:false,pus:false,missing:false,ppd6:null,bop6:null,primary:false});return o;}
// 外部（PocketBase等）由来の歯データを全歯そろった形に補完（欠けた歯番は初期値で埋める）
function normalizeTeeth(t){const o=freshTeeth();if(t)ORDER.forEach(n=>{if(t[n])Object.assign(o[n],t[n]);});return o;}
const sevOf=p=>p==null?null:p<=3?'ok':p<=5?'warn':'bad';
const SEV={ok:{bg:'var(--ok-bg)',fg:'var(--ok)'},warn:{bg:'var(--warn-bg)',fg:'var(--warn)'},bad:{bg:'var(--bad-bg)',fg:'var(--bad)'}};
const clone=o=>JSON.parse(JSON.stringify(o));
// 六点法の最深部PPD（表示・色分け・4mm判定に使用）と、いずれかの部位でBOP
function toothMaxPpd(t){if(t.missing)return null;if(t.ppd6){let mx=null;t.ppd6.forEach(v=>{if(v!=null)mx=(mx==null?v:Math.max(mx,v));});return mx;}return t.ppd;}
function toothAnyBop(t){if(t.missing)return false;if(t.bop6)return t.bop6.some(Boolean);return !!t.bop;}
function toothChanged(c,b){if(!b||!c)return false;
  if(c.ppd6||b.ppd6){const a=c.ppd6||[],d=b.ppd6||[],ba=c.bop6||[],bd=b.bop6||[];
    for(let i=0;i<6;i++){if((a[i]==null?null:a[i])!==(d[i]==null?null:d[i]))return true;if(!!ba[i]!==!!bd[i])return true;}
    return (c.mobility||0)!==(b.mobility||0)||!!c.missing!==!!b.missing;}
  return c.ppd!==b.ppd||c.mobility!==b.mobility||!!c.bop!==!!b.bop||!!c.pus!==!!b.pus||!!c.missing!==!!b.missing;}
function examStats(t,type){let mTeeth=0,bopPos=0,bopTot=0,deep=0,pusCnt=0;
  ORDER.forEach(n=>{const x=t[n];if(!x||x.missing||x.primary)return;
    if(type==='precision'){if(!x.ppd6)return;let measured=false;
      x.ppd6.forEach((v,i)=>{if(v!=null){measured=true;bopTot++;if(x.bop6&&x.bop6[i])bopPos++;if(v>=4)deep++;}});
      if(measured)mTeeth++;
    }else{if(x.pus)pusCnt++;if(x.ppd==null)return;mTeeth++;bopTot++;if(x.bop)bopPos++;if(x.ppd>=4)deep++;}});
  return{measured:mTeeth,bopPct:bopTot?Math.round(bopPos/bopTot*100):null,deep,deepUnit:type==='precision'?'部位':'歯',pus:pusCnt};}
function changedCount(t,b){if(!b)return 0;let c=0;ORDER.forEach(n=>{if(toothChanged(t[n],b[n]))c++;});return c;}

// ───────── サンプルデータ ─────────
function sampleBaseline(){const t=freshTeeth();[18,28,38,48].forEach(n=>t[n].missing=true);ORDER.forEach(n=>{if(!t[n].missing)t[n].ppd=2+(n%2);});t[16].ppd=4;t[16].bop=true;t[26].ppd=5;t[26].bop=true;t[36].ppd=4;t[46].bop=true;t[31].mobility=1;return t;}
const monthsAgo=m=>{const d=new Date();d.setMonth(d.getMonth()-m);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());};

// ───────── ストア（メモリ保持・本番はPocketBase等へ） ─────────
const store={
  patients:[
    {id:'p001',no:'#0001',chartNo:'10234',sei:'山田',mei:'太郎',seiKana:'ヤマダ',meiKana:'タロウ',name:'山田 太郎',kana:'ヤマダ タロウ',birth:'1968-05-12',gender:'male',notes:'SPT移行'},

// ───────── データ層（端末内保存 ⇄ PocketBase ⇄ メモリ 切替アダプタ） ─────────
// ★PocketBase導入時：ミニPCでPBを起動し、下の url に院内サーバーのアドレスを入れるだけ。設定例：'http://192.168.1.50:8090'
//   url='' のあいだは【端末内保存】（localStorage・iPad1台テスト運用モード）。LOCAL.on=false でメモリのみに戻せる。
const PB={url:''};
const APP_VERSION='0.9.0';const DATA_SCHEMA=1;
const LOCAL={on:true,key:'perio_app_data_v1'};
// 接続状態：'local'（端末内保存）/ 'memory'（保存なし）/ 'online'（PB接続OK）/ 'offline'（PB到達不可）
let netState='memory';
// ★注意：localStorageは【配信URL（オリジン）単位】。URLが変わるとデータは引き継がれない。
//   テスト運用は必ず固定URL（GitHub Pages等）で。一時トンネルURLでの実データ入力は禁止。
function localAvail(){try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);return true;}catch(e){return false;}}
function localPayload(){return {schema:DATA_SCHEMA,app:APP_VERSION,savedAt:new Date().toISOString(),
  patients:store.patients,exams:store.exams,docs:store.docs,staff:store.staff,clinic:store.clinic};}
function persistLocal(){
  if(netState!=='local')return;
  try{localStorage.setItem(LOCAL.key,JSON.stringify(localPayload()));}
  catch(e){toast('⚠ 端末への保存に失敗しました（容量不足の可能性）');}
}
function loadLocal(){
  try{const raw=localStorage.getItem(LOCAL.key);if(!raw)return null;
    const d=JSON.parse(raw);if(!d||!Array.isArray(d.patients))return null;return d;}
  catch(e){return null;}
}
function applyLoaded(d){
  store.patients=d.patients||[];
  store.exams=(d.exams||[]).map(e=>({...e,type:e.type||'basic',teeth:normalizeTeeth(e.teeth)}));
  store.docs=d.docs||[];store.staff=d.staff||[];
  if(d.clinic)Object.assign(store.clinic,d.clinic);
}
function wipeLocal(){try{localStorage.removeItem(LOCAL.key);}catch(e){}}
function pbUrl(col,id){return PB.url+'/api/collections/'+encodeURIComponent(col)+'/records'+(id?'/'+encodeURIComponent(id):'');}
function mapPatientToPB(p){return {id:p.id,no:p.no,chartNo:p.chartNo||'',sei:p.sei||'',mei:p.mei||'',seiKana:p.seiKana||'',meiKana:p.meiKana||'',name:p.name||'',kana:p.kana||'',birth:p.birth||'',gender:p.gender||'',notes:p.notes||'',recNo:p.recNo||''};}
function mapPatientFromPB(r){return {id:r.id,no:r.no,chartNo:r.chartNo,sei:r.sei,mei:r.mei,seiKana:r.seiKana,meiKana:r.meiKana,name:r.name,kana:r.kana,birth:r.birth,gender:r.gender,notes:r.notes,recNo:r.recNo};}
function mapExamToPB(e){return {id:e.id,patientId:e.patientId,date:e.date,examiner:e.examiner||'',type:e.type||'basic',teeth:e.teeth};}
function mapExamFromPB(r){return {id:r.id,patientId:r.patientId,date:r.date,examiner:r.examiner,type:r.type||'basic',teeth:normalizeTeeth(r.teeth)};}
function mapDocToPB(d){return {id:d.id,patientId:d.patientId,kind:d.kind,date:d.date,data:d.data};}
function mapDocFromPB(r){return {id:r.id,patientId:r.patientId,kind:r.kind,date:r.date,data:r.data||{}};}
async function pbList(col){const r=await fetch(pbUrl(col)+'?perPage=1000&sort=created');if(!r.ok)throw new Error(col+' '+r.status);return (await r.json()).items||[];}
function pbWrite(col,obj,isNew,mapFn){
  const url=isNew?pbUrl(col):pbUrl(col,obj.id);
  fetch(url,{method:isNew?'POST':'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(mapFn(obj))})
    .then(r=>{if(!r.ok)throw new Error(col+' '+r.status);})
    .catch(()=>{obj._unsynced=true;netState='offline';toast('⚠ サーバー未同期（後で再送が必要）');});
}
const db={
  connected:()=>!!PB.url,
  async load(){
    if(this.connected()){
      try{const [ps,es]=await Promise.all([pbList('patients'),pbList('exams')]);
        store.patients=ps.map(mapPatientFromPB);store.exams=es.map(mapExamFromPB);netState='online';
        try{store.docs=(await pbList('docs')).map(mapDocFromPB);}catch(_){/* docsコレクション未作成なら空のまま */}}
      catch(e){netState='offline';toast('⚠ サーバーに接続できません。メモリ表示中');}
      return;
    }
    if(LOCAL.on&&localAvail()){
      netState='local';
      const d=loadLocal();
      if(d)applyLoaded(d); // 保存済みデータを復元。無ければサンプルのまま（初回）＝バックアップ画面の「全データ初期化」でまっさらにできる
      else persistLocal();  // 初回はサンプル込みで保存を確立
      return;
    }
    netState='memory';
  },
  savePatient(p,isNew){if(isNew)store.patients.push(p);if(this.connected())pbWrite('patients',p,isNew,mapPatientToPB);persistLocal();},
  saveExam(e,isNew){if(isNew)store.exams.push(e);if(this.connected())pbWrite('exams',e,isNew,mapExamToPB);persistLocal();},
  deleteExam(id){store.exams=store.exams.filter(e=>e.id!==id);if(this.connected())fetch(pbUrl('exams',id),{method:'DELETE'}).catch(()=>{});persistLocal();},
  saveDoc(d,isNew){if(isNew)store.docs.push(d);if(this.connected())pbWrite('docs',d,isNew,mapDocToPB);persistLocal();},
  deleteDoc(id){store.docs=store.docs.filter(d=>d.id!==id);if(this.connected())fetch(pbUrl('docs',id),{method:'DELETE'}).catch(()=>{});persistLocal();},
};

// ───────── 患者説明の可視化（経時グラフ＋リスクレーダー・SVG自前描画） ─────────
// 基本(一点法)/精密(六点法)を横断比較できるよう、指標はすべて「歯単位の割合(%)」で統一
function examMetrics(e){
  const t=e.teeth,type=e.type||'basic';let measured=0,bopT=0,deepT=0,sevT=0,mobT=0,ppdSum=0,ppdN=0;
  ORDER.forEach(n=>{const x=t[n];if(!x||x.missing||x.primary)return;
    const has=(type==='precision')?(x.ppd6&&x.ppd6.some(v=>v!=null)):(x.ppd!=null);if(!has)return;
    measured++;const mx=toothMaxPpd(x);
    if(toothAnyBop(x))bopT++;
    if(mx!=null){if(mx>=4)deepT++;if(mx>=6)sevT++;ppdSum+=mx;ppdN++;}
    if(x.mobility>0)mobT++;});
  const pct=a=>measured?Math.round(a/measured*100):0;
  return{id:e.id,date:e.date,type,measured,bop:pct(bopT),deep:pct(deepT),severe:pct(sevT),mobile:pct(mobT),meanPpd:ppdN?Math.round(ppdSum/ppdN*10)/10:0};
}
const RADAR_AXES=[{k:'bop',l:'出血'},{k:'deep',l:'4mm↑'},{k:'severe',l:'6mm↑'},{k:'mobile',l:'動揺'}];
function svgRadar(series){
  const N=RADAR_AXES.length,cx=150,cy=145,R=92;
  const ang=i=>(-90+i*360/N)*Math.PI/180;
  const pt=(i,r)=>[cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];
  let rings='';[25,50,75,100].forEach(p=>{const pts=RADAR_AXES.map((_,i)=>pt(i,R*p/100).map(v=>v.toFixed(1)).join(',')).join(' ');rings+=`<polygon points="${pts}" fill="none" stroke="var(--line)" stroke-width="1"/>`;});
  let spokes='',labels='';RADAR_AXES.forEach((a,i)=>{const[x,y]=pt(i,R);spokes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    const[lx,ly]=pt(i,R+20);labels+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--soft)">${a.l}</text>`;});
  let polys='';series.forEach(s=>{const pts=RADAR_AXES.map((a,i)=>pt(i,R*Math.min(100,s.vals[i])/100).map(v=>v.toFixed(1)).join(',')).join(' ');
    polys+=`<polygon points="${pts}" fill="${s.fill}" stroke="${s.color}" stroke-width="2.5"/>`;});
  return `<svg viewBox="0 0 300 285" style="width:100%;height:auto;max-width:330px;display:block;margin:0 auto">${rings}${spokes}${labels}${polys}</svg>`;
}
function svgTrend(ms,series){
  const padL=30,padR=14,padT=16,padB=32,W=320,H=210,iw=W-padL-padR,ih=H-padT-padB,n=ms.length;
  const xat=i=>padL+(n<=1?iw/2:iw*i/(n-1));
  const yat=v=>padT+ih*(1-Math.min(100,v)/100);
  let grid='';[0,25,50,75,100].forEach(g=>{const y=yat(g).toFixed(1);grid+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line2)"/><text x="${padL-5}" y="${(+y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--faint)">${g}</text>`;});
  let xlab='';ms.forEach((m,i)=>{xlab+=`<text x="${xat(i).toFixed(1)}" y="${H-padB+15}" text-anchor="middle" font-size="9" fill="var(--faint)">${m.date.slice(5).replace('-','/')}</text>`;});
  let lines='';series.forEach(s=>{const pts=ms.map((m,i)=>`${xat(i).toFixed(1)},${yat(m[s.key]).toFixed(1)}`).join(' ');
    lines+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    ms.forEach((m,i)=>{lines+=`<circle cx="${xat(i).toFixed(1)}" cy="${yat(m[s.key]).toFixed(1)}" r="3.5" fill="${s.color}"/><text x="${xat(i).toFixed(1)}" y="${(yat(m[s.key])-7).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="${s.color}">${m[s.key]}</text>`;});});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}${xlab}${lines}</svg>`;
}
function trendLabel(cur,prev){if(prev==null)return'';const d=cur-prev;
  if(d<=-3)return`<span style="color:var(--ok);font-weight:600">▼ ${Math.abs(d)}pt 改善</span>`;
  if(d>=3)return`<span style="color:var(--bad);font-weight:600">▲ ${d}pt 悪化</span>`;
  return'<span style="color:var(--soft)">ほぼ横ばい</span>';}
function renderViz(pid){
  const p=store.getPatient(pid);if(!p)return go({name:'home'});
  const ms=store.patientExams(pid).slice().reverse().map(examMetrics); // 古い→新しい
  const back=`<header class="bar"><button class="back" onclick="APP.go({name:'patientDetail',patientId:'${pid}'})">◀ 戻る</button><h1>経過グラフ・患者説明</h1><div class="sub">${esc(p.name)}　<span class="mono">${esc(p.no)}</span></div></header>`;
  if(ms.length===0){app.innerHTML=back+`<div class="wrap"><p style="text-align:center;color:var(--faint);padding:40px 0" class="card" style="margin-top:20px">検査データがありません。</p></div>`;return;}
  const latest=ms[ms.length-1],prev=ms.length>1?ms[ms.length-2]:null;
  const rSeries=[];
  if(prev)rSeries.push({name:'前回',color:'#9aa6b2',fill:'rgba(154,166,178,.12)',vals:RADAR_AXES.map(a=>prev[a.k])});
  rSeries.push({name:'今回',color:'var(--blue)',fill:'rgba(37,99,235,.18)',vals:RADAR_AXES.map(a=>latest[a.k])});
  const metricRow=(label,cur,prev,unit)=>`<div style="display:flex;flex-wrap:nowrap;align-items:baseline;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line2)">
    <span style="flex:1;min-width:0;padding-right:8px;font-size:.78rem;color:#374151">${label}</span>
    <span style="flex:0 0 auto;white-space:nowrap;text-align:right"><span class="mono" style="font-size:1.05rem;font-weight:700">${cur}${unit}</span>${prev!=null?' 　'+trendLabel(cur,prev):''}</span></div>`;
  app.innerHTML=back+`
    <div class="wrap">
      <div class="card" style="padding:18px;margin-top:20px">
        <h2 style="font-size:.9rem;font-weight:700;margin:0 0 2px">お口のリスク（${ymdJP(latest.date)}）</h2>
        <p style="font-size:.72rem;color:var(--soft);margin:0 0 6px">外側に広がるほどリスクが高い状態です。${prev?'青（今回）が灰色（前回）より内側なら改善しています。':''}</p>
        ${svgRadar(rSeries)}
        <div style="display:flex;justify-content:center;gap:18px;font-size:.72rem;color:var(--soft);margin-top:4px">
          ${prev?'<span style="display:inline-flex;align-items:center;gap:5px"><i style="width:12px;height:12px;border-radius:3px;background:rgba(154,166,178,.4);border:1px solid #9aa6b2"></i>前回</span>':''}
          <span style="display:inline-flex;align-items:center;gap:5px"><i style="width:12px;height:12px;border-radius:3px;background:rgba(37,99,235,.25);border:1px solid var(--blue)"></i>今回</span>
        </div>
      </div>
      <div class="card" style="padding:18px;margin-top:14px">
        <h2 style="font-size:.9rem;font-weight:700;margin:0 0 2px">検査ごとの数値</h2>
        <p style="font-size:.72rem;color:var(--soft);margin:0 0 6px">今回の状態（前回との差）。すべて残っている歯に対する割合です。</p>
        ${metricRow('出血のある歯',latest.bop,prev?prev.bop:null,'%')}
        ${metricRow('4mm以上のポケットがある歯',latest.deep,prev?prev.deep:null,'%')}
        ${metricRow('6mm以上の深いポケットがある歯',latest.severe,prev?prev.severe:null,'%')}
        ${metricRow('揺れている歯',latest.mobile,prev?prev.mobile:null,'%')}
        ${metricRow('平均ポケット深さ',latest.meanPpd,null,'mm')}
      </div>
      ${ms.length>1?`<div class="card" style="padding:18px;margin-top:14px">
        <h2 style="font-size:.9rem;font-weight:700;margin:0 0 2px">これまでの推移</h2>
        <p style="font-size:.72rem;color:var(--soft);margin:0 0 8px">数値が下がるほど良い状態です（縦軸＝該当する歯の割合%）。</p>
        ${svgTrend(ms,[{name:'出血',key:'bop',color:'var(--bop)'},{name:'4mm以上',key:'deep',color:'var(--amber)'}])}
        <div style="display:flex;justify-content:center;gap:18px;font-size:.72rem;color:var(--soft);margin-top:6px">
          <span style="display:inline-flex;align-items:center;gap:5px"><i style="width:12px;height:3px;border-radius:2px;background:var(--bop)"></i>出血のある歯</span>
          <span style="display:inline-flex;align-items:center;gap:5px"><i style="width:12px;height:3px;border-radius:2px;background:var(--amber)"></i>4mm以上の歯</span>
        </div>
      </div>`:'<p class="note">推移グラフは検査が2回以上になると表示されます。</p>'}
      <p class="note">※ PCR（プラーク付着率）は現在未計測。染め出し入力に対応したら軸に追加予定。</p>
    </div>`;
}

// ───────── PDF出力 / 印刷（紙チャート風レイアウト・window.print()） ─────────
function ppdSpan(v){if(v==null)return '·';const cls=v>=6?'deep dU':v>=4?'deep':'';return cls?`<span class="${cls}">${v}</span>`:String(v);}
function basicArch(list,teeth){
  const th=list.map(n=>`<th>${toothDisp(n,teeth[n])}</th>`).join('');
  const ppd=list.map(n=>{const t=teeth[n];if(t.missing)return '<td class="miss">欠</td>';if(t.primary)return '<td style="color:#7c3aed">乳</td>';return `<td>${ppdSpan(t.ppd)}${t.bop?'<i class="bopdot">•</i>':''}${t.pus?'<i class="pusdot">•</i>':''}</td>`;}).join('');
  const mob=list.map(n=>{const t=teeth[n];if(t.missing)return '<td class="miss"></td>';if(t.primary)return '<td style="color:#7c3aed">乳</td>';return `<td>${t.mobility?t.mobility:'−'}</td>`;}).join('');
  return `<table class="pchart"><thead><tr><th class="rl">歯番</th>${th}</tr></thead><tbody>
    <tr><td class="rl">PPD・BOP</td>${ppd}</tr>
    <tr><td class="rl">動揺度</td>${mob}</tr></tbody></table>`;
}
function precArch(list,teeth){
  const th=list.map(n=>`<th>${n}</th>`).join('');
  const siteRow=(keys)=>list.map(n=>{const t=teeth[n];if(t.missing)return '<td class="miss">欠</td>';
    return `<td>${keys.map(k=>{const i=SITE6.indexOf(k);const v=t.ppd6?t.ppd6[i]:null;const bop=t.bop6&&t.bop6[i];return `<span class="s">${ppdSpan(v)}${bop?'<i class="bopdot">•</i>':''}</span>`;}).join('')}</td>`;}).join('');
  const mob=list.map(n=>{const t=teeth[n];if(t.missing)return '<td class="miss"></td>';return `<td>${t.mobility?t.mobility:'−'}</td>`;}).join('');
  return `<table class="pchart"><thead><tr><th class="rl">歯番</th>${th}</tr></thead><tbody>
    <tr><td class="rl">頬側<br><small>近 中 遠</small></td>${siteRow(['mb','b','db'])}</tr>
    <tr><td class="rl">舌側<br><small>近 中 遠</small></td>${siteRow(['ml','l','dl'])}</tr>
    <tr><td class="rl">動揺度</td>${mob}</tr></tbody></table>`;
}
function buildPrint(patient,ex){
  const type=ex.type||'basic';const st=examStats(ex.teeth,type);const a=patient?computeAge(patient.birth):null;
  const arch=(list)=>type==='precision'?precArch(list,ex.teeth):basicArch(list,ex.teeth);
  return `
    <div class="phead">
      <div class="pttl">歯周組織検査記録　<span class="ptag">${EXAM_LABEL[type]}</span></div>
      <table class="pinfo"><tbody>
        <tr><td><b>患者</b>　${esc(patient?patient.name:'')}（${esc(patient?patient.no:'')}${patient&&patient.chartNo?' / カルテ '+esc(patient.chartNo):''}）</td>
            <td><b>生年月日</b>　${ymdJP(patient?patient.birth:'')}${a!=null?'（'+a+'歳）':''}　${patient&&patient.gender==='female'?'女':patient&&patient.gender==='male'?'男':''}</td>
            <td><b>検査日</b>　${ymdJP(ex.date)}</td>
            <td><b>担当</b>　${esc(ex.examiner||'')}</td></tr>
      </tbody></table>
      <div class="psum">BOP率 <b>${st.bopPct==null?'—':st.bopPct+'%'}</b>　／　4mm以上 <b>${st.deep}</b>${st.deepUnit}　／　記録歯数 <b>${st.measured}</b></div>
    </div>

const DOC_BADGE={s1i:['var(--warn)','var(--warn-bg)'],s1c:['var(--blue-d)','var(--blue-bg)'],s3:['#0f766e','var(--ok-bg)']};

function docOpts(f){if(f==='plan')return dc.kind==='s1i'?D_PLAN.concat(['継続的な口腔機能の管理']):D_PLAN;return D_OPT[f];}
// 歯式の状態：0=現在歯 / 1=欠損（×） / 2=乳歯が現在（永久歯は未萌出）
function docTeethFromExam(ex){const t={};ORDER.forEach(n=>{t[n]=0;});
  if(ex)ORDER.forEach(n=>{const x=ex.teeth[n];if(!x)return;if(x.missing)t[n]=1;else if(x.primary)t[n]=2;});
  return t;}
function docPresent(teeth){let c=0;ORDER.forEach(n=>{const st=teeth[n]||0;if(st===0||st===2)c++;});return c;}
// 直近の検査から様式1の「歯や歯肉の状態」を自動判定
function newDocData(kind,pid){
  const ex=store.patientExams(pid)[0]||null;
  const base={date:ymdToday(),teeth:docTeethFromExam(ex),examRef:ex?ex.date:null,doctor:store.clinic.doctor||''};
  if(kind==='s3'){
    let bleed=false;
    if(ex){const st=examStats(ex.teeth,ex.type||'basic');bleed=st.bopPct!=null&&st.bopPct>0;}
    return Object.assign(base,{state:bleed?['歯ぐきに発赤・出血・腫れがあります']:[],statePart:'',other:[],otherText:'',guidance:[],lip:'',tongue:'',timeFrom:'',timeTo:'',hygienist:''});
  }
  let p4='',mob='';
  if(ex){let any4=false,anyM=false;ORDER.forEach(n=>{const x=ex.teeth[n];if(!x||x.missing||x.primary)return;const mx=toothMaxPpd(x);if(mx!=null&&mx>=4)any4=true;if(x.mobility>0)anyM=true;});p4=any4?'有':'無';mob=anyM?'有':'無';}
  const d=Object.assign(base,{pocket4:p4,mobility:mob,swelling:'',plaque:'',caries:'',toothOther:'',
    oralFuncNone:false,oralFunc:[],pedoFuncNone:false,pedoFunc:[],pedoOther:'',remarks:'',
    goals:[],goalsOther:'',plan:[],planPrev:[],planOther:'',
    disease:[],diseaseOther:'',maina:false,medState:'',medsText:'',smoke:false,habitOther:'',otherTop:'',
    pastTx:[],pastTxOther:''});
  if(kind==='s1c'){ // 前回の様式1から引き継ぎ（検査由来の項目は上で最新化済み）
    const pv=store.patientDocs(pid).find(x=>x.kind==='s1i'||x.kind==='s1c');
    if(pv){const pd=pv.data;
      ['swelling','plaque','caries','toothOther','remarks','goalsOther'].forEach(k=>{if(pd[k])d[k]=pd[k];});
      ['oralFunc','pedoFunc','goals'].forEach(k=>{d[k]=(pd[k]||[]).slice();});
      d.oralFuncNone=!!pd.oralFuncNone;d.pedoFuncNone=!!pd.pedoFuncNone;}
  }
  return d;
}
// 口腔内の状況：実物用紙と同じ「楕円アーチ＋乳歯内側」の歯式図（インラインSVG・タップで 現在→欠損→乳歯）
function docArchSVG(teeth,editable){
  const W=480,H=336,cx=240,cy=168;
  let s='';
  const ln=(x1,y1,x2,y2,st)=>`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" ${st}/>`;
  const cross=(x,y,r)=>{const k=r*0.7;return ln(x-k,y-k,x+k,y+k,'stroke="#ccd2d9" stroke-width="1"')+ln(x-k,y+k,x+k,y-k,'stroke="#ccd2d9" stroke-width="1"');};
  const xmark=(x,y,r)=>{const k=r*0.8;return ln(x-k,y-k,x+k,y+k,'stroke="#333" stroke-width="2.6"')+ln(x-k,y+k,x+k,y-k,'stroke="#333" stroke-width="2.6"');};
  function drawPerm(list,lower){
    const n=list.length,rx=204,ry=138,r=13,sgn=lower?1:-1;
    list.forEach((t,i)=>{const th=Math.PI*(1-(i+0.5)/n);
      const x=cx+rx*Math.cos(th),y=cy+sgn*ry*Math.sin(th);
      const lx=cx+(rx+21)*Math.cos(th),ly=cy+sgn*(ry+21)*Math.sin(th);
      const st=teeth[t]||0;
      if(st===2)s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="#fff" stroke="#c5cbd3" stroke-width="1.2" stroke-dasharray="3 2.5"/>`;
      else if(st===1)s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="#f1f3f6" stroke="#9aa6b2" stroke-width="1.2"/>`+xmark(x,y,r);
      else s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="#fff" stroke="#333" stroke-width="1.3"/>`+cross(x,y,r);
      s+=`<text x="${lx.toFixed(1)}" y="${(ly+3.5).toFixed(1)}" text-anchor="middle" font-size="11" fill="${st===1?'#9aa6b2':'#333'}">${t%10}</text>`;
      if(editable)s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="17" fill="transparent" style="cursor:pointer" onclick="APP.docTooth(${t})"/>`;
    });
  }
  function drawDec(list,lower){
    const n=list.length,rx=127,ry=81,r=9.5,sgn=lower?1:-1;
    list.forEach((t,i)=>{const th=Math.PI*(1-(i+0.5)/n);
      const x=cx+rx*Math.cos(th),y=cy+sgn*ry*Math.sin(th);
      const lx=cx+(rx+17)*Math.cos(th),ly=cy+sgn*(ry+17)*Math.sin(th);
      const on=(teeth[t-40]||0)===2; // 乳歯FDI−40＝同位置の永久歯FDI
      s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${on?'#ede9fe':'#fff'}" stroke="${on?'#7c3aed':'#d7dce2'}" stroke-width="${on?2:1}"/>`;
      s+=`<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="middle" font-size="9" fill="${on?'#6d28d9':'#b8c0c9'}">${PRIMARY_LETTER[t%10]}</text>`;
    });
  }
  drawPerm(UPPER,false);drawPerm(LOWER,true);
  drawDec([55,54,53,52,51,61,62,63,64,65],false);drawDec([85,84,83,82,81,71,72,73,74,75],true);
  s+=`<text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="15" font-weight="700" fill="#111">（ ${docPresent(teeth)} ）本</text>`;
  s+=`<text x="24" y="26" font-size="11" fill="#666">右上</text><text x="${W-24}" y="26" text-anchor="end" font-size="11" fill="#666">左上</text><text x="24" y="${H-14}" font-size="11" fill="#666">右下</text><text x="${W-24}" y="${H-14}" text-anchor="end" font-size="11" fill="#666">左下</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${s}</svg>`;
}

// ───────── レセコンCSV 一方向取り込み（患者番号キー・手動・依存ゼロ） ─────────
// Shift_JIS / UTF-8 を自動判定（日本のレセコンは Shift_JIS が多い）
function decodeBytes(buf){
  let sj='',u8='';
  try{sj=new TextDecoder('shift_jis').decode(buf);}catch(e){}
  try{u8=new TextDecoder('utf-8',{fatal:false}).decode(buf);}catch(e){}
  const score=s=>((s||'').match(/患者|氏名|生年月日|予約|番号/g)||[]).length;
  return score(sj)>=score(u8)?(sj||u8):(u8||sj);
}
// クオート対応の簡易CSVパーサ
function parseCSV(text){
  const rows=[];let i=0,field='',row=[],inQ=false;const s=text.replace(/^﻿/,'');
  while(i<s.length){const c=s[i];
    if(inQ){if(c==='"'){if(s[i+1]==='"'){field+='"';i+=2;continue;}inQ=false;i++;continue;}field+=c;i++;continue;}
    if(c==='"'){inQ=true;i++;continue;}
    if(c===','){row.push(field);field='';i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field='';i++;continue;}
    field+=c;i++;}
  if(field!==''||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(x=>(x||'').trim()!==''));
}
function findCol(headers,cands){for(let i=0;i<headers.length;i++){const h=(headers[i]||'').replace(/\s/g,'');for(const c of cands)if(h.includes(c))return i;}return -1;}
function splitName(full){const s=(full||'').trim().replace(/[　\s]+/g,' ');const p=s.split(' ');return p.length>=2?{sei:p[0],mei:p.slice(1).join(' ')}:{sei:s,mei:''};}
function parseBirth(v){const m=String(v||'').trim().match(/(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);return m?m[1]+'-'+pad2(+m[2])+'-'+pad2(+m[3]):'';}
function processImport(rows){
  if(!rows.length)return{error:'ファイルが空か、読み取れませんでした。'};
  const headers=rows[0];
  const ci={no:findCol(headers,['患者番号']),name:findCol(headers,['患者氏名']),birth:findCol(headers,['生年月日'])};
  if(ci.no<0||ci.name<0)return{error:'「患者番号」「患者氏名」の列見出しが見つかりませんでした。CSVの1行目に見出しが含まれているか確認してください。'};
  const byNo={};
  for(let r=1;r<rows.length;r++){const row=rows[r];const recNo=(row[ci.no]||'').trim();if(!recNo)continue;
    const nm=splitName(row[ci.name]);const birth=ci.birth>=0?parseBirth(row[ci.birth]):'';
    const cur=byNo[recNo]||{recNo,sei:'',mei:'',birth:''};
    if(nm.sei)cur.sei=nm.sei;cur.mei=nm.mei;if(birth)cur.birth=birth;byNo[recNo]=cur;}
  const items=Object.values(byNo).map(p=>{const name=(p.sei+' '+p.mei).trim();
    const ex=store.patients.find(x=>x.recNo===p.recNo);
    let status='new';if(ex)status=(ex.name!==name||(p.birth&&ex.birth!==p.birth))?'update':'same';
    return{...p,name,status,exId:ex?ex.id:null};});
  return{items,total:rows.length-1,
    counts:{new:items.filter(i=>i.status==='new').length,update:items.filter(i=>i.status==='update').length,same:items.filter(i=>i.status==='same').length}};
}
function applyImport(items){let added=0,updated=0;
  items.forEach(it=>{
    if(it.status==='new'){const np={id:generateId(),no:store.nextNo(),recNo:it.recNo,chartNo:'',sei:it.sei,mei:it.mei,seiKana:'',meiKana:'',name:it.name,kana:'',birth:it.birth,gender:'',notes:''};db.savePatient(np,true);added++;}
    else if(it.status==='update'){const p=store.getPatient(it.exId);if(p){p.sei=it.sei;p.mei=it.mei;p.name=it.name;if(it.birth)p.birth=it.birth;db.savePatient(p,false);updated++;}}});
  return{added,updated};
}

// ───────── 音声入力（一点法・Web Speech API・依存ゼロ） ─────────
// 巡回順（絶対ルール）：右上8→1 → 左上1→8 → 左下8→1 → 右下1→8。欠損歯は自動スキップ。
const VORDER=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28,38,37,36,35,34,33,32,31,41,42,43,44,45,46,47,48];
const VQUAD={'右上':1,'左上':2,'左下':3,'右下':4};
const VQNAME={1:'右上',2:'左上',3:'左下',4:'右下'};
const vToothName=n=>VQNAME[Math.floor(n/10)]+(n%10);
const vc={active:false,engine:null,mode:'ppd',bopKind:'bop',bopQuad:null,cursor:null,lastTooth:null,sound:true,echo:false,log:[],undo:[],
  heard:'',heardFinal:false,
  avail:!!(window.SpeechRecognition||window.webkitSpeechRecognition)};
const VMODE_LABEL={ppd:'深さ入力',bop:'BOP・排膿入力',mob:'動揺度入力'};
const VMODE_HINT={ppd:'数字を連続で／「右上1から」「右上4は5」「ポケットすべて3」',bop:'「右上4」で出血＋／「右上4なし」で解除／「すべてなし」',mob:'数字0-3を連続で／「右上3は2」「動揺度右上が1でその他すべて0」'};
// 音声認識テキストの正規化（全角/漢数字→算用数字、かな方角、フィラー除去）
function vNorm(s){
  s=(s||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  s=s.replace(/[BbＢｂ][OoＯｏ][PpＰｐ]/g,'出血').replace(/ビーオーピー?/g,'出血'); // BOP＝出血の別名
  s=s.replace(/出血プラス|出血ぷらす|出血陽性|出血あり/g,'出血').replace(/出血マイナス|出血まいなす|出血陰性/g,'出血なし'); // 「BOPプラス」→出血
  // 別名の統一
  s=s.replace(/ブリーディング|しゅっけつ|出欠|しゅけつ/g,'出血');
  s=s.replace(/はいのう|排のう|廃農|排農/g,'排膿');
  s=s.replace(/抜歯|脱落|抜けてる|抜けている|抜けてます|喪失/g,'欠損');
  s=s.replace(/モビリティ|どうよう/g,'動揺');
  s=s.replace(/ポケットの?深さ|ぽけっと/g,'ポケット');
  s=s.replace(/みぎうえ|右上顎|上顎右/g,'右上').replace(/ひだりうえ|左上顎|上顎左/g,'左上').replace(/みぎした|右下顎|下顎右/g,'右下').replace(/ひだりした|左下顎|下顎左/g,'左下');
  // 「一個前に戻る」等のundo系を「取り消し」に統一（「戻す」他動詞＝undo、「戻る」自動詞＝歯移動は別）
  s=s.replace(/(?:一個|1個|いっこ|一つ|ひとつ|1つ)(?:前)?(?:に)?戻る|一個前|いっこまえ|1個前|元に戻す|戻す/g,'取り消し');
  s=s.replace(/まで/g,'迄'); // 「で」除去より先に保護（範囲指定用）
  // 単位・番号・言い淀み・助詞（意味を持たない語）を除去
  s=s.replace(/ミリメートル|ミリ|みり|㎜|ｍｍ|mm/gi,'');
  s=s.replace(/番目|ばんめ|番|ばん/g,'');
  s=s.replace(/えーと|ええと|えっと|あのー|あの|そのー|えー|あー|んー|うーん|まあ/g,'');
  s=s.replace(/と|、|および|ならびに/g,''); // 連続列挙の接続「と」等を除去（左上7と6と5→左上765）
  s=s.replace(/十五/g,'15').replace(/十四/g,'14').replace(/十三/g,'13').replace(/十二/g,'12').replace(/十一/g,'11').replace(/十/g,'10');
  const KJ={'〇':'0','零':'0','一':'1','二':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9'};
  s=s.replace(/[〇零一二三四五六七八九]/g,c=>KJ[c]);
  s=s.replace(/ゼロ|ぜろ|れい/g,'0');

  s=s.replace(/(右上|左上|右下|左下|[0-9])の/g,'$1');
  s=s.replace(/です|ました|ます|お願いします|ください|、|。|，|．|・|！|？|\s+|で/g,'');

}
// 解釈器：正規化済みテキスト → コマンド列（純関数・テスト可能）。cm=解析中モード（発話内のモード切替に追従）
function vParse(s,mode){
  const cmds=[];let noise='';let cm=mode||'ppd';
  if(/^1[0-5]$/.test(s))return{cmds:[{t:'digit',v:+s}],noise:''}; // 「じゅうに」等の単独10-15
  // 各要素 [正規表現, 生成関数, フラグ]。フラグ'nobop'＝BOPモードでは無効（複数歯連続入力のため）
  const RES=[
    [/^(右上|左上|右下|左下)([1-8])から(右上|左上|右下|左下)?([1-8])迄(1[0-5]|[0-9])/,m=>({t:'range',from:VQUAD[m[1]]*10+ +m[2],toQuad:m[3]?VQUAD[m[3]]:null,toDigit:+m[4],v:+m[5]})],
    [/^(右上|左上|右下|左下)([1-8])欠損/,m=>({t:'missingAt',tooth:VQUAD[m[1]]*10+ +m[2]})],
    [/^(右上|左上|右下|左下)([1-8])から/,m=>({t:'cursor',tooth:VQUAD[m[1]]*10+ +m[2]})],
    // 複数歯に一括代入「右上12が1」（方角＋複数桁＋が＋値）。動揺度接頭辞つきはmob固定
    [/^動揺度(右上|左上|右下|左下)([1-8]+)が(1[0-5]|[0-9])/,m=>({t:'teethSet',target:'mob',q:VQUAD[m[1]],digs:m[2],v:+m[3]})],
    [/^(右上|左上|右下|左下)([1-8]+)が(1[0-5]|[0-9])/,m=>({t:'teethSet',target:null,q:VQUAD[m[1]],digs:m[2],v:+m[3]})],
    [/^その他は?(?:すべて|全て|全部)?は?(1[0-5]|[0-9])/,m=>({t:'others',v:+m[1]})],
    [/^(?:ポケット|深さ)は?(?:すべて|全て|全部)(1[0-5]|[0-9])/,m=>({t:'bulk',target:'ppd',v:+m[1]})],
    [/^動揺度?は?(?:すべて|全て|全部)([0-9])/,m=>({t:'bulk',target:'mob',v:+m[1]})],
    [/^(?:すべて|全て|全部)は?なし/,()=>({t:'bulkBopOff'})],
    [/^(?:すべて|全て|全部)は?(1[0-5]|[0-9])/,m=>({t:'bulk',target:null,v:+m[1]})],
    [/^動揺度?(右上|左上|右下|左下)が([0-9])/,m=>({t:'quad',target:'mob',q:VQUAD[m[1]],v:+m[2]})],
    [/^(右上|左上|右下|左下)が([0-9])/,m=>({t:'quad',target:null,q:VQUAD[m[1]],v:+m[2]})],
    [/^(右上|左上|右下|左下)([1-8])は(1[0-5]|[0-9])/,m=>({t:'assign',tooth:VQUAD[m[1]]*10+ +m[2],v:+m[3]})],
    [/^(右上|左上|右下|左下)([1-8])なし/,m=>({t:'toothOff',tooth:VQUAD[m[1]]*10+ +m[2]})],
    [/^(右上|左上|右下|左下)([1-8])(1[0-5]|[0-9])/,m=>({t:'assign',tooth:VQUAD[m[1]]*10+ +m[2],v:+m[3]}),'nobop'],
    [/^(右上|左上|右下|左下)([1-8])/,m=>({t:'tooth',tooth:VQUAD[m[1]]*10+ +m[2]})],
    [/^欠損/,()=>({t:'missing'})],
    [/^排膿(?:入力)?/,()=>({t:'bopEnter',kind:'pus'})],
    [/^(?:出血なし|マイナス|まいなす|陰性|消す|クリア)/,()=>({t:'bopEnter',kind:'none'})],
    [/^(?:出血入力|出血あり|出血|プラス|ぷらす|陽性)/,()=>({t:'bopEnter',kind:'bop'})],
    [/^動揺度?(?:入力)?/,()=>({t:'mode',m:'mob'})],
    [/^(?:深さ|ポケット)(?:入力)?/,()=>({t:'mode',m:'ppd'})],
    [/^(?:取り消し|取消|訂正)/,()=>({t:'undo'})],
    [/^次(?:へ)?/,()=>({t:'step',d:1})],
    [/^(?:戻る|前へ|前)/,()=>({t:'step',d:-1})],
    [/^([0-9])/,m=>({t:'digit',v:+m[1]})],
  ];
  let i=0;
  while(i<s.length){const sub=s.slice(i);let hit=false;
    for(const r of RES){if(r[2]==='nobop'&&cm==='bop')continue;const m=sub.match(r[0]);if(m){const c=r[1](m);cmds.push(c);i+=m[0].length;hit=true;
      if(c.t==='bopEnter')cm='bop';else if(c.t==='mode')cm=c.m;else if(c.t==='teethSet'&&c.target==='mob')cm='mob';break;}}
    if(!hit){noise+=s[i];i++;}}
  return{cmds,noise};
}
// 検査対象外（欠損＝歯なし／乳歯＝P混検では検査しない）はスキップ
const vSkip=n=>{const x=pe.teeth[n];return x.missing||x.primary;};
// カーソル移動（VORDER基準・欠損/乳歯スキップ）
function vFirstFrom(tooth){let idx=tooth==null?0:VORDER.indexOf(tooth);if(idx<0)idx=0;
  for(let k=idx;k<VORDER.length;k++){const n=VORDER[k];if(pe&&!vSkip(n))return n;}return null;}
function vNextAfter(tooth){const idx=VORDER.indexOf(tooth);if(idx<0)return null;
  for(let k=idx+1;k<VORDER.length;k++){const n=VORDER[k];if(!vSkip(n))return n;}return null;}
function vPrevBefore(tooth){const idx=tooth==null?VORDER.length:VORDER.indexOf(tooth);
  for(let k=idx-1;k>=0;k--){const n=VORDER[k];if(!vSkip(n))return n;}return null;}
// 実行：コマンド列 → 既存stateへ反映（undo記録つき）
function vApply(res,rawText){
  if(!pe||!isOnePoint(pe.type))return;
  let ok=0,rej=0;const notes=[];const quadsSeen=new Set();
  const willEdit=res.cmds.some(c=>!['mode','step','undo'].includes(c.t)); // 実際に値を変える発話か
  if(willEdit)pushHist(); // 1発話＝1回のundo単位
  const rec=(t,f,v)=>{pe.teeth[t][f]=v;};
  const target=tg=>tg||vc.mode;
  const setVal=(t,tg,v)=>{const x=pe.teeth[t];if(!x||x.missing||x.primary)return false;
    if(tg==='ppd'){if(v<0||v>15)return false;rec(t,'ppd',v);}
    else if(tg==='mob'){if(v<0||v>3)return false;rec(t,'mobility',v);}

  const BKN={bop:'BOP＋',pus:'排膿',none:'BOP−'};
  const applyBK=(n,kind)=>{const x=pe.teeth[n];if(!x||x.missing||x.primary)return false;
    if(kind==='bop'){rec(n,'bop',true);rec(n,'pus',false);}else if(kind==='pus'){rec(n,'pus',true);rec(n,'bop',false);}else{rec(n,'bop',false);rec(n,'pus',false);}return true;};

  for(const c of res.cmds){
    const pf=pendFrom;pendFrom=null;
    if(c.t==='mode'){vc.mode=c.m;vc.bopQuad=null;notes.push(VMODE_LABEL[c.m]);ok++;continue;}
    if(c.t==='bopEnter'){vc.mode='bop';vc.bopKind=c.kind;vc.bopQuad=null;
      if(just!=null&&applyBK(just,c.kind)){vc.lastTooth=just;vc.bopQuad=Math.floor(just/10);notes.push(vToothName(just)+BKN[c.kind]);}
      else notes.push(BKN[c.kind]+'モード');ok++;continue;}

      for(const d of c.digs){const tn=c.q*10+ +d;if(setVal(tn,tg,c.v)){cnt++;ns+=d;}}
      if(cnt){vc.lastTooth=c.q*10+ +c.digs[c.digs.length-1];notes.push(VQNAME[c.q]+ns+'が'+c.v);ok++;}else rej++;continue;}
    if(c.t==='cursor'){
      if(vc.mode==='bop'){if(applyBK(c.tooth,vc.bopKind)){vc.cursor=c.tooth;vc.lastTooth=c.tooth;pendFrom=c.tooth;vc.bopQuad=Math.floor(c.tooth/10);notes.push(vToothName(c.tooth)+'から');ok++;}else rej++;continue;}
      const n=vFirstFrom(c.tooth);if(n){vc.cursor=n;notes.push(vToothName(n)+'から');ok++;}else rej++;continue;}
    if(c.t==='digit'){
      if(vc.mode==='bop'){
        if(pf!=null){ // 「◯から」の範囲終点（位置）として塗る＝「左下3から3」
          const si=VORDER.indexOf(pf);let ei=-1;for(let k=si+1;k<VORDER.length;k++)if(VORDER[k]%10===c.v){ei=k;break;}
          if(si>=0&&ei>si){let cnt=0;for(let k=si+1;k<=ei;k++)if(applyBK(VORDER[k],vc.bopKind))cnt++;
            if(cnt){vc.cursor=vc.lastTooth=VORDER[ei];notes.push(vToothName(pf)+'から'+vToothName(VORDER[ei])+BKN[vc.bopKind]);ok++;}else rej++;}else rej++;}
        else if(vc.bopQuad&&c.v>=1&&c.v<=8){ // 直前の方角＋数字＝同方角の歯に連続塗り「左上765」
          const tn=vc.bopQuad*10+c.v;if(applyBK(tn,vc.bopKind)){vc.cursor=vc.lastTooth=tn;notes.push(vToothName(tn)+BKN[vc.bopKind]);ok++;}else rej++;}
        else rej++;continue;}

    if(c.t==='tooth'){
      if(vc.mode==='bop'){if(applyBK(c.tooth,vc.bopKind)){vc.cursor=c.tooth;vc.lastTooth=c.tooth;just=c.tooth;vc.bopQuad=Math.floor(c.tooth/10);notes.push(vToothName(c.tooth)+BKN[vc.bopKind]);ok++;}else rej++;}
      else{const n=vFirstFrom(c.tooth);if(n){vc.cursor=n;vc.lastTooth=n;just=n;notes.push(vToothName(n)+'へ');ok++;}else rej++;}continue;}

        if(vc.cursor===c.tooth)vc.cursor=vNextAfter(c.tooth);notes.push(vToothName(c.tooth)+'欠損');ok++;}else rej++;continue;}
    if(c.t==='range'){ // 「右上3から(左上)3まで0」：巡回順で区間一括。終点の部位省略時は巡回順で次に現れる同番の歯
      const si=VORDER.indexOf(c.from);let ei=-1;
      if(si>=0){
        if(c.toQuad!=null)ei=VORDER.indexOf(c.toQuad*10+c.toDigit);
        else for(let k=si+1;k<VORDER.length;k++)if(VORDER[k]%10===c.toDigit){ei=k;break;}
      }
      if(si<0||ei<si){rej++;continue;}
      let cnt=0;
      if(vc.mode==='bop'){for(let k=si;k<=ei;k++)if(applyBK(VORDER[k],vc.bopKind))cnt++;}
      else for(let k=si;k<=ei;k++){if(setVal(VORDER[k],vc.mode,c.v))cnt++;}
      if(cnt){vc.lastTooth=VORDER[ei];vc.cursor=vNextAfter(VORDER[ei]);
        notes.push(vToothName(c.from)+'から'+vToothName(VORDER[ei])+'まで'+(vc.mode==='bop'?BKN[vc.bopKind]:c.v));ok++;}else rej++;continue;}
    if(c.t==='bulk'){const tg=target(c.target);if(c.target)vc.mode=c.target;let cnt=0;
      ORDER.forEach(n=>{if(setVal(n,tg,c.v))cnt++;});
      if(cnt){notes.push((tg==='ppd'?'ポケット':'動揺度')+'すべて'+c.v);ok++;}else rej++;continue;}
    if(c.t==='quad'){const tg=target(c.target);if(c.target)vc.mode=c.target;let cnt=0;
      ORDER.forEach(n=>{if(Math.floor(n/10)===c.q&&setVal(n,tg,c.v))cnt++;});
      if(cnt){notes.push(VQNAME[c.q]+'が'+c.v);ok++;}else rej++;continue;}
    if(c.t==='others'){const tg=vc.mode;let cnt=0; // 「その他」＝まだ値を入れていない歯（未入力=null）だけに設定。既入力の歯は上書きしない
      ORDER.forEach(n=>{const x=pe.teeth[n];if(x.missing||x.primary)return;const cur=(tg==='mob')?x.mobility:x.ppd;if(cur==null&&setVal(n,tg,c.v))cnt++;});
      if(cnt){notes.push('その他すべて'+c.v);ok++;}else rej++;continue;}
    if(c.t==='bulkBopOff'){ORDER.forEach(n=>{const x=pe.teeth[n];if(!x.missing){if(x.bop)rec(n,'bop',false);if(x.pus)rec(n,'pus',false);}});notes.push('出血・排膿すべて−');ok++;continue;}
    if(c.t==='undo'){if(undoOne()){notes.push('取り消し');vc.cursor=null;ok++;}else rej++;continue;}
    if(c.t==='step'){const n=c.d>0?(vc.cursor?vNextAfter(vc.cursor):vFirstFrom(null)):vPrevBefore(vc.cursor);

  }
  if(willEdit){pe.dirty=true;refreshSaveBtn();}
  refreshMissBar();
  // 画面反映（カーソル位置をpe.selに反映してから歯式を再描画＝ハイライト追従）
  pe.sel=vc.cursor;
  refreshArch();updateStats();
  if(vc.cursor){const el=document.querySelectorAll('.tooth')[ORDER.indexOf(vc.cursor)];if(el)el.scrollIntoView({inline:'center',block:'nearest'});}
  renderEditor();

  if(vc.sound)vBeep(rej===0&&ok>0);

  vc.log.unshift({raw:rawText,note:notes.join('、')||'（解釈できず）',rej});
  vc.log=vc.log.slice(0,8);

}
function vHandle(raw){
  vc.heard=(raw||'').trim();vc.heardFinal=true;
  const s=vNorm(raw);
  if(!s){vc.log.unshift({raw:vc.heard,note:'（数字・歯番として認識できず）',rej:1});vc.log=vc.log.slice(0,8);if(vc.sound)vBeep(false);vRefreshPanel();return;}
  vApply(vParse(s,vc.mode),raw);
}
function vHeardHTML(){return vc.heard?`<span style="color:${vc.heardFinal?'#111':'#94a3b8'};font-weight:600">${esc(vc.heard)}</span>`:'<span style="color:var(--faint)">（マイクに向かって話してください…）</span>';}
function vUpdateHeard(){const el=document.getElementById('v-heard');if(el)el.innerHTML=vHeardHTML();}
// ビープ（WebAudio・音源ファイル不要）
let vAudioCtx=null;
function vBeep(okTone){try{vAudioCtx=vAudioCtx||new (window.AudioContext||window.webkitAudioContext)();

// 音声エンジン（continuous＋自動再開。final結果のみ処理）
function vMakeEngine(){

}
function vDiag(){const ua=navigator.userAgent||'';

    inApp:/(FBAN|FBAV|Instagram|Line|Twitter|MicroMessenger|; wv)/i.test(ua),
    otherBrowser:/(CriOS|FxiOS|EdgiOS|OPiOS)/.test(ua)};}
function vStart(){
  if(!pe||!isOnePoint(pe.type))return;

      :d.inApp?'アプリ内ブラウザでは動きません。画面の共有/…アイコンから「Safariで開く」を選んでください。'
      :'この端末/ブラウザは音声認識に非対応です。iPadはSafariで開き、設定→一般→キーボード→「音声入力」をONにしてください。';

// 統一undo：編集直前に歯式スナップショットを積む（タップ・編集・音声すべて対象）
function pushHist(){if(!pe)return;(pe.hist=pe.hist||[]).push(clone(pe.teeth));if(pe.hist.length>80)pe.hist.shift();}
function undoOne(){if(!pe||!pe.hist||!pe.hist.length)return false;pe.teeth=pe.hist.pop();if(pe.sel!=null&&!pe.teeth[pe.sel])pe.sel=null;return true;}
function mut(fn){if(pe.readOnly)return;pushHist();fn();}
function afterChange(n){pe.dirty=true;refreshSaveBtn();refreshTooth(n);updateStats();renderEditor();refreshMissBar();}

  // perio
  peField:(k,v)=>{pe[k]=v;pe.dirty=true;refreshSaveBtn();},
  setTapMode:m=>{pe.tapMode=(pe.tapMode===m?null:m);if(pe.tapMode){pe.sel=null;renderEditor();}refreshArch();refreshMissBar();},
  setBopPaint:v=>{pe.bopPaint=v;refreshMissBar();},

  undo:()=>{if(undoOne()){pe.dirty=true;refreshSaveBtn();refreshArch();updateStats();refreshMissBar();renderEditor();toast('1つ戻しました');}else toast('これ以上戻せません');},
  selTooth:n=>{
    const t=pe.teeth[n];const tm=pe.tapMode;
    if(tm==='miss'){pushHist();t.missing=!t.missing;if(t.missing){t.ppd=null;t.mobility=null;t.bop=false;t.pus=false;t.ppd6=null;t.bop6=null;}pe.dirty=true;refreshSaveBtn();refreshTooth(n);updateStats();refreshMissBar();return;}
    if(tm==='prim'){if(canBePrimary(n)&&!t.missing){pushHist();t.primary=!t.primary;if(t.primary){t.ppd=null;t.mobility=null;t.bop=false;t.pus=false;t.ppd6=null;t.bop6=null;}pe.dirty=true;refreshSaveBtn();refreshTooth(n);updateStats();refreshMissBar();}return;}
    if(tm==='bop'){if(pe.type==='precision')return;if(!t.missing&&!t.primary){pushHist();const p=pe.bopPaint;
      if(p==='bop'){const on=!(t.bop);t.bop=on;t.pus=false;}
      else if(p==='pus'){const on=!(t.pus);t.pus=on;t.bop=false;}
      else{t.bop=false;t.pus=false;}
      pe.dirty=true;refreshSaveBtn();refreshTooth(n);updateStats();}return;}
    if(tm==='mob'){if(pe.type==='precision')return;if(!t.missing&&!t.primary){pushHist();t.mobility=pe.mobPaint;pe.dirty=true;refreshSaveBtn();refreshTooth(n);}return;}
    const old=pe.sel;pe.sel=n;pe.site=0;if(old!=null)refreshTooth(old);refreshTooth(n);renderEditor();},
  selSite:i=>{pe.site=i;renderEditor();},
  setPpd:v=>{mut(()=>{const t=pe.teeth[pe.sel];if(t.missing)return;if(pe.type==='precision'){if(!t.ppd6)t.ppd6=[null,null,null,null,null,null];t.ppd6[pe.site]=v;}else t.ppd=v;});const n=pe.sel;afterChange(n);if(pe.auto&&!pe.readOnly){if(pe.type==='precision')APP.autoNextSite();else APP.advance(1,true);}},
  stepPpd:d=>{mut(()=>{const t=pe.teeth[pe.sel];if(t.missing)return;if(pe.type==='precision'){if(!t.ppd6)t.ppd6=[null,null,null,null,null,null];let cur=t.ppd6[pe.site];let v=(cur==null?(d>0?9:1):cur)+d;t.ppd6[pe.site]=Math.max(1,Math.min(15,v));}else{let v=(t.ppd==null?(d>0?9:1):t.ppd)+d;t.ppd=Math.max(1,Math.min(15,v));}});afterChange(pe.sel);},
  setMob:v=>{mut(()=>{if(!pe.teeth[pe.sel].missing)pe.teeth[pe.sel].mobility=v;});afterChange(pe.sel);},
  togBop:()=>{mut(()=>{const t=pe.teeth[pe.sel];if(t.missing)return;if(pe.type==='precision'){if(!t.bop6)t.bop6=[false,false,false,false,false,false];t.bop6[pe.site]=!t.bop6[pe.site];}else{t.bop=!t.bop;if(t.bop)t.pus=false;}});afterChange(pe.sel);},
  togPus:()=>{mut(()=>{const t=pe.teeth[pe.sel];if(t.missing||t.primary)return;t.pus=!t.pus;if(t.pus)t.bop=false;});afterChange(pe.sel);},
  togMiss:()=>{mut(()=>{const t=pe.teeth[pe.sel];t.missing=!t.missing;if(t.missing){t.ppd=null;t.mobility=null;t.bop=false;t.pus=false;t.ppd6=null;t.bop6=null;}});afterChange(pe.sel);},
  revert:()=>{mut(()=>{if(pe.baseline&&pe.baseline[pe.sel])pe.teeth[pe.sel]=clone(pe.baseline[pe.sel]);});afterChange(pe.sel);},
  toggleAuto:()=>{pe.auto=!pe.auto;renderEditor();},
  // 歯の移動は VORDER（巡回順：右上8→左上8→左下8→右下8）で統一。歯式の表示順ORDERとは別。
  advance:(dir,skip)=>{let idx=pe.sel==null?-1:VORDER.indexOf(pe.sel);for(let s=0;s<VORDER.length;s++){idx=(idx+dir+VORDER.length)%VORDER.length;const n=VORDER[idx];if(!skip||!(pe.teeth[n].missing||pe.teeth[n].primary)){APP.selTooth(n);const el=document.querySelectorAll('.tooth')[ORDER.indexOf(n)];if(el)el.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});return;}}},
  // 六点法：部位単位で前後移動（VORDER基準・歯の境界を越え、欠損歯はスキップ）
  advanceSite:(dir)=>{let vi=pe.sel==null?(dir>0?0:VORDER.length-1):VORDER.indexOf(pe.sel);let s=pe.sel==null?(dir>0?0:5):pe.site;
    for(let g=0;g<VORDER.length*6+6;g++){s+=dir;if(s>5){s=0;vi++;}if(s<0){s=5;vi--;}if(vi<0){vi=0;s=0;break;}if(vi>=VORDER.length){vi=VORDER.length-1;s=5;break;}if(!pe.teeth[VORDER[vi]].missing)break;}
    const n=VORDER[vi],old=pe.sel;pe.sel=n;pe.site=s;if(old!=null&&old!==n)refreshTooth(old);refreshTooth(n);renderEditor();
    const el=document.querySelectorAll('.tooth')[ORDER.indexOf(n)];if(el)el.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});},
  autoNextSite:()=>{if(pe.site<5){pe.site++;renderEditor();}else APP.advanceSite(1);},
  printExam:()=>{printExam(pe.patient,{teeth:pe.teeth,type:pe.type,date:pe.date,examiner:pe.examiner});},

  peSave:()=>{pe.dirty=false;if(pe.examId){const ex=store.exams.find(e=>e.id===pe.examId);if(ex){ex.date=pe.date;ex.examiner=pe.examiner;ex.teeth=clone(pe.teeth);db.saveExam(ex,false);}toast('変更を保存しました');}else{const ne={id:generateId(),patientId:pe.pid,date:pe.date,examiner:pe.examiner,type:pe.type,teeth:clone(pe.teeth)};db.saveExam(ne,true);toast('検査を保存しました');}go({name:'patientDetail',patientId:pe.pid});},
  peDelete:()=>{if(confirm('この検査（'+ymdJP(pe.date)+'）を削除しますか？この操作は取り消せません。')){pe.dirty=false;db.deleteExam(pe.examId);toast('検査を削除しました');go({name:'patientDetail',patientId:pe.pid});}},
  // 文書（様式1・様式3）

    if(k>=0)arr.splice(k,1);else{arr.push(opt);if(f==='oralFunc')dc.data.oralFuncNone=false;if(f==='pedoFunc')dc.data.pedoFuncNone=false;}

  docBool:f=>{dc.data[f]=!dc.data[f];

// バックアップJSONの復元（全置換・確認つき）
document.getElementById('bkfile').addEventListener('change',e=>{

      const when=d.savedAt?String(d.savedAt).replace('T',' ').slice(0,16):'不明';
      if(!confirm(`このバックアップで現在のデータを【すべて置き換え】ます。\n\n保存日時: ${when}\n患者 ${d.patients.length} / 検査 ${d.exams.length} / 文書 ${(d.docs||[]).length} / 担当者 ${(d.staff||[]).length}\n\nよろしいですか？`))return;
      applyLoaded(d);persistLocal();toast('バックアップから復元しました');go({name:'home'});
    }catch(err){toast('⚠ 復元に失敗：'+(err&&err.message||'不正なファイル'));}
  };

});
// ───────── セルフテスト（URLに ?selftest で起動。純関数の回帰チェック・依存ゼロ） ─────────
function runSelfTest(){
  const T=[];
  const eq=(name,got,want)=>{const g=JSON.stringify(got),w=JSON.stringify(want);T.push({name,pass:g===w,got:g,want:w});};
  const ok=(name,cond,info)=>{T.push({name,pass:!!cond,got:info==null?String(cond):String(info),want:'true'});};
  const P=(s,m)=>vParse(vNorm(s),m||'ppd').cmds;
  // --- vNorm 正規化 ---
  eq('norm 助詞・単位・語尾','右上4は5',vNorm('右上の4は5ミリです'));
  eq('norm BOP別名','出血',vNorm('BOPプラス'));
  eq('norm BOPなし','出血なし',vNorm('ビーオーピーマイナス'));
  eq('norm 列挙のと','左上765',vNorm('左上7と6と5'));
  eq('norm 言い淀み','右上3',vNorm('えーと右上3'));
  eq('norm undo系','取り消し',vNorm('一個前に戻る'));
  eq('norm 漢数字十二','12',vNorm('十二'));
  eq('norm ゼロ','0',vNorm('ぜろ'));
  eq('norm 排膿ゆれ','排膿',vNorm('排のう'));
  eq('norm 抜歯→欠損','右下6欠損',vNorm('右下6抜歯'));
  // --- vParse 文法 ---
  eq('parse 数字ラン',[3,3,3,3,3,2,2,2],P('33333222').map(c=>c.v));
  eq('parse ラン種別','digit',P('33333222')[0].t);
  eq('parse 単独12',[{t:'digit',v:12}],P('12'));
  eq('parse Xから',[{t:'cursor',tooth:11}],P('右上1からです'));
  eq('parse XはY',[{t:'assign',tooth:14,v:5}],P('右上4は5'));
  eq('parse 右上45(ppd)',[{t:'assign',tooth:14,v:5}],P('右上45'));
  eq('parse 右上45(bopでは分解)',['tooth','digit'],P('右上45','bop').map(c=>c.t));
  eq('parse 一括ppd',[{t:'bulk',target:'ppd',v:3}],P('ポケットすべて3'));
  eq('parse 動揺一括+その他',['quad','others'],P('動揺度右上が1でその他すべて0').map(c=>c.t));
  eq('parse 複数歯teethSet',[{t:'teethSet',target:'mob',q:1,digs:'12',v:1}],P('動揺度右上12が1'));
  eq('parse 範囲',[{t:'range',from:13,toQuad:null,toDigit:3,v:0}],P('右上3から3までゼロです'));
  eq('parse その場欠損',[{t:'missingAt',tooth:46}],P('右下6欠損'));
  eq('parse 出血/排膿/なし',['bop','pus','none'],[P('出血')[0].kind,P('排膿')[0].kind,P('マイナス')[0].kind]);
  eq('parse undo',[{t:'undo'}],P('取り消し'));
  eq('parse 戻る=移動',[{t:'step',d:-1}],P('戻る'));
  // --- examStats 集計 ---
  {const t=freshTeeth();eq('stats 空',{measured:0,bopPct:null},{measured:examStats(t,'basic').measured,bopPct:examStats(t,'basic').bopPct});
   t[16].ppd=4;t[16].bop=true;const s=examStats(t,'basic');eq('stats 1歯4mmBOP',{m:1,b:100,d:1},{m:s.measured,b:s.bopPct,d:s.deep});
   t[17].pus=true;eq('stats 排膿は深さ未入力でも数える',1,examStats(t,'basic').pus);
   t[15].primary=true;t[15].ppd=5;eq('stats 乳歯は除外',1,examStats(t,'basic').deep);
   const p=freshTeeth();p[16].ppd6=[4,5,3,2,3,4];p[16].bop6=[true,false,false,false,false,false];const ps=examStats(p,'precision');
   eq('stats 六点法',{m:1,d:3,b:17},{m:ps.measured,d:ps.deep,b:ps.bopPct});}
  // --- toothChanged 変更検出 ---
  {const a=freshTeeth()[11],b=freshTeeth()[11];ok('chg 同一→false',!toothChanged(a,b));
   const c={...a,pus:true};ok('chg 排膿のみ→true',toothChanged(c,b));
   const d={...a,ppd6:[1,null,null,null,null,null]},e={...b,ppd6:[2,null,null,null,null,null]};ok('chg ppd6差→true',toothChanged(d,e));}
  // --- normalizeTeeth / VORDER ---
  {const nt=normalizeTeeth({16:{ppd:4}});ok('normalize 32歯',ORDER.every(n=>nt[n]),ORDER.filter(n=>!nt[n]).length+'欠け');
   eq('normalize 値保持+既定',{ppd:4,missing:false,pus:false},{ppd:nt[16].ppd,missing:nt[16].missing,pus:nt[16].pus});}
  ok('VORDER 32歯・重複なし',VORDER.length===32&&new Set(VORDER).size===32);
  eq('VORDER 28の次は38',38,VORDER[VORDER.indexOf(28)+1]);
  eq('VORDER 31の次は41',41,VORDER[VORDER.indexOf(31)+1]);
  // --- カーソル移動（pe一時スタブ） ---
  {const saved=pe;pe={type:'basic',teeth:freshTeeth()};
   pe.teeth[18].missing=true;eq('cursor 18欠損→17開始',17,vFirstFrom(null));
   pe.teeth[28].missing=true;pe.teeth[38].missing=true;eq('cursor 27の次(28,38欠損)→37',37,vNextAfter(27));
   pe.teeth[15].primary=true;eq('cursor 乳歯スキップ 16の次→14',14,vNextAfter(16));
   pe=saved;}
  // --- CSV取り込み系 ---
  eq('csv 氏名分割',{sei:'後川',mei:'幸子'},splitName('後川 幸子'));
  eq('csv 生年月日','1979-04-23',parseBirth('1979/04/23'));
  eq('csv 列検出',1,findCol(['予約年月日','患者番号','患者氏名'],['患者番号']));
  eq('csv クオート',[['a','b,c'],['1','2']],parseCSV('a,"b,c"\n1,2'));
  // --- 描画 ---
  const fails=T.filter(t=>!t.pass);
  document.getElementById('app').innerHTML=`
    <header class="bar"><h1>セルフテスト</h1><div class="sub">v${APP_VERSION} ・ 純関数の回帰チェック</div></header>
    <div class="wrap">
      <div class="card" style="padding:18px;margin-top:20px;text-align:center">
        <div style="font-size:1.6rem;font-weight:700;color:${fails.length?'var(--bad)':'var(--ok)'}">${fails.length?'❌ '+fails.length+' 件失敗':'✅ 全 '+T.length+' 件成功'}</div>
        <div style="font-size:.78rem;color:var(--soft);margin-top:4px">${T.length} 項目実行</div>
      </div>
      <div class="card" style="padding:6px 16px;margin-top:14px;font-size:.78rem">
        ${[...fails,...T.filter(t=>t.pass)].map(t=>`<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2)">
          <span>${t.pass?'✅':'❌'}</span><span style="flex:1">${esc(t.name)}</span>
          ${t.pass?'':`<span class="mono" style="color:var(--bad);font-size:.68rem">got ${esc(t.got)} / want ${esc(t.want)}</span>`}
        </div>`).join('')}
      </div>
      <button class="btn-primary" style="margin-top:16px" onclick="location.href=location.pathname">アプリに戻る</button>
    </div>`;
}
// 未保存の検査があるときはタブ/リロードで警告
window.addEventListener('beforeunload',e=>{if((route.name==='perio'&&pe&&pe.dirty)||(route.name==='doc'&&dc&&dc.dirty)){e.preventDefault();e.returnValue='';}});
// 起動：PB接続→サーバー / 未接続→端末内保存(localStorage) / 不可→メモリ
(async function init(){
  if(/selftest/.test(location.search)){runSelfTest();return;} // ?selftest で回帰チェックのみ実行
  if(db.connected())app.innerHTML='<div style="text-align:center;color:var(--soft);padding:80px 0;font-size:.9rem">サーバーに接続中…</div>';
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){} // 端末保存の永続化を要求（iOSの自動削除対策）
  await db.load();
  render();
})();
})();
</script>
