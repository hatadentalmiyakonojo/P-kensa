<style>
  :root{
    --blue:#2563eb; --blue-d:#1d4ed8; --blue-bg:#eaf1fe;
    --bg:#eef1f5; --card:#fff; --ink:#1b2733; --soft:#556270; --faint:#6b7785;
    --line:#e2e8f0; --line2:#eef2f6;
    --ok:#0b6e60; --ok-bg:#e7f5f2; --warn:#8a5a0b; --warn-bg:#fdf2dd; --bad:#b42323; --bad-bg:#fbe7e7;
    --bop:#e23838; --amber:#f59e0b;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45;-webkit-overflow-scrolling:touch;}
  button,label{touch-action:manipulation;user-select:none;-webkit-user-select:none;}
  input,select,textarea{font-size:16px;font-family:var(--sans);}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px 48px;}
  .wrap.wide{max-width:900px;}
  header.bar{background:var(--card);box-shadow:0 1px 3px rgba(27,39,51,.06);padding:14px 18px;position:sticky;top:0;z-index:30;}
  header.bar .back{color:var(--blue);font-size:.82rem;font-weight:500;background:none;border:0;padding:0;margin-bottom:4px;cursor:pointer;}
  header.bar h1{font-size:1.05rem;margin:0;font-weight:650;}
  header.bar .sub{font-size:.72rem;color:var(--soft);margin-top:2px;}
  .card{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(27,39,51,.06),0 6px 18px rgba(27,39,51,.05);}
  .ic{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:.95rem;background:#fff;}
  .ic:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-bg);}
  label.fl{display:block;font-size:.78rem;font-weight:500;color:#374151;margin-bottom:5px;}
  .err{font-size:.72rem;color:#ef4444;margin-top:4px;}
  .btn-primary{width:100%;padding:15px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-weight:600;font-size:.95rem;cursor:pointer;}
  .btn-primary:active{background:var(--blue-d);}
  .row{display:flex;gap:12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* list */
  .plist-item{width:100%;text-align:left;border:0;background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(27,39,51,.06);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:10px;}
  .plist-item:active{background:#f8fafc;}
  .pname{font-size:1rem;font-weight:600;}
  .pkana{font-size:.72rem;color:var(--faint);margin-left:8px;}
  .pmeta{font-size:.72rem;color:var(--soft);margin-top:2px;}
  .chev{color:#cbd5e1;font-size:1.2rem;}

  /* stats */
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .stat{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(27,39,51,.06);padding:10px;text-align:center;}
  .stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.3rem;font-weight:600;}
  .stat .v.alert{color:var(--bad);}
  .stat .l{font-size:.62rem;color:var(--soft);margin-top:3px;}

  .banner{border-radius:12px;background:#fffbeb;border:1px solid #fde68a;padding:11px 14px;font-size:.85rem;color:#92400e;overflow-wrap:anywhere;word-break:break-word;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.68rem;color:var(--soft);padding:0 4px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .sw{width:13px;height:13px;border-radius:4px;}
  .amb{width:14px;height:14px;border-radius:50%;background:var(--amber);}

  /* arch */
  .arch-label{font-size:.62rem;color:var(--faint);letter-spacing:.14em;text-align:center;margin:2px 0 5px;}
  .arch{overflow-x:hidden;}
  .arch-inner{display:flex;justify-content:center;gap:6px;min-width:0;padding:2px 2px 6px;}
  .quad{display:flex;gap:3px;flex:1 1 0;min-width:0;}
  /* 領域グループ（臼歯部＝青系／前歯部＝砂色。左右の臼歯部は同色） */
  .tgroup{display:flex;gap:3px;min-width:0;border-radius:10px;padding:4px 3px;}
  .tgroup.post{background:#e9eff7;}
  .tgroup.ant{background:#f7f0e6;}
  .rlbar{display:flex;justify-content:space-between;align-items:center;padding:0 8px;}
  .rlbar .rl{font-size:.74rem;font-weight:700;color:var(--soft);}
  .tooth{position:relative;flex:1 1 0;min-width:0;min-height:70px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;padding:4px 1px 0;cursor:pointer;transition:transform .07s;overflow:hidden;}
  .tooth:active{transform:scale(.95);}
  .tooth .tn{font-family:var(--mono);font-size:.58rem;color:var(--faint);line-height:1;}
  .tooth .pp{flex:1;display:flex;align-items:center;justify-content:center;padding:2px 0;}
  .tooth .dnum{display:inline-flex;align-items:center;justify-content:center;min-width:1.55em;height:1.55em;padding:0 .12em;border-radius:999px;box-sizing:border-box;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.2rem;font-weight:600;color:#c0cad4;}
  .tooth .dnum.bop{border:2px solid var(--bop);}   /* BOP＝赤丸 */
  .tooth .dnum.pus{border:2px solid #2563eb;}       /* 排膿＝青丸 */
  .tooth .trow{width:100%;text-align:center;font-family:var(--mono);font-size:.62rem;line-height:1.55;border-top:1px solid var(--line2);}
  .tooth .trow.tmob{color:#b45309;}
  .dotb{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;}
  .dotb.bop{background:var(--bop);} .dotb.pus{background:#2563eb;}
  .tooth .prv{position:absolute;top:2px;left:3px;font-size:.5rem;font-weight:700;color:#94a3b8;line-height:1;}
  .plq-row{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-bottom:10px;}
  .plq-t{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:44px 44px 44px;gap:2px;border:1px solid var(--line);border-radius:10px;padding:2px;background:#fff;}
  .plq-t.miss{background:repeating-linear-gradient(135deg,#f1f3f6,#f1f3f6 4px,#e7eaef 4px,#e7eaef 8px);}
  .plq-t button{border:1.5px solid #fecaca;border-radius:8px;background:#fff;color:#991b1b;font-weight:700;font-size:.8rem;cursor:pointer;padding:0;}
  .plq-t button.on{background:#dc2626;border-color:#dc2626;color:#fff;}

  /* テンキーの高さ＝画面の高さから逆算（見出し・道具の列・歯式 約250px・操作盤の枠を引いた残りの1/4。56〜74px） */
  .pe-main{--padw:372px;--tmin:60px;--archmax:300px;--key:clamp(56px,calc((100vh - var(--pe-top,60px) - 432px) / 4),74px);--key:clamp(56px,calc((100dvh - var(--pe-top,60px) - 432px) / 4),74px);
    --plqh:clamp(44px,calc((100dvh - var(--pe-top,60px) - 180px) / 12),58px);}

    var authFailedToken = null;       // この合言葉で断られた → 合言葉が変わるまで自動では送らない
    var live = { state: 'off', lastError: '' };

    function copy(o) { try { return JSON.parse(JSON.stringify(o || {})); } catch (e) { return {}; } }
    function saveState() { st.sentBlobs = Object.keys(sentSet); lsSet(SKEY, st); }
    function setLive(s, err) {
      live.state = s; live.lastError = err || '';
      // 画面から外れた部品の見張りは捨てる（描き直すたびに増え続けないように）
      listeners = listeners.filter(function (l) { return !l.el || l.el.isConnected !== false; });
      listeners.forEach(function (l) { try { l.fn(status()); } catch (e) {} });
    }
    function status() {
      var c = getCfg();
      var s = isConfigured(c) ? live.state : 'off';
      if (isConfigured(c) && s === 'off') s = st.pending ? 'pending' : (st.lastOkAt ? 'ok' : 'pending');
      return { state: s, lastOkAt: st.lastOkAt || null, lastError: live.lastError, pending: !!st.pending,
        device: c && c.device, url: c && c.url, lastCounts: st.lastCounts || null, blobsSent: Object.keys(sentSet).length };
    }
    function onStatus(fn, el) {
      var l = { fn: fn, el: el || null };
      listeners.push(l);
      return function () { listeners = listeners.filter(function (x) { return x !== l; }); };
    }
    function authBlocked() { var c = getCfg(); return !!(authFailedToken && c && c.token === authFailedToken); }

    function schedule(ms) {
      if (timer) clearTimeout(timer);
      timer = setTimeout(function () { timer = null; pushNow('auto'); }, ms);
    }
    function markDirty() {
      try {
        st.gen += 1; st.pending = true; if (!st.pendingSince) st.pendingSince = now(); saveState();
        if (!isConfigured(getCfg()) || authBlocked() || restoring) return;
        retryMs = 0;
        setLive('pending');
        schedule(DEBOUNCE_MS);
      } catch (e) {}
    }

    function snapshot() {
      return Promise.resolve().then(function () { return opt.getSnapshot(); }).then(function (s) {
        if (!s || s.data == null) throw new Error('データを読み取れませんでした');
        return { data: s.data, counts: s.counts ? copy(s.counts) : null };   // 件数は写しを使う（アプリ側で書き換えられても影響しない）
      });
    }
    function putSnap(cfg, s, reason) {
      return api(cfg, 'PUT', '/v1/' + app + '/snap/' + encodeURIComponent(cfg.device), {
        data: s.data, counts: s.counts || {}, appVersion: String(opt.appVersion || ''),
        reason: reason, clientAt: new Date().toISOString()
      }, SNAP_TIMEOUT_MS);
    }

    // この端末（この名前）から初めて送るとき：同じ名前の保管データが Mac mini にあれば自動では上書きしない
    // （iPad を入れ替えて同じ名前を付けた直後に、見本データや空のデータが「最新」になるのを防ぐ）
    function firstPushCheck(cfg, reason) {
      if (reason !== 'auto' || st.intended || st.okDev === cfg.device) return Promise.resolve();
      return api(cfg, 'GET', '/v1/' + app + '/snaps', undefined, SNAP_TIMEOUT_MS).then(function (j) {
        var nf = function (x) { try { return String(x).normalize('NFC'); } catch (e) { return String(x); } };
        var mine = (j.devices || []).filter(function (d) { return nf(d.device) === nf(cfg.device); })[0];
        if (mine && mine.latest && sumCounts(mine.latest.counts) > 0) {
          var g = new Error('「' + cfg.device + '」の名前で Mac mini に保管されたデータがあります（' + countsText(mine.latest.counts) +
            (mine.latest.at ? '・' + fmtTime(mine.latest.at) : '') + '）。この端末から初めて送るので、上書きせずに止めています。前のデータを戻すなら「Mac mini から復元する」、この端末の内容で良ければ「今すぐ送る」を押してください。');
          g.kind = 'guard'; throw g;
        }
      });
    }

    function pushNow(reason) {
      var cfg = getCfg();
      if (!isConfigured(cfg)) return Promise.resolve({ ok: false, skipped: 'unconfigured' });
      if (restoring) return Promise.resolve({ ok: false, skipped: 'restoring' });
      if (reason === 'auto' && authBlocked()) return Promise.resolve({ ok: false, kind: 'auth', error: live.lastError });
      if (inflight) { again = true; return inflight; }
      if (reason === 'manual' && !st.intended) { st.intended = true; saveState(); }   // 意図した送信：失敗→再試行でも安全装置を通さない
      setLive('sending');
      var gen = st.gen;
      inflight = snapshot().then(function (s) {
        return firstPushCheck(cfg, reason).then(function () { return s; });
      }).then(function (s) {
        var total = sumCounts(s.counts);
        var prev = sumCounts(st.lastCounts);
        // 端末のデータが空になった・急に半分以下に減った（消えた・壊れた・見本データで起動した）ときは、
        // 黙って送らない。意図した削除なら設定画面の「今すぐ送る」で送れる。
        if (reason === 'auto' && s.counts && !st.intended) {
          var g = null;
          if (total === 0 && prev > 0) {
            g = new Error('この端末のデータが空になっています。Mac mini の保管分は上書きせず残しています。必要なら「Mac mini から復元」してください。');
          } else if (prev >= 10 && total < prev * 0.5) {
            g = new Error('件数が急に減ったため送信を止めています（前回 ' + prev + ' → 今回 ' + total + '）。意図した削除なら設定画面の「今すぐ送る」を押してください。');
          }
          if (g) { g.kind = 'guard'; throw g; }
        }
        return putSnap(cfg, s, reason === 'manual' ? 'manual' : 'auto').then(function (res) {
          authFailedToken = null;
          st.lastOkAt = now(); st.lastCounts = s.counts || {}; st.lastFile = res && res.file;
          st.okDev = cfg.device; st.intended = false;
          if (st.gen === gen) { st.pending = false; st.pendingSince = null; }   // 送信中に編集があれば未送信のまま
          saveState();
          return syncBlobs(cfg).then(function (b) { return { ok: true, dup: !!(res && res.dup), blobs: b }; });
        });
      }).then(function (r) {
        retryMs = 0;
        setLive(st.pending || st.blobsPending ? 'pending' : 'ok');
        // 送信中に編集・写真の差し替えがあった → 間を置かずに続きを送る
        if (st.pending || st.blobsPending) schedule(DEBOUNCE_MS);
        return r;
      }, function (err) {
        var kind = (err && err.kind) || 'app';
        if (kind === 'auth') authFailedToken = cfg.token;
        setLive(kind === 'auth' ? 'auth' : kind === 'guard' ? 'guard' : 'error', err && err.message);
        if (kind === 'net' || kind === 'server' || kind === 'app') {   // 合言葉違い・ガードは自動では打ち直さない
          retryMs = Math.min(retryMs ? retryMs * 2 : 30000, 10 * 60000);
          schedule(retryMs);
        }
        return { ok: false, error: err && err.message, kind: kind };
      }).then(function (r) {
        inflight = null;
        if (again) {
          again = false;
          if (r.ok) schedule(1000);                  // 失敗時は上の再試行の予定を上書きしない
        }
        return r;
      });
      return inflight;
    }

    function syncBlobs(cfg) {
      if (typeof opt.listBlobIds !== 'function' || typeof opt.getBlob !== 'function') return Promise.resolve({ sent: 0 });
      // 端末名が変わったら（別のアプリの設定画面で変えた場合も）、新しい名前のフォルダへ送り直す
      if (st.blobDev !== cfg.device) { sentSet = {}; st.blobDev = cfg.device; st.blobsVerifiedAt = 0; }
      st.blobsPending = true; saveState();        // 最後まで送り切るまでは「写真未完了」
      var dev = encodeURIComponent(cfg.device);
      var verify = (!st.blobsVerifiedAt || now() - st.blobsVerifiedAt > BLOB_VERIFY_MS)
        ? api(cfg, 'GET', '/v1/' + app + '/blobs/' + dev, undefined, SNAP_TIMEOUT_MS).then(function (j) {
          var srv = {}; (j.ids || []).forEach(function (id) { srv[id] = 1; });
          Object.keys(sentSet).forEach(function (id) { if (!srv[id]) delete sentSet[id]; });   // サーバーに無いものは送り直す
          st.blobsVerifiedAt = now(); saveState();
        })
        : Promise.resolve();
      var changed = false;
      return verify.then(function () { return Promise.resolve(opt.listBlobIds()); }).then(function (ids) {
        var todo = (ids || []).filter(function (id) { return !sentSet[id] && /^[A-Za-z0-9_\-][A-Za-z0-9_\-.]{0,127}$/.test(id); });
        var sent = 0, i = 0;
        function next() {
          if (i >= todo.length) return { sent: sent };
          var id = todo[i++];
          var g = blobGen[id] || 0;
          return Promise.resolve(opt.getBlob(id)).then(function (val) {
            if (val == null) return next();          // 削除済みの写真など
            var body = typeof val === 'string' ? val : JSON.stringify(val);
            return api(cfg, 'PUT', '/v1/' + app + '/blob/' + dev + '/' + encodeURIComponent(id), body, BLOB_TIMEOUT_MS).then(function () {
              if ((blobGen[id] || 0) === g) sentSet[id] = 1; else changed = true;   // 送信中に差し替わった → 次回送り直す
              sent++;
              if (sent % 5 === 0) saveState();
              return next();
            });
          });
        }
        return next();
      }).then(function (r) { st.blobsPending = changed; saveState(); return r; });
    }

    // ── 復元 ──
    function listSnaps() {
      var cfg = getCfg();
      if (!isConfigured(cfg)) return Promise.reject(new Error('先に保管庫の設定をしてください'));
      return api(cfg, 'GET', '/v1/' + app + '/snaps').then(function (j) { return j.devices || []; });
    }
    function waitIdle() { return inflight ? inflight.then(waitIdle, waitIdle) : Promise.resolve(); }
    function restoreFrom(device, file, onProgress) {
      var cfg = getCfg();
      if (!isConfigured(cfg)) return Promise.reject(new Error('先に保管庫の設定をしてください'));
      if (restoring) return Promise.reject(new Error('復元の処理中です'));
      var dev = encodeURIComponent(device);
      var prog = onProgress || function () {};
      var target = file;
      restoring = true;
      if (timer) { clearTimeout(timer); timer = null; }
      return Promise.resolve().then(function () {
        // 「最新」は控えを送る前に具体的なファイル名にしておく（控え自身を戻さないように）
        if (target && target !== 'latest') return;
        return listSnaps().then(function (devs) {
          var d = devs.filter(function (x) { return x.device === device; })[0];
          if (!d || !d.latest) throw new Error('「' + device + '」の保管データが見つかりません');
          target = d.latest.file;
        });
      }).then(waitIdle).then(function () {
        prog('復元前の状態を Mac mini に控えています…');
        // 控えは通常の送信と混ぜず、必ず専用に1回送る。送れなければ復元しない
        return snapshot().then(function (s) {
          return putSnap(cfg, s, 'pre-restore').catch(function (e) {
            throw new Error('復元前の控えを Mac mini に保存できなかったため中止しました：' + e.message);
          }).then(function () {
            // まだ送っていない写真も先に控える（復元後の片付けで消えても Mac mini に残るように）
            return syncBlobs(cfg).catch(function (e) {
              throw new Error('復元前に、まだ送っていない写真を Mac mini に控えられなかったため中止しました：' + e.message);
            });
          });
        }, function () {
          prog('この端末のデータを読み取れないため、控えは取らずに復元します…');   // 守るべき中身が読めない＝復元が必要な状態
        });
      }).then(function () {
        prog('Mac mini からデータを受け取っています…');
        return api(cfg, 'GET', '/v1/' + app + '/snap/' + dev + '/' + encodeURIComponent(target), undefined, 120000);
      }).then(function (env) {
        if (!env || env.app !== app || env.data == null) throw new Error('受け取ったデータの形式が違います');
        var blobIds = null;
        var blobs = {
          ids: function () {
            if (blobIds) return Promise.resolve(blobIds);
            return api(cfg, 'GET', '/v1/' + app + '/blobs/' + dev).then(function (j) { blobIds = j.ids || []; return blobIds; });
          },
          get: function (id) { return api(cfg, 'GET', '/v1/' + app + '/blob/' + dev + '/' + encodeURIComponent(id), undefined, BLOB_TIMEOUT_MS, true); }
        };
        prog('この端末に書き戻しています…');
        return Promise.resolve(opt.restore(env.data, blobs, env)).then(function (res) {
          res = res || { ok: true };
          if (res.ok) {
            // 復元した内容がこの端末の新しい基準。写真は中身が変わり得るので全部送り直す（同じ中身は Mac mini が捨てる）
            st.lastCounts = copy(env.counts || st.lastCounts); sentSet = {}; st.blobsVerifiedAt = 0; saveState();
          }
          return res;
        });
      }).then(function (res) {
        restoring = false;
        if (res && res.ok) markDirty(); else if (st.pending) schedule(DEBOUNCE_MS);
        return res;
      }, function (e) {
        restoring = false;
        if (st.pending) schedule(DEBOUNCE_MS);
        throw e;
      });
    }

    // ── 画面部品 ──
    function mountBadge(el) {
      if (!el) return;
      injectStyle();
      function draw(s) {
        if (s.state === 'off') { el.innerHTML = ''; return; }
        var v = STATE_VIEW[s.state] || STATE_VIEW.pending;
        var txt = s.state === 'ok' ? '保管 ' + fmtTime(s.lastOkAt) : v[1];
        el.innerHTML = '<span class="vlt-badge" title="' + esc(v[1] + (s.lastError ? '：' + s.lastError : '')) + '"><i style="background:' + v[0] + '"></i>🖥 ' + esc(txt) + '</span>';
      }
      draw(status());
      onStatus(draw, el);
    }

    function mountSettings(el, labels) {
      if (!el) return;
      injectStyle();
      var c = getCfg() || {};
      var box = document.createElement('div');
      box.className = 'vlt';
      box.innerHTML =
        '<h3>🖥 Mac mini への自動バックアップ</h3>' +
        '<p class="vlt-sub">保存するたびに、この端末のデータの複製を院内の Mac mini へ送ります。アプリの使い方は変わりません。合言葉は同じ iPad の他の院内アプリと共通です。</p>' +
        '<div><span class="vlt-st" data-v="st"></span></div>' +
        '<label>この iPad の名前（例：受付iPad・チェア1）</label><input data-v="device" maxlength="32" autocomplete="off" autocapitalize="off">' +
        '<label>合言葉</label><input data-v="token" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">' +
        '<details><summary>Mac mini の住所（通常は変更不要）</summary><label>住所</label><input data-v="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"></details>' +
        '<div class="vlt-row"><button class="vlt-pri" data-a="save">保存して接続を確認</button><button data-a="push">今すぐ送る</button></div>' +
        '<div class="vlt-msg" data-v="msg"></div>' +
        '<details data-v="rsbox"><summary>Mac mini から復元する（iPad の入れ替え・データが消えたとき）</summary>' +
        '<p class="vlt-sub">Mac mini に保管されている複製で、この端末のデータを<b>置き換え</b>ます。置き換える前の状態も自動で Mac mini に控えます。</p>' +
        '<div class="vlt-row"><button data-a="list">保管されている一覧を見る</button></div><div data-v="devs"></div></details>';
      el.innerHTML = '';
      el.appendChild(box);
      var $ = function (k) { return box.querySelector('[data-v="' + k + '"]'); };
      $('device').value = c.device || randDevice();
      $('token').value = c.token || '';
      $('url').value = c.url || DEFAULT_URL;
      function msg(kind, text) { var m = $('msg'); m.className = 'vlt-msg ' + kind; m.textContent = text; }
      function drawSt(s) {
        var v = STATE_VIEW[s.state] || STATE_VIEW.pending;
        var extra = s.state === 'ok' && s.lastOkAt ? '（' + fmtTime(s.lastOkAt) + '）' : (s.lastError && s.state !== 'ok' ? '：' + s.lastError : '');
        $('st').innerHTML = '<i class="vlt-dot" style="background:' + v[0] + '"></i>' + esc(v[1] + extra);
      }
      drawSt(status());
      onStatus(drawSt, box);

      box.querySelector('[data-a="save"]').onclick = function () {
        var dev = $('device').value.trim(), tok = $('token').value, url = $('url').value.trim().replace(/\/+$/, '');
        if (!DEVICE_RE.test(dev)) return msg('ng', 'iPad の名前は32文字以内で、記号は「-」「_」だけ使えます');
        if (tok.length < 8) return msg('ng', '合言葉を入れてください（8文字以上）');
        var up = urlProblem(url); if (up) return msg('ng', up);
        var old = getCfg() || {};
        var next = { url: url, token: tok, device: dev, v: 1 };
        msg('info', '確認しています…');
        api(next, 'GET', '/v1/auth', undefined, 15000).then(function () {
          lsSet(CFG_KEY, next);
          authFailedToken = null;
          if (old.device && old.device !== dev) { sentSet = {}; st.blobsVerifiedAt = 0; saveState(); }
          msg('ok', '✅ Mac mini につながりました。これから保存のたびに自動で送ります。');
          return checkExistingThenPush(dev);
        }).catch(function (e) { msg('ng', '❌ ' + e.message); });
      };
      box.querySelector('[data-a="push"]').onclick = function () {
        if (!isConfigured(getCfg())) return msg('ng', '先に合言葉を入れて「保存して接続を確認」を押してください');
        msg('info', '送っています…');
        pushNow('manual').then(function (r) {
          if (r.ok) msg('ok', r.dup ? '✅ Mac mini の保管分は最新です' : '✅ Mac mini に送りました' + (r.blobs && r.blobs.sent ? '（写真 ' + r.blobs.sent + ' 件）' : ''));
          else msg('ng', '❌ ' + r.error);
        });
      };
      // 同じ名前の iPad の保管分があって、この端末が空なら、上書きする前に復元を勧める
      function checkExistingThenPush(dev) {
        return Promise.resolve(opt.getSnapshot()).then(function (s) {
          var localTotal = sumCounts(s && s.counts);
          return listSnaps().then(function (devs) {
            var mine = devs.filter(function (d) { return d.device === dev; })[0];
            var srvTotal = mine && mine.latest ? sumCounts(mine.latest.counts) : 0;
            if (localTotal === 0 && srvTotal > 0) {
              msg('info', '「' + dev + '」の名前で Mac mini に保管されたデータがあります（' + countsText(mine.latest.counts, labels) + '・' + fmtTime(mine.latest.at) + '）。この端末は空なので、下の「Mac mini から復元する」で戻せます。');
              $('rsbox').open = true;
              return drawDevs();
            }
            markDirty();
          });
        }).catch(function () { markDirty(); });
      }
      function drawDevs() {
        var wrap = $('devs');
        wrap.innerHTML = '<p class="vlt-sub">読み込み中…</p>';
        return listSnaps().then(function (devs) {
          if (!devs.length) { wrap.innerHTML = '<p class="vlt-sub">まだ何も保管されていません。</p>'; return; }
          wrap.innerHTML = '';
          devs.forEach(function (d) {
            var row = document.createElement('div'); row.className = 'vlt-dev';
            var opts = (d.history || []).map(function (h) {
              return '<option value="' + esc(h.file) + '">' + esc(fmtTime(h.at) + '　' + countsText(h.counts, labels) + (h.reason === 'pre-restore' ? '　（復元前の控え）' : '')) + '</option>';
            }).join('');
            row.innerHTML = '<b>' + esc(d.device) + '</b>' + (d.device === (getCfg() || {}).device ? '　<span class="vlt-sub">（この iPad）</span>' : '') +
              '<div class="vlt-sub">最終 ' + esc(d.latest ? fmtTime(d.latest.at) : '—') + (d.blobs ? '・写真 ' + d.blobs + ' 件' : '') + '</div>' +
              '<select>' + opts + '</select><div class="vlt-row"><button class="vlt-warn">この内容で復元</button></div>';
            row.querySelector('button').onclick = function () {
              var file = row.querySelector('select').value;
              var h = (d.history || []).filter(function (x) { return x.file === file; })[0] || {};
              var q = '「' + d.device + '」の ' + fmtTime(h.at) + ' の内容（' + countsText(h.counts, labels) + '）で、この端末のデータを置き換えます。\n\n今この端末に入っている内容は、置き換える前に Mac mini に控えます。\n\nよろしいですか？';
              if (!confirm(q)) return;
              var btns = box.querySelectorAll('button'); Array.prototype.forEach.call(btns, function (b) { b.disabled = true; });
              restoreFrom(d.device, file, function (t) { msg('info', t); }).then(function (res) {
                if (res && res.ok) msg('ok', '✅ ' + (res.message || '復元しました'));
                else msg('ng', '❌ ' + ((res && res.message) || '復元できませんでした'));
              }).catch(function (e) { msg('ng', '❌ ' + e.message); }).then(function () {
                Array.prototype.forEach.call(btns, function (b) { b.disabled = false; });
              });
            };
            wrap.appendChild(row);
          });
        }).catch(function (e) { wrap.innerHTML = ''; msg('ng', '❌ ' + e.message); });
      }
      box.querySelector('[data-a="list"]').onclick = drawDevs;
    }

    // ── 起動時・画面の出入り・定期チェック ──
    function kick() {
      var cfg = getCfg();
      if (!isConfigured(cfg)) { setLive('off'); return; }
      if (restoring || inflight) return;
      if (authBlocked()) { setLive('auth', live.lastError || '合言葉が違います'); return; }
      if (st.pending || st.blobsPending) { setLive('pending'); schedule(2000); }
      else if (!st.lastOkAt || now() - st.lastOkAt > HEARTBEAT_MS) { schedule(5000); setLive(st.lastOkAt ? 'ok' : 'pending'); }
      else if (live.state !== 'guard' && live.state !== 'error') setLive('ok');
    }
    // 開いたままの端末（打刻iPadなど）でも30分ごとに確認する
    function tick() { try { kick(); } catch (e) {} setTimeout(tick, TICK_MS); }
    try {
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden' && st.pending && isConfigured(getCfg()) && !authBlocked()) pushNow('auto');
        if (document.visibilityState === 'visible') kick();
      });
      global.addEventListener('online', function () { if (st.pending) schedule(1000); });
      setTimeout(kick, 0);
      setTimeout(tick, TICK_MS);

function ymdOk(v){if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v))return '';const[y,m,dd]=v.split('-').map(Number);const dt=new Date(y,m-1,dd);
  return (dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===dd)?v:'';}
function sanitizeLoaded(d){
  d=d&&typeof d==='object'?d:{};const rep={newId:0,orphan:0,dropped:0};const seen={};
  const fixId=(col,id)=>{const set=seen[col]||(seen[col]=new Set());const ok=typeof id==='string'&&ID_RE.test(id)&&!set.has(id);const nid=ok?id:generateId();if(!ok)rep.newId++;set.add(nid);return nid;};
  const pmap=new Map(); // 元の id → 使う id（同じ id の患者が複数なら最初の患者に検査・文書を付ける）
  const pts=(Array.isArray(d.patients)?d.patients:[]).filter(p=>p&&typeof p==='object').map(p=>{const o=Object.assign({},p);const nid=fixId('p',p.id);
    if(p.id!=null&&!pmap.has(String(p.id)))pmap.set(String(p.id),nid);o.id=nid;
    ['no','chartNo','sei','mei','seiKana','meiKana','name','kana','notes','recNo'].forEach(k=>{o[k]=str(p[k]);});
    if(!o.name)o.name=(o.sei+' '+o.mei).trim();if(!o.kana)o.kana=(o.seiKana+' '+o.meiKana).trim();
    o.gender=p.gender==='male'||p.gender==='female'?p.gender:'';o.birth=ymdOk(p.birth);return o;});
  const pids=new Set(pts.map(p=>p.id));const mapPid=v=>{const k=str(v);return pmap.has(k)?pmap.get(k):k;};
  const exs=(Array.isArray(d.exams)?d.exams:[]).filter(e=>e&&typeof e==='object').map(e=>{const o=Object.assign({},e);o.id=fixId('e',e.id);o.patientId=mapPid(e.patientId);if(!pids.has(o.patientId))rep.orphan++;
    o.type=['basic','precision','mixed'].includes(e.type)?e.type:'basic';o.date=ymdOk(e.date);o.examiner=str(e.examiner);o.teeth=normalizeTeeth(e.teeth);
    if(e.carried!=null)o.carried=Array.isArray(e.carried)?e.carried.map(Number).filter(n=>ORDER.includes(n)):[];
    ['createdAt','updatedAt'].forEach(k=>{if(e[k]!=null){const t=str(e[k]);if(isNaN(new Date(t)))delete o[k];else o[k]=t;}});
    if(e.rev!=null)o.rev=Number.isInteger(+e.rev)&&+e.rev>=0?+e.rev:1;
    if(e.findings!=null){const f=freshFindings();if(typeof e.findings==='object')FINDINGS.forEach(([k])=>{if(['有','無',''].includes(e.findings[k]))f[k]=e.findings[k];});o.findings=f;}
    return o;});
  const dcs=(Array.isArray(d.docs)?d.docs:[]).filter(x=>{if(x&&typeof x==='object'&&DOC_KIND[x.kind])return true;rep.dropped++;return false;}).map(x=>{const o=Object.assign({},x);
    o.id=fixId('d',x.id);o.patientId=mapPid(x.patientId);if(!pids.has(o.patientId))rep.orphan++;o.date=ymdOk(x.date);
    const dd=Object.assign({},x.data&&typeof x.data==='object'?x.data:{});dd.date=ymdOk(dd.date)||o.date;dd.examRef=ymdOk(dd.examRef)||null;
    const t={};ORDER.forEach(n=>{const v=dd.teeth&&dd.teeth[n];t[n]=(v===1||v===2)?v:0;});dd.teeth=t;o.data=dd;return o;});
  const stf=(Array.isArray(d.staff)?d.staff:[]).filter(x=>x&&typeof x==='object'&&str(x.name).trim()).map(x=>({id:fixId('s',x.id),name:str(x.name)}));
  let clinic=null;if(d.clinic&&typeof d.clinic==='object'){clinic={};['name','addr','tel','doctor'].forEach(k=>{if(d.clinic[k]!=null)clinic[k]=str(d.clinic[k]);});}
  return {patients:pts,exams:exs,docs:dcs,staff:stf,clinic,hasStaff:Array.isArray(d.staff),report:rep};}
// ★先に全件を検証・整形してから一括置換（途中で例外→患者だけ置換の不整合を防ぐ）。opt.keepStaff＝担当者を持たないファイルでは今の担当者を残す
function applyLoaded(d,opt){const c=sanitizeLoaded(d);
  store.patients=c.patients;store.exams=c.exams;store.docs=c.docs;
  if(c.hasStaff||!(opt&&opt.keepStaff))store.staff=c.staff;
  if(c.clinic)Object.assign(store.clinic,c.clinic);
  return c.report;}
// 復元してよいファイルか（歯周検査のバックアップか・新しすぎる版でないか）
function restoreCheck(d){
  if(!d||typeof d!=='object'||Array.isArray(d)||!Array.isArray(d.patients)||!Array.isArray(d.exams))return {ok:false,msg:'歯周検査のバックアップではありません（患者・検査の一覧がないファイルです）。'};
  if(d.kind!=null&&d.kind!==BACKUP_KIND)return {ok:false,msg:'歯周検査のバックアップではありません（別のアプリのファイルです）。'};
  if(typeof d.schema==='number'&&d.schema>DATA_SCHEMA)return {ok:false,msg:'新しい版のアプリで書き出したバックアップです。アプリを最新の版にしてから読み込んでください。'};
  if(d.kind==null){ // v0.13.2 までのバックアップは目印がないので、中身（アプリの版・検査の歯式）で見分ける
    if(d.app==null&&d.schema==null)return {ok:false,msg:'歯周検査のバックアップではありません（アプリの版の記録がないファイルです）。'};
    const withTeeth=d.exams.filter(e=>e&&e.teeth&&typeof e.teeth==='object'&&ORDER.some(n=>e.teeth[n]&&typeof e.teeth[n]==='object')).length;
    if(d.exams.length&&withTeeth*2<d.exams.length)return {ok:false,msg:'歯周検査のバックアップではありません（検査に歯式がないファイルです）。'};}
  return {ok:true};}
const latestDate=arr=>arr.reduce((m,e)=>e&&e.date&&e.date>m?e.date:m,'');
const fmtWhen=iso=>{const t=new Date(iso);return iso&&!isNaN(t)?t.getFullYear()+'/'+pad2(t.getMonth()+1)+'/'+pad2(t.getDate())+' '+pad2(t.getHours())+':'+pad2(t.getMinutes()):'不明';};
// 復元の直前のデータを端末内に1つだけ控える（「直前の復元を取り消す」で戻せる）
let preRestoreInfo=null;
async function kvPut(k,v){if(netState!=='local')return false;
  if(LOCAL.backend==='idb'){if(!await idbTx(['kv'],tx=>{const kv=tx.objectStore('kv');if(v==null)kv.delete(k);else kv.put(v,k);}))return false;return true;}
  try{if(v==null)localStorage.removeItem('perio_'+k);else localStorage.setItem('perio_'+k,JSON.stringify(v));return true;}catch(_){return false;}}
async function kvGet(k){if(netState!=='local')return null;
  try{if(LOCAL.backend==='idb')return (await idbReq(idbConn.transaction(['kv'],'readonly').objectStore('kv').get(k)))||null;const r=localStorage.getItem('perio_'+k);return r?JSON.parse(r):null;}catch(_){return null;}}
async function savePreRestore(kind){const snap=localPayload();const info={at:new Date().toISOString(),kind:kind||'restore',patients:store.patients.length,exams:store.exams.length,docs:store.docs.length};
  if(!await kvPut('pre_restore',snap))return false;const back=await kvGet('pre_restore');if(!back||!Array.isArray(back.patients)||back.patients.length!==info.patients)return false;
  if(!await kvPut('pre_restore_info',info))return false;preRestoreInfo=info;return true;}
// 置き換えて端末に保存。保存に失敗したら画面の中身も元に戻して false（画面と端末の保存が食い違わないように）
async function applyLoadedAndSave(d,opt){
  const prev={patients:store.patients,exams:store.exams,docs:store.docs,staff:store.staff,clinic:Object.assign({},store.clinic)};
  applyLoaded(d,opt);
  if(await persistAll())return true;
  store.patients=prev.patients;store.exams=prev.exams;store.docs=prev.docs;store.staff=prev.staff;
  Object.keys(store.clinic).forEach(k=>delete store.clinic[k]);Object.assign(store.clinic,prev.clinic);
  return false;
}

// ── IndexedDB（患者・検査・文書は1件ずつ別レコード。保存は変えた1件だけ書くので件数が増えても遅くならない） ──
const IDB_STORES=['patients','exams','docs'];
let idbConn=null;
// 一覧の並び（登録順）を保つための通し番号。レコードは {id, seq, v:元のデータ} で持ち、データの形は変えない
const idbSeq={patients:new Map(),exams:new Map(),docs:new Map()};let idbMaxSeq=0;
function idbReq(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function idbOpen(){return new Promise((res,rej)=>{
  let r;try{r=indexedDB.open(LOCAL.idbName,1);}catch(e){rej(e);return;}
  r.onupgradeneeded=()=>{const d=r.result;
    IDB_STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});});
    if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta'); // staff / clinic / info
    if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');};  // 下書き・壊れたデータの退避
  r.onsuccess=()=>{const d=r.result;d.onversionchange=()=>{try{d.close();}catch(_){}};res(d);};
  r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));});}
// 1つのトランザクションで書く。全部書けたときだけ true（途中で失敗すれば何も書かれない）
function idbTx(stores,fn){return new Promise(res=>{
  let tx;try{tx=idbConn.transaction(stores,'readwrite');}catch(e){res(false);return;}
  tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);tx.onabort=()=>res(false);
  try{fn(tx);}catch(e){try{tx.abort();}catch(_){}res(false);}});}
function idbRec(col,obj){let s=idbSeq[col].get(obj.id);if(s==null){s=++idbMaxSeq;idbSeq[col].set(obj.id,s);}return {id:obj.id,seq:s,v:obj};}
async function idbLoadAll(){
  const tx=idbConn.transaction(['patients','exams','docs','meta'],'readonly');
  const all=s=>idbReq(tx.objectStore(s).getAll());const meta=k=>idbReq(tx.objectStore('meta').get(k));
  const [ps,es,ds,staff,clinic,info,lastEx]=await Promise.all([all('patients'),all('exams'),all('docs'),meta('staff'),meta('clinic'),meta('info'),meta('lastExport')]);
  lastExport=lastEx&&typeof lastEx==='object'&&lastEx.at?lastEx:null;
  const seqs={};let mx=0;
  const un=(col,arr)=>{seqs[col]=new Map();return (arr||[]).filter(r=>r&&r.v&&typeof r.v==='object').sort((a,b)=>a.seq-b.seq)
    .map(r=>{seqs[col].set(r.id,r.seq);if(r.seq>mx)mx=r.seq;return r.v;});};
  const data={patients:un('patients',ps),exams:un('exams',es),docs:un('docs',ds),staff:Array.isArray(staff)?staff:[],clinic:clinic&&typeof clinic==='object'?clinic:null};
  return {info:info||null,data,seqs,maxSeq:mx};
}
async function idbReplaceAll(info){
  const maps={};let seq=0;const cols={patients:store.patients,exams:store.exams,docs:store.docs};
  const ok=await idbTx(['patients','exams','docs','meta'],tx=>{
    for(const c of IDB_STORES){const os=tx.objectStore(c);os.clear();maps[c]=new Map();
      for(const o of cols[c]){if(!o||o.id==null)continue;seq++;maps[c].set(o.id,seq);os.put({id:o.id,seq,v:o});}}
    const m=tx.objectStore('meta');m.put(store.staff,'staff');m.put(store.clinic,'clinic');
    if(info)m.put(info,'info');else{const g=m.get('info');g.onsuccess=()=>{if(!g.result)m.put({schema:DATA_SCHEMA,createdAt:new Date().toISOString(),from:'replace'},'info');};}});
  if(ok){IDB_STORES.forEach(c=>{idbSeq[c]=maps[c];});idbMaxSeq=seq;}
  return ok;
}
function lsPersistAll(){try{localStorage.setItem(LOCAL.key,JSON.stringify(localPayload()));return true;}catch(e){return false;}}

// ── 保存の窓口（戻り値 Promise<boolean>。false＝端末に書けなかった → 呼び出し側で画面の変更を元に戻す） ──
// 保存を止めている（storageProblem）ときは「保存できなかった」と返す。PocketBase やメモリのみのときは従来どおり成功扱い
function persistSkip(){return !storageProblem;}
const TAB_MSG='このアプリが別の画面（タブ）で開かれているため、この画面では保存しませんでした。上の帯の「この画面で続ける」を押すか、もう一方の画面を使ってください。';
function tabGuard(){if(!tabBlocked)return true;showErr(TAB_MSG);return false;}
function persistDone(ok){if(ok){LOCAL.lastSavedAt=new Date().toISOString();try{if(vault)vault.markDirty();}catch(_){}scheduleStorageInfo();}return ok;}
// 端末に書けたら、共有している iPad では変えた記録を Mac mini へ送る箱に入れる（rsNote*）
async function persistPut(col,objs){if(!tabGuard())return false;if(netState!=='local')return persistSkip();const list=Array.isArray(objs)?objs:[objs];
  const ok=persistDone(LOCAL.backend==='idb'?await idbTx([col],tx=>{const os=tx.objectStore(col);list.forEach(o=>os.put(idbRec(col,o)));}):lsPersistAll());if(ok)rsNotePut(col,list);return ok;}
async function persistDel(col,id){if(!tabGuard())return false;if(netState!=='local')return persistSkip();
  const ok=persistDone(LOCAL.backend==='idb'?await idbTx([col],tx=>tx.objectStore(col).delete(id)):lsPersistAll());if(ok)rsNoteDel(col,[id]);return ok;}
async function persistMeta(){if(!tabGuard())return false;if(netState!=='local')return persistSkip();
  const ok=persistDone(LOCAL.backend==='idb'?await idbTx(['meta'],tx=>{const m=tx.objectStore('meta');m.put(store.staff,'staff');m.put(store.clinic,'clinic');}):lsPersistAll());if(ok)rsNoteMeta();return ok;}
async function persistAll(info){if(!tabGuard())return false;if(netState!=='local')return persistSkip();
  const ok=persistDone(LOCAL.backend==='idb'?await idbReplaceAll(info):lsPersistAll());if(ok)rsNoteAll();return ok;}

// ── 起動時の読み込み ──
const sameJSON=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function storeSnapshot(){return {patients:store.patients,exams:store.exams,docs:store.docs,staff:store.staff,clinic:store.clinic};}
function brokenAlert(){try{alert('⚠ 端末内の保存データが壊れていたため読み込めませんでした。\n壊れたデータは端末内に退避してあります（消えていません）。\nバックアップJSONをお持ちなら「💾 バックアップ」画面から復元してください。');}catch(_){}}
function holdVault(){vaultHold=VAULT_HOLD_MSG;try{localStorage.setItem(VAULT_HOLD_KEY,'1');}catch(_){}} // 読み直しても停止が続くよう端末に記録
// IndexedDB で起動できたら true。一度も使えていない端末で開けなければ false（→ localStorage で起動）
async function loadIDB(){
  if(typeof indexedDB==='undefined'||!indexedDB)return false;
  let marked=false;try{marked=!!localStorage.getItem(LOCAL.migratedMark);}catch(_){}
  try{idbConn=await idbOpen();}
  catch(e){idbConn=null;
    if(!marked)return false;
    // 移行済みの端末：古い localStorage に戻すと、IndexedDB 側の新しい記録と食い違うので保存を止める
    storageProblem='端末の保存場所（IndexedDB）を開けませんでした。記録は消えていません。アプリを閉じて開き直してください。直らないときは入力せず、院長に連絡してください。';
    netState='memory';return true;}
  let got;
  try{got=await idbLoadAll();}
  catch(e){idbConn=null;storageProblem='端末の保存データを読み込めませんでした（記録は消えていません）。アプリを閉じて開き直してください。';netState='memory';return true;}
  LOCAL.backend='idb';netState='local';
  // 印（info）が無くても記録が入っていれば通常の起動（印を書き直す。帯を無視して入れた記録を隠さない）
  if(!got.info&&(got.data.patients.length||got.data.exams.length||got.data.docs.length)){
    got.info={schema:DATA_SCHEMA,createdAt:new Date().toISOString(),from:'recovered'};await idbTx(['meta'],tx=>tx.objectStore('meta').put(got.info,'info'));}
  if(got.info){ // 通常の起動
    const rp=applyLoaded(got.data);IDB_STORES.forEach(c=>{idbSeq[c]=got.seqs[c];});idbMaxSeq=got.maxSeq;
    if(rp.newId)await persistAll(got.info); // 形の合わない id を振り直したので、端末の記録も書き直す（古い id の記録を残さない）
    try{if(!marked)localStorage.setItem(LOCAL.migratedMark,'1');
      const old=loadLocalLS(); // 移行後に残った古い写しは、移行時点より新しくなければ片づける（院内アプリ共有の5MB枠を空ける）
      if(old&&!old.__broken&&(!old.savedAt||!got.info.migratedAt||old.savedAt<=got.info.migratedAt))localStorage.removeItem(LOCAL.key);}catch(_){}
    return true;}
  const now=new Date().toISOString();
  const d=loadLocalLS();
  if(d&&d.__broken){ // 壊れた保存データ：IndexedDB に退避し、読み戻して確かめてから見本で起動
    const k='broken_'+now;
    let kept=await idbTx(['kv'],tx=>tx.objectStore('kv').put({at:now,raw:d.raw},k));
    if(kept){try{const r=await idbReq(idbConn.transaction(['kv'],'readonly').objectStore('kv').get(k));kept=!!r&&r.raw===d.raw;}catch(_){kept=false;}}
    if(!kept){storageProblem='端末内の保存データが壊れていて、退避用のコピーも作れませんでした。元のデータを守るため、この端末への保存を止めています（見本データで表示中・入力は保存されません）。院長に連絡してください。';
      netState='memory';LOCAL.backend=null;try{alert('⚠ '+storageProblem);}catch(_){}return true;}
    holdVault();brokenAlert();
    if(await persistAll({schema:DATA_SCHEMA,createdAt:now,from:'broken-localStorage',brokenKey:k})){
      try{localStorage.removeItem(LOCAL.key);localStorage.setItem(LOCAL.migratedMark,'1');}catch(_){}}
    return true;}
  if(d){ // 従来の localStorage から移す：写す → 読み戻して1件ずつ照合 → 一致したら元を消す
    applyLoaded(d);
    const want=storeSnapshot();
    let ok=await persistAll({schema:DATA_SCHEMA,migratedAt:now,from:'localStorage',counts:{patients:want.patients.length,exams:want.exams.length,docs:want.docs.length}});
    if(ok){try{const back=await idbLoadAll();ok=sameJSON(back.data.patients,want.patients)&&sameJSON(back.data.exams,want.exams)&&sameJSON(back.data.docs,want.docs)&&sameJSON(back.data.staff,want.staff)&&sameJSON(back.data.clinic,want.clinic);}catch(_){ok=false;}}
    if(ok){try{localStorage.removeItem(LOCAL.key);localStorage.setItem(LOCAL.migratedMark,'1');}catch(_){}return true;}
    // 照合に失敗：IndexedDB の中途半端な写しを消し、今回は従来どおり localStorage で動かす（元データはそのまま）
    await idbTx(['patients','exams','docs','meta'],tx=>{['patients','exams','docs','meta'].forEach(s=>tx.objectStore(s).clear());});
    idbConn=null;LOCAL.backend='ls';return true;}
  // 以前は保存していた端末なのに保存データが見つからない：見本で上書きして始めず、復元か初期化を選んでもらう
  if(marked){store.patients=[];store.exams=[];store.docs=[];
    storageProblem='この端末の保存データが見つかりません（以前は保存されていました）。Mac mini への送信は止めています。「💾 バックアップ」の「Mac mini から復元」かバックアップJSONの読み込みで戻してください。新しく始めるなら「全データ初期化」をしてください。';
    holdVault();emptyAfterMigration=true;return true;}
  // 初回（保存データなし）：見本込みで保存を確立
  if(await persistAll({schema:DATA_SCHEMA,createdAt:now,from:'new'})){try{localStorage.setItem(LOCAL.migratedMark,'1');}catch(_){}}
  return true;
}
// IndexedDB が使えない端末：従来の localStorage で動かす
function loadLS(){
  LOCAL.backend='ls';netState='local';
  const d=loadLocalLS();
  if(d&&d.__broken){
    // ★退避用のコピーを書けて、読み戻して一致したときだけ見本で上書きする（容量不足で退避できないのに上書きして元データを消す事故を防ぐ）
    let kept=false;try{localStorage.setItem(LOCAL.key+'_broken',d.raw);kept=localStorage.getItem(LOCAL.key+'_broken')===d.raw;}catch(_){}
    holdVault();
    if(!kept){storageProblem='端末内の保存データが壊れていて、退避用のコピーも作れませんでした。元のデータを守るため、この端末への保存を止めています（見本データで表示中・入力は保存されません）。院長に連絡してください。';
      netState='memory';LOCAL.backend=null;try{alert('⚠ '+storageProblem);}catch(_){}return;}
    brokenAlert();lsPersistAll();
    try{if(!localStorage.getItem(VAULT_HOLD_KEY))localStorage.setItem(VAULT_HOLD_KEY,'1');}catch(_){} // 見本で置き換えて空きができた後にもう一度
    return;}
  if(d)applyLoaded(d); // 保存済みデータを復元。無ければサンプルのまま（初回）＝バックアップ画面の「全データ初期化」でまっさらにできる
  else lsPersistAll();  // 初回はサンプル込みで保存を確立
}

// ── 保存容量の見える化（Safari の localStorage は1字2バイトで数える。IndexedDB はブラウザの見積もり） ──
const LS_QUOTA=5*1024*1024;
let storageInfo=null,storageInfoTimer=null;
function lsOriginBytes(){let n=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);const v=localStorage.getItem(k)||'';n+=(k.length+v.length)*2;}}catch(_){}return n;}
async function refreshStorageInfo(){
  const r={lsBytes:lsOriginBytes(),usage:null,quota:null,persisted:null};
  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();r.usage=e.usage;r.quota=e.quota;}}catch(_){}
  try{if(navigator.storage&&navigator.storage.persisted)r.persisted=await navigator.storage.persisted();}catch(_){}
  storageInfo=r;return r;}
function scheduleStorageInfo(){clearTimeout(storageInfoTimer);storageInfoTimer=setTimeout(()=>{refreshStorageInfo().catch(()=>{});},1500);}
// 使用率（0〜1）。不明なら null
function storageLevel(){
  if(!storageInfo)return null;
  if(LOCAL.backend==='idb')return (storageInfo.quota>0&&storageInfo.usage!=null)?storageInfo.usage/storageInfo.quota:null;
  if(LOCAL.backend==='ls')return storageInfo.lsBytes/LS_QUOTA;
  return null;}
const fmtBytes=b=>b==null?'—':b<1024*1024?(b/1024).toFixed(1)+' KB':b<1024*1024*1024?(b/1024/1024).toFixed(1)+' MB':(b/1024/1024/1024).toFixed(2)+' GB';
function storageBannerHTML(){
  if(storageProblem)return `<div class="banner" style="margin-top:14px;background:#fee2e2;border-color:#fca5a5;color:#991b1b;font-weight:600">⚠ ${esc(storageProblem)}</div>`;
  const lv=storageLevel();if(lv==null||lv<0.7)return '';
  const red=lv>=0.85;
  return `<div class="banner" style="margin-top:14px;background:${red?'#fee2e2':'#fef3c7'};border-color:${red?'#fca5a5':'#fcd34d'};color:${red?'#991b1b':'#92400e'};font-weight:600">⚠ 端末の保存容量が ${Math.round(lv*100)}% に達しています。${red?'まもなく保存できなくなります。':''}今すぐ「💾 バックアップ」でJSONを書き出してください。</div>`;}

function pbUrl(col,id){return PB.url+'/api/collections/'+encodeURIComponent(col)+'/records'+(id?'/'+encodeURIComponent(id):'');}
function mapPatientToPB(p){return {id:p.id,no:p.no,chartNo:p.chartNo||'',sei:p.sei||'',mei:p.mei||'',seiKana:p.seiKana||'',meiKana:p.meiKana||'',name:p.name||'',kana:p.kana||'',birth:p.birth||'',gender:p.gender||'',notes:p.notes||'',recNo:p.recNo||''};}
function mapPatientFromPB(r){return {id:r.id,no:r.no,chartNo:r.chartNo,sei:r.sei,mei:r.mei,seiKana:r.seiKana,meiKana:r.meiKana,name:r.name,kana:r.kana,birth:r.birth,gender:r.gender,notes:r.notes,recNo:r.recNo};}
function mapExamToPB(e){return {id:e.id,patientId:e.patientId,date:e.date,examiner:e.examiner||'',type:e.type||'basic',teeth:e.teeth,carried:e.carried||[],createdAt:e.createdAt||'',updatedAt:e.updatedAt||'',rev:e.rev||0,findings:e.findings||null};}
function mapExamFromPB(r){const e={id:r.id,patientId:r.patientId,date:r.date,examiner:r.examiner,type:r.type||'basic',teeth:normalizeTeeth(r.teeth)};
  if(Array.isArray(r.carried))e.carried=r.carried;if(r.createdAt)e.createdAt=r.createdAt;if(r.updatedAt)e.updatedAt=r.updatedAt;if(r.rev)e.rev=r.rev;if(r.findings)e.findings=r.findings;return e;}
function mapDocToPB(d){return {id:d.id,patientId:d.patientId,kind:d.kind,date:d.date,data:d.data};}
function mapDocFromPB(r){return {id:r.id,patientId:r.patientId,kind:r.kind,date:r.date,data:r.data||{}};}
async function pbList(col){const r=await fetch(pbUrl(col)+'?perPage=1000&sort=created');if(!r.ok)throw new Error(col+' '+r.status);return (await r.json()).items||[];}
function pbWrite(col,obj,isNew,mapFn){
  const url=isNew?pbUrl(col):pbUrl(col,obj.id);
  fetch(url,{method:isNew?'POST':'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(mapFn(obj))})
    .then(r=>{if(!r.ok)throw new Error(col+' '+r.status);})
    .catch(()=>{obj._unsynced=true;netState='offline';toast('⚠ サーバー未同期（後で再送が必要）');});
}
// 保存系はすべて Promise<boolean>。新規の追加は失敗したら画面の一覧からも取り除く（更新の巻き戻しは呼び出し側）
const db={
  connected:()=>!!PB.url,
  async load(){
    if(this.connected()){
      try{const [ps,es]=await Promise.all([pbList('patients'),pbList('exams')]);
        store.patients=ps.map(mapPatientFromPB);store.exams=es.map(mapExamFromPB);netState='online';
        try{store.docs=(await pbList('docs')).map(mapDocFromPB);}catch(_){/* docsコレクション未作成なら空のまま */}}
      catch(e){netState='offline';toast('⚠ サーバーに接続できません。メモリ表示中');}
      return;
    }
    if(LOCAL.on){
      if(await loadIDB())return;
      if(localAvail()){loadLS();return;}
    }
    netState='memory';
  },
  async savePatient(p,isNew){if(isNew)store.patients.push(p);if(this.connected())pbWrite('patients',p,isNew,mapPatientToPB);
    const ok=await persistPut('patients',p);if(!ok&&isNew)store.patients=store.patients.filter(x=>x!==p);return ok;},
  async savePatients(list){list.forEach(p=>{if(this.connected())pbWrite('patients',p,false,mapPatientToPB);});return persistPut('patients',list);},
  async saveExam(e,isNew){if(isNew)store.exams.push(e);if(this.connected())pbWrite('exams',e,isNew,mapExamToPB);
    const ok=await persistPut('exams',e);if(!ok&&isNew)store.exams=store.exams.filter(x=>x!==e);return ok;},
  async deleteExam(id){const prev=store.exams;store.exams=prev.filter(e=>e.id!==id);
    const ok=await persistDel('exams',id);if(!ok){store.exams=prev;return false;}
    if(this.connected())fetch(pbUrl('exams',id),{method:'DELETE'}).catch(()=>{});return true;},
  async saveDoc(d,isNew){if(isNew)store.docs.push(d);if(this.connected())pbWrite('docs',d,isNew,mapDocToPB);
    const ok=await persistPut('docs',d);if(!ok&&isNew)store.docs=store.docs.filter(x=>x!==d);return ok;},
  async deleteDoc(id){const prev=store.docs;store.docs=prev.filter(d=>d.id!==id);
    const ok=await persistDel('docs',id);if(!ok){store.docs=prev;return false;}
    if(this.connected())fetch(pbUrl('docs',id),{method:'DELETE'}).catch(()=>{});return true;},
  saveMeta(){return persistMeta();},
};

// ── 入力途中の下書き（検査・文書・患者登録）。保存を押す前に Safari が落ちても、開き直して続きから再開できる ──
// iPad の Safari では「ページを離れる前の警告（beforeunload）」が働かないため、入力のたびに自動で書いておく。
const DRAFT_KEY={exam:'draft_exam',doc:'draft_doc',pf:'draft_pf'};
let drafts={exam:null,doc:null,pf:null},draftTimer={};
async function draftWrite(kind,obj){
  if(netState!=='local'||(tabBlocked&&obj))return false; // 書くのは止めるが、消すのは通す
  if(LOCAL.backend==='idb')return idbTx(['kv'],tx=>{const kv=tx.objectStore('kv');if(obj)kv.put(obj,DRAFT_KEY[kind]);else kv.delete(DRAFT_KEY[kind]);});
  try{const k='perio_'+DRAFT_KEY[kind];if(obj)localStorage.setItem(k,JSON.stringify(obj));else localStorage.removeItem(k);return true;}catch(_){return false;}}
async function draftReadAll(){
  const out={exam:null,doc:null,pf:null};if(netState!=='local')return out;
  for(const kind of ['exam','doc','pf']){
    try{if(LOCAL.backend==='idb'){out[kind]=(await idbReq(idbConn.transaction(['kv'],'readonly').objectStore('kv').get(DRAFT_KEY[kind])))||null;
        const lk='perio_'+DRAFT_KEY[kind];let old=null;try{const raw=localStorage.getItem(lk);old=raw?JSON.parse(raw):null;}catch(_){}
        if(old&&(!out[kind]||String(old.at)>String(out[kind].at))){if(await draftWrite(kind,old)){out[kind]=old;try{localStorage.removeItem(lk);}catch(_){}}}
        else if(old){try{localStorage.removeItem(lk);}catch(_){}}}
      else{const raw=localStorage.getItem('perio_'+DRAFT_KEY[kind]);out[kind]=raw?JSON.parse(raw):null;}}catch(_){out[kind]=null;}}
  // 患者がいない・形が合わない下書きは使わない
  if(out.exam&&!(out.exam.teeth&&store.getPatient(out.exam.pid)))out.exam=null;
  if(out.doc&&!(out.doc.data&&store.getPatient(out.doc.pid)))out.doc=null;
  if(out.pf&&!(out.pf.pf&&out.pf.pf.bd&&(out.pf.for==='new'||store.getPatient(out.pf.for))))out.pf=null;
  return out;}
function examDraftObj(){return (pe&&pe.dirty)?{v:1,pid:pe.pid,examId:pe.examId||null,type:pe.type,date:pe.date,examiner:pe.examiner,teeth:clone(pe.teeth),
  touch:{ppd:[...touchSet('ppd')],mob:[...touchSet('mob')],bop:[...touchSet('bop')],site:[...touchSet('site')]},findings:pe.findings,at:new Date().toISOString()}:null;}
function docDraftObj(){return (dc&&dc.dirty)?{v:1,pid:dc.pid,docId:dc.docId||null,kind:dc.kind,data:clone(dc.data),copy:dc.copy,at:new Date().toISOString()}:null;}
function pfDraftObj(){return (pf&&pf._dirty)?{v:1,for:pf._for,pf:clone(Object.assign({},pf,{errs:{}})),at:new Date().toISOString()}:null;}
function flushDraft(kind,sync){clearTimeout(draftTimer[kind]);const o=kind==='exam'?examDraftObj():kind==='doc'?docDraftObj():pfDraftObj();if(!o)return;drafts[kind]=o;draftWrite(kind,o);
  if(sync&&LOCAL.backend==='idb'){try{localStorage.setItem('perio_'+DRAFT_KEY[kind],JSON.stringify(o));}catch(_){}}} // 次の起動で IndexedDB へ移して消す（draftReadAll）
// 患者登録・編集の欄に何か入れたら控えを書く（保存前に閉じても、氏名やフリガナを打ち直さずに済むように）
function pfTouch(){if(!pf)return;pf._dirty=true;scheduleDraft('pf');}
const DRAFT_LABEL={exam:'検査',doc:'文書',pf:'患者登録'};
function scheduleDraft(kind){clearTimeout(draftTimer[kind]);draftTimer[kind]=setTimeout(()=>flushDraft(kind),600);}
function clearDraft(kind){clearTimeout(draftTimer[kind]);drafts[kind]=null;try{localStorage.removeItem('perio_'+DRAFT_KEY[kind]);}catch(_){}draftWrite(kind,null).then(ok=>{if(!ok)setTimeout(()=>{if(!drafts[kind])draftWrite(kind,null);},1000);});}
function draftSummary(kind){const d=drafts[kind];if(!d)return '';const p=store.getPatient(d.pid);
  const at=new Date(d.at);const when=isNaN(at)?'':`${at.getMonth()+1}/${at.getDate()} ${pad2(at.getHours())}:${pad2(at.getMinutes())}`;
  if(kind==='pf'){const f=d.pf||{};const nm=((f.sei||'')+' '+(f.mei||'')).trim()||'氏名はまだ';return `${esc(nm)}・${d.for==='new'?'新規患者':'患者情報の編集'}（${when}）`;}
  if(kind==='exam'){ // 前回値が最初から入っているので「前回（または保存済みの元の検査）から変えた歯」の数を出す
    const fx=d.examId?store.exams.find(e=>e.id===d.examId):null;const base=fx?{teeth:fx.teeth}:prevBaseFor(d.type,examPool(d.pid,null,d.date||ymdToday()));
    let n=0;if(base.teeth)n=changedCount(d.teeth,base.teeth,NOBOP);else ORDER.forEach(k=>{const x=d.teeth[k];if(x&&(x.ppd!=null||(x.ppd6&&x.ppd6.some(v=>v!=null))))n++;});
    return `${esc(p?p.name:'')}・${EXAM_LABEL[d.type]||'検査'}${d.examId?'（編集）':''}（${when}・${base.teeth?'変更':'入力'} ${n}歯）`;}
  return `${esc(p?p.name:'')}・${DOC_KIND[d.kind]||'文書'}（${when}）`;}
function draftBannerHTML(){
  return ['exam','doc','pf'].filter(k=>drafts[k]).map(k=>`<div class="banner" style="margin-top:14px;background:#eff6ff;border-color:#93c5fd;color:#1e3a8a">
    <div style="font-weight:700">📝 保存されていない${DRAFT_LABEL[k]}があります</div>
    <div style="font-size:.82rem;margin-top:2px">${draftSummary(k)}</div>
    <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
      <button class="btn-primary" style="width:auto;padding:10px 18px" onclick="APP.resumeDraft('${k}')">続きから再開</button>
      <button style="padding:10px 18px;border:1px solid #93c5fd;border-radius:12px;background:#fff;color:#1e3a8a;font-weight:600;cursor:pointer" onclick="APP.discardDraft('${k}')">破棄する</button></div></div>`).join('');}

// ───────── 院内保管庫（Mac mini への自動バックアップ） ─────────
// 端末に保存するたびに（persistDone）複製を Mac mini へ送る。端末内の保存・表示には影響しない。
// 合言葉・住所・iPadの名前は同じ配信元の院内アプリ共通（💾 バックアップ画面で設定）。正本=Ai/院内保管庫/
// ★実データを読み込み終わってから作る（init の db.load の後）。セルフテストや読込前の見本データを送らないため。
const VAULT_LABELS={patients:'患者',exams:'検査',docs:'文書'};
let vault=null;
// 送信を止める理由（保存データが壊れて見本で起動した時）。端末に記録し、Mac mini からの復元・ファイル復元・全データ初期化で解除
const VAULT_HOLD_KEY='perio_vault_hold';
const VAULT_HOLD_MSG='この端末の保存データが壊れていたため、見本のまま起動しています。Mac mini への送信は止めています（Mac mini の保管分を見本で上書きしないため）。「Mac mini から復元する」で戻すか、見本を捨てて始めるなら「全データ初期化」をしてください';
let vaultHold=(()=>{try{return localStorage.getItem(VAULT_HOLD_KEY)?VAULT_HOLD_MSG:null;}catch(_){return null;}})();
function clearVaultHold(){vaultHold=null;try{localStorage.removeItem(VAULT_HOLD_KEY);}catch(_){}}
function initVault(){vault=createVault({app:'perio',label:'歯周検査',appVersion:APP_VERSION,
  // 保存時刻(savedAt)は外す：中身が同じなら Mac mini 側で重複として捨てられ、控えが無駄に増えない
  getSnapshot:()=>{if(vaultHold)throw new Error(vaultHold);const d=localPayload();delete d.savedAt;return {data:d,counts:{patients:store.patients.length,exams:store.exams.length,docs:store.docs.length}};},
  restore:async d=>{
    if(tabBlocked)return {ok:false,message:TAB_MSG};if(rsWanted())return {ok:false,message:'この iPad は Mac mini で記録を共有しているため、復元できません。バックアップの画面で「この iPad の共有をやめる」を押してから復元してください。'};const ck=restoreCheck(d);if(!ck.ok)return {ok:false,message:ck.msg};
    await savePreRestore(); // 端末内にも直前の控え（Mac mini 側も復元前の控えを取る）
    if(!await applyLoadedAndSave(d,{keepStaff:true}))return {ok:false,message:'端末への保存に失敗しました（容量不足の可能性）。データは元のままです'};
    // 置き換えに成功してから、編集中の画面・患者フォームの入力と下書きを捨てる（復元した内容を古い入力で上書きしないように）
    afterReplaceAll();
    setTimeout(()=>{route={name:'home'};render();},1500);
    return {ok:true,message:`患者 ${store.patients.length}名・検査 ${store.exams.length}件・文書 ${store.docs.length}件を復元しました。まもなく患者一覧に戻ります。`};
  }});}
function mountVaultBadge(){try{vault.mountBadge(document.getElementById('vault-badge'));}catch(_){}}
// 届いた・届かなくなったでホームの促しを出し直す（入力中は描き直さない）
let vaultCoverOk=null;
function watchVaultCover(){try{vault.onStatus(()=>{const vc=vaultCover(store.exams.filter(e=>!SAMPLE_EIDS.has(e.id)&&!SAMPLE_PIDS.has(e.patientId)));const ok=!!(vc&&vc.ok);
  if(ok===vaultCoverOk)return;const first=vaultCoverOk===null;vaultCoverOk=ok;if(first||route.name!=='home')return;
  const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;render();});}catch(_){}}

const kanaBuf={};

// ───────── 患者説明の可視化（経時グラフ＋リスクレーダー・SVG自前描画） ─────────
// 基本(一点法)/精密(六点法)を横断比較できるよう、指標はすべて「歯単位の割合(%)」で統一
function examMetrics(e){
  const t=e.teeth,type=e.type||'basic';let measured=0,bopT=0,deepT=0,sevT=0,mobT=0,ppdSum=0,ppdN=0;
  ORDER.forEach(n=>{const x=t[n];if(!x||x.missing||x.primary)return;
    const has=(type==='precision')?(x.ppd6&&x.ppd6.some(v=>v!=null)):(x.ppd!=null);if(!has)return;
    measured++;const mx=toothMaxPpd(x);
    if(toothAnyBop(x))bopT++;
    if(mx!=null){if(mx>=4)deepT++;if(mx>=6)sevT++;ppdSum+=mx;ppdN++;}
    if(x.mobility>0)mobT++;});
  const pct=a=>measured?Math.round(a/measured*100):0;
  return{id:e.id,date:e.date,type,measured,bop:pct(bopT),deep:pct(deepT),severe:pct(sevT),mobile:pct(mobT),meanPpd:ppdN?Math.round(ppdSum/ppdN*10)/10:0};
}
const RADAR_AXES=[{k:'bop',l:'出血'},{k:'deep',l:'4mm↑'},{k:'severe',l:'6mm↑'},{k:'mobile',l:'動揺'}];
function svgRadar(series){
  const N=RADAR_AXES.length,cx=150,cy=145,R=92;
  const ang=i=>(-90+i*360/N)*Math.PI/180;
  const pt=(i,r)=>[cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];
  let rings='';[25,50,75,100].forEach(p=>{const pts=RADAR_AXES.map((_,i)=>pt(i,R*p/100).map(v=>v.toFixed(1)).join(',')).join(' ');rings+=`<polygon points="${pts}" fill="none" stroke="var(--line)" stroke-width="1"/>`;});
  let spokes='',labels='';RADAR_AXES.forEach((a,i)=>{const[x,y]=pt(i,R);spokes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    const[lx,ly]=pt(i,R+20);labels+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--soft)">${a.l}</text>`;});
  let polys='';series.forEach(s=>{const pts=RADAR_AXES.map((a,i)=>pt(i,R*Math.min(100,s.vals[i])/100).map(v=>v.toFixed(1)).join(',')).join(' ');
    polys+=`<polygon points="${pts}" fill="${s.fill}" stroke="${s.color}" stroke-width="2.5"/>`;});
  return `<svg viewBox="0 0 300 285" style="width:100%;height:auto;max-width:330px;display:block;margin:0 auto">${rings}${spokes}${labels}${polys}</svg>`;
}
function svgTrend(ms,series){
  const padL=30,padR=14,padT=16,padB=32,W=320,H=210,iw=W-padL-padR,ih=H-padT-padB,n=ms.length;
  const xat=i=>padL+(n<=1?iw/2:iw*i/(n-1));
  const yat=v=>padT+ih*(1-Math.min(100,v)/100);
  let grid='';[0,25,50,75,100].forEach(g=>{const y=yat(g).toFixed(1);grid+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line2)"/><text x="${padL-5}" y="${(+y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--faint)">${g}</text>`;});
  const multiYear=n>1&&ms[0].date.slice(0,4)!==ms[n-1].date.slice(0,4); // 年をまたぐときは年も出す
  let xlab='';ms.forEach((m,i)=>{xlab+=`<text x="${xat(i).toFixed(1)}" y="${H-padB+15}" text-anchor="middle" font-size="9" fill="var(--soft)">${esc(multiYear?m.date.slice(2).replace(/-/g,'/'):m.date.slice(5).replace('-','/'))}</text>`;});
  let lines='';series.forEach((s,si)=>{const pts=ms.map((m,i)=>`${xat(i).toFixed(1)},${yat(m[s.key]).toFixed(1)}`).join(' ');
    lines+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"${si?' stroke-dasharray="6 4"':''}/>`;
    ms.forEach((m,i)=>{const x=xat(i),y=yat(m[s.key]);const other=series[1-si];const clash=other&&Math.abs(yat(m[other.key])-y)<10;const ly=si&&clash?y+15:y-7;
      lines+=(si?`<rect x="${(x-3.5).toFixed(1)}" y="${(y-3.5).toFixed(1)}" width="7" height="7" fill="${s.color}"/>`:`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${s.color}"/>`)+`<text x="${x.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="${s.color}">${m[s.key]}</text>`;});});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}${xlab}${lines}</svg>`;
}
function trendLabel(cur,prev){if(prev==null)return'';const d=cur-prev;
  if(d<=-3)return`<span style="color:var(--ok);font-weight:600">▼ ${Math.abs(d)}pt 改善</span>`;
  if(d>=3)return`<span style="color:var(--bad);font-weight:600">▲ ${d}pt 悪化</span>`;
  return'<span style="color:var(--soft)">ほぼ横ばい</span>';}
function renderViz(pid){
  const p=store.getPatient(pid);if(!p)return go({name:'home'});
  const ms=store.patientExams(pid).filter(e=>measuresPpd(e.type||'basic')).slice().reverse().map(examMetrics).filter(m=>m.measured>0); // 古い→新しい（ポケットを測らないP混検・深さを1本も測っていない検査は除く）
  const back=`<header class="bar"><button class="back" onclick="APP.go({name:'patientDetail',patientId:${jsq(pid)}})">◀ 戻る</button><div class="htxt"><h1>経過グラフ・患者説明</h1><div class="sub">${esc(p.name)}　<span class="mono">${esc(p.no)}</span></div></div></header>`;
  if(ms.length===0){app.innerHTML=back+`<div class="wrap"><p class="card" style="text-align:center;color:var(--soft);padding:40px 16px;margin-top:20px">深さを測った検査がまだありません。<br><span style="font-size:.8rem">（P混検はポケット検査をしないため、グラフの対象外です）</span></p></div>`;return;}
  const latest=ms[ms.length-1],prev=ms.length>1?ms[ms.length-2]:null;
  const rSeries=[];
  if(prev)rSeries.push({name:'前回',color:'#9aa6b2',fill:'rgba(154,166,178,.12)',vals:RADAR_AXES.map(a=>prev[a.k])});
  rSeries.push({name:'今回',color:'var(--blue)',fill:'rgba(37,99,235,.18)',vals:RADAR_AXES.map(a=>latest[a.k])});
  const metricRow=(label,cur,prev,unit)=>`<div style="display:flex;flex-wrap:nowrap;align-items:baseline;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line2)">
    <span style="flex:1;min-width:0;padding-right:8px;font-size:.78rem;color:#374151">${label}</span>
    <span style="flex:0 0 auto;white-space:nowrap;text-align:right"><span class="mono" style="font-size:1.05rem;font-weight:700">${cur}${unit}</span>${prev!=null?' 　'+trendLabel(cur,prev):''}</span></div>`;
  app.innerHTML=back+`
    <div class="wrap">
      <div class="card" style="padding:18px;margin-top:20px">
        <h2 style="font-size:.9rem;font-weight:700;margin:0 0 2px">お口のリスク（${ymdJP(latest.date)}）</h2>
        <p style="font-size:.72rem;color:var(--soft);margin:0 0 6px">外側に広がるほどリスクが高い状態です。${prev?'青（今回）が灰色（前回）より内側なら改善しています。':''}</p>
        ${svgRadar(rSeries)}
        <div style="display:flex;justify-content:center;gap:18px;font-size:.72rem;color:var(--soft);margin-top:4px">
          ${prev?'<span style="display:inline-flex;align-items:center;gap:5px"><i style="width:12px;height:12px;border-radius:3px;background:rgba(154,166,178,.4);border:1px solid #9aa6b2"></i>前回</span>':''}
          <span style="display:inline-flex;align-items:center;gap:5px"><i style="width:12px;height:12px;border-radius:3px;background:rgba(37,99,235,.25);border:1px solid var(--blue)"></i>今回</span>
        </div>
      </div>
      <div class="card" style="padding:18px;margin-top:14px">
        <h2 style="font-size:.9rem;font-weight:700;margin:0 0 2px">検査ごとの数値</h2>

// ───────── PDF出力 / 印刷（紙チャート風レイアウト・window.print()） ─────────
function ppdSpan(v,mark){if(v==null)return mark?'未':'·';const cls=v>=6?'deep dU':v>=4?'deep':'';return cls?`<span class="${cls}">${v}</span>`:String(v);}
// 白黒コピーでも取り違えない印：出血＝○囲み／排膿＝「排」／前回値のまま＝「前」／未測定＝「未」
const bopWrap=(h,on)=>on?`<span class="bopc">${h}</span>`:h;
function mobCellP(t,strict){if(t.mobility==null)return strict?'未':'−';if(t.mobility===0)return strict?'0':'−';return String(t.mobility);}
function basicArch(list,teeth,opt){opt=opt||{};const cs=opt.carried||new Set();
  const th=list.map(n=>`<th>${toothDisp(n,teeth[n])}</th>`).join('');
  const ppd=list.map(n=>{const t=teeth[n];if(t.missing)return '<td class="miss">欠</td>';if(t.primary)return '<td style="color:#7c3aed">乳</td>';
    return `<td>${bopWrap(ppdSpan(t.ppd,true),t.bop||t.pus)}${t.pus?'<span class="pusm">排</span>':''}${cs.has(n)?'<sup class="prvm">前</sup>':''}</td>`;}).join('');
  const mob=list.map(n=>{const t=teeth[n];if(t.missing)return '<td class="miss"></td>';if(t.primary)return '<td style="color:#7c3aed">乳</td>';return `<td>${mobCellP(t,opt.strict)}</td>`;}).join('');
  return `<table class="pchart"><thead><tr><th class="rl">歯番</th>${th}</tr></thead><tbody>
    <tr><td class="rl">PPD・BOP</td>${ppd}</tr>
    <tr><td class="rl">動揺度</td>${mob}</tr>${plqRowP(list,teeth,opt)}</tbody></table>`;
}
function precArch(list,teeth,opt){opt=opt||{};const cs=opt.carried||new Set();
  const th=list.map(n=>`<th${teeth[n].primary?' style="color:#6d28d9"':''}>${toothDisp(n,teeth[n])}${cs.has(n)?'<sup class="prvm">前</sup>':''}</th>`).join('');
  const siteRow=(keys)=>list.map(n=>{const t=teeth[n];if(t.missing)return '<td class="miss">欠</td>';if(t.primary)return '<td style="color:#7c3aed">乳</td>';
    return `<td>${siteRowKeys(n,keys).map(k=>{const i=SITE6.indexOf(k);const v=t.ppd6?t.ppd6[i]:null;const bop=t.bop6&&t.bop6[i];return `<span class="s">${bopWrap(ppdSpan(v),bop)}</span>`;}).join('')}</td>`;}).join('');
  const mob=list.map(n=>{const t=teeth[n];if(t.missing)return '<td class="miss"></td>';if(t.primary)return '<td style="color:#7c3aed">乳</td>';return `<td>${mobCellP(t,opt.strict)}</td>`;}).join('');
  return `<table class="pchart"><thead><tr><th class="rl">歯番</th>${th}</tr></thead><tbody>
    <tr><td class="rl">頬側</td>${siteRow('b')}</tr>
    <tr><td class="rl">舌側</td>${siteRow('l')}</tr>
    <tr><td class="rl"><small>並び</small></td>${list.map(n=>`<td style="font-size:6.5pt;color:#555">${SITE_LR(n)}</td>`).join('')}</tr>
    <tr><td class="rl">動揺度</td>${mob}</tr>${plqRowP(list,teeth,opt)}</tbody></table>`;
}
// 紙のプラーク行：プラークのある面（頬・近・遠・舌）／なし＝「−」／未記録＝「未」
// P混検の紙：深さ・動揺度の行はなし（測らないため）。歯番（乳歯は A〜E）＋プラーク
function mixedArch(list,teeth,opt){
  const th=list.map(n=>{const t=teeth[n];return `<th${t.primary?' style="color:#6d28d9"':''}>${toothDisp(n,t)}</th>`;}).join('');
  const st=list.map(n=>{const t=teeth[n];return t.missing?'<td class="miss">欠</td>':`<td>${t.primary?'乳':'永'}</td>`;}).join('');
  return `<table class="pchart"><thead><tr><th class="rl">歯番</th>${th}</tr></thead><tbody><tr><td class="rl">歯式</td>${st}</tr>${plqRowP(list,teeth,Object.assign({},opt,{plaque:true}))}</tbody></table>`;}
function plqRowP(list,teeth,opt){if(!opt.plaque)return '';
  return `<tr><td class="rl">プラーク</td>${list.map(n=>{const t=teeth[n];if(t.missing)return '<td class="miss"></td>';if(opt.type!=='mixed'&&t.primary)return '<td></td>';
    if(!Array.isArray(t.plq))return '<td>未</td>';const on=PLQ.filter((k,i)=>t.plq[i]);return `<td class="pqc">${on.length?on.map(k=>PLQ_JA[k]).join(''):'−'}</td>`;}).join('')}</tr>`;}
function buildPrint(patient,ex){
  const type=ex.type||'basic';const st=examStats(ex.teeth,type);const a=patient?computeAge(patient.birth,ex.date||null):null;
  // v0.12.0 以降に作った検査は動揺度の「未記録」と「0」を書き分ける。それ以前の検査は従来どおり「−」
  const opt={carried:new Set(ex.carried||[]),strict:!!ex.createdAt,type,plaque:hasPlaque(type)&&ORDER.some(n=>ex.teeth[n]&&Array.isArray(ex.teeth[n].plq))};

  return `

        <tr><td class="pname-c"><b>患者</b>　${esc(patient?patient.name:'')}（${esc(patient?patient.no:'')}${patient&&patient.chartNo?' / カルテ '+esc(patient.chartNo):''}）</td>
            <td><b>生年月日</b>　${ymdJP(patient?patient.birth:'')}${a!=null?'（検査時 '+a+'歳）':''}　${patient&&patient.gender==='female'?'女':patient&&patient.gender==='male'?'男':''}</td>
            <td><b>検査日</b>　${ymdJP(ex.date)}</td>

      </tbody></table>
      ${type==='mixed'?(()=>{const d=dentitionCount(ex.teeth);return `<div class="psum">現在歯数 永久歯 <b>${d.perm}</b>本・乳歯 <b>${d.prim}</b>本　／　PCR <b>${pcr&&pcr.pct!=null?pcr.pct+'%':'未記録'}</b>${pcr&&pcr.pct!=null&&pcr.rec<pcr.present?`（${pcr.rec}/${pcr.present}歯）`:''}　／　ポケット検査なし</div>`;})():`<div class="psum">BOP率（${type==='precision'?'部位':'歯'}あたり） <b>${st.bopPct==null?'—':st.bopPct+'%'}</b>　／　4mm以上 <b>${st.deep}</b>${st.deepUnit}${type==='basic'?`　／　排膿 <b>${st.pus||0}</b>歯`:''}　／　記録歯数 <b>${st.measured}/${usable}</b>${nCar?`　／　前回値のまま <b>${nCar}</b>歯`:''}${pcr?`　／　PCR <b>${pcr.pct==null?'未記録':pcr.pct+'%'}</b>${pcr.pct!=null&&pcr.rec<pcr.present?`（${pcr.rec}/${pcr.present}歯）`:''}`:''}</div>`}
      ${fd?`<div class="psum" style="margin-left:6px">口全体の所見　${fd}</div>`:''}
    </div>
    <div class="parch"><div class="parch-l">上顎 UPPER（右→左）</div>${arch(UPPER)}</div>
    <div class="parch"><div class="parch-l">下顎 LOWER（右→左）</div>${arch(LOWER)}</div>
    ${type==='mixed'?`<div class="pleg">P混検（混合歯列期歯周病検査）：乳歯を含めて検査・ポケット検査は行わない　／　歯番の A〜E＝乳歯（A乳中切歯〜E第二乳臼歯）　／　プラーク＝染め出された面（頬・近・遠・舌）、−＝なし、未＝未記録　／　欠（網掛け）＝欠損</div>`:`<div class="pleg"><b>太字</b>＝4mm以上　／　<span class="dU">下線</span>＝6mm以上　／　<span class="bopc">○</span>囲み＝BOP陽性　／　${type==='precision'?'':'<span class="pusm">排</span>＝排膿（出血ありとして数える）　／　'}${type==='precision'?'·＝未測定':'未＝未測定'}　／　欠（網掛け）＝欠損　／　<span class="prvm">前</span>＝前回値のまま（今回は確認していない）　／　動揺度 ${opt.strict?'未＝未記録・0＝動揺なし':'−＝0または未記録'}${ORDER.some(n=>ex.teeth[n]&&ex.teeth[n].primary)?'　／　A〜E・乳＝乳歯（深さは測らない）':''}</div>`}

// ───────── 文書（治療のお知らせ＝様式1初回/継続・口腔衛生管理＝様式3） ─────────
// 宮崎県歯科医師会作成の複写式用紙（R6）を再現。歯周検査データから自動入力し、
// お渡し用＋控（カルテ貼付用）をA4縦で印刷する。doc={id,patientId,kind,date,data}
const DOC_KIND={s1i:'治療のお知らせ（初回用）',s1c:'治療のお知らせ（継続用）',s3:'口腔衛生管理'};
const DOC_BADGE={s1i:['var(--warn)','var(--warn-bg)'],s1c:['var(--blue-d)','var(--blue-bg)'],s3:['#0f766e','var(--ok-bg)']};
const D_DISEASE=['高血圧症','心血管疾患','呼吸器疾患','糖尿病','骨粗鬆症'];
const D_ORALFUNC=['口腔衛生状態','口腔乾燥','咬合力','舌口唇運動機能','舌圧','咀嚼機能','嚥下機能'];
const D_PEDOFUNC=['咀嚼機能','嚥下機能','食行動','構音機能','栄養','舌圧','口唇閉鎖力'];
const D_GOALS=['歯磨きの習慣','歯ブラシ・フロス・歯間ブラシの使用','喫煙習慣','食習慣の改善（飲料物の習慣・間食の習慣）','口腔機能の改善・獲得'];
const D_PASTTX=['むし歯の治療（つめる・冠・根の治療）','ブリッジ','義歯','歯肉炎・歯周病の治療'];
const D_PLAN=['むし歯（つめる・冠・根の治療）','ブリッジ','義歯','歯肉炎・歯周炎の治療'];
const D_PLAN_PREV=['定期的な歯周病の治療と管理','定期的なむし歯の管理','継続的な口腔機能の管理','治療方針変更なし'];
const D_S3_STATE=['よく磨けています','磨き残しがあります','歯石がついています','歯ぐきに発赤・出血・腫れがあります'];
const D_S3_OTHER=['舌苔（舌の汚れ）','義歯下粘膜の汚れ'];
const D_S3_GUIDE=['ブラッシングおよびプラーク除去','唾液腺マッサージ','口唇閉鎖力の訓練','舌圧改善の訓練','咀嚼機能訓練'];
const D_OPT={disease:D_DISEASE,oralFunc:D_ORALFUNC,pedoFunc:D_PEDOFUNC,goals:D_GOALS,pastTx:D_PASTTX,planPrev:D_PLAN_PREV,state:D_S3_STATE,other:D_S3_OTHER,guidance:D_S3_GUIDE};
function docOpts(f){if(f==='plan')return dc.kind==='s1i'?D_PLAN.concat(['継続的な口腔機能の管理']):D_PLAN;return D_OPT[f];}
// 歯式の状態：0=現在歯 / 1=欠損（×） / 2=乳歯が現在（永久歯は未萌出）
function docTeethFromExam(ex){const t={};ORDER.forEach(n=>{t[n]=0;});
  if(ex)ORDER.forEach(n=>{const x=ex.teeth[n];if(!x)return;if(x.missing)t[n]=1;else if(x.primary)t[n]=2;});
  return t;}
function docPresent(teeth){let c=0;ORDER.forEach(n=>{const st=teeth[n]||0;if(st===0||st===2)c++;});return c;}
// 直近の検査から様式1の「歯や歯肉の状態」を自動判定
function newDocData(kind,pid){
  const ex=store.patientExams(pid)[0]||null;
  const base={date:ymdToday(),teeth:docTeethFromExam(ex),examRef:ex?ex.date:null,examType:ex?(ex.type||'basic'):null,doctor:store.clinic.doctor||''};
  const pcr=ex&&hasPlaque(ex.type||'basic')?pcrOf(ex.teeth,ex.type).pct:null;base.pcr=pcr; // PCR（目標 20%以下＝院長 2026-10-26）
  if(kind==='s3'){
    let bleed=false; // ★BOP率でなく「BOP+の歯が1本でもあるか」で判定（深さ未入力の歯のBOPも拾う）
    if(ex)bleed=ORDER.some(n=>{const x=ex.teeth[n];return x&&!x.missing&&!x.primary&&toothAnyBop(x);})||(ex.findings&&(ex.findings.bleeding==='有'||ex.findings.redness==='有'));
    const state=[];if(pcr!=null&&pcr>PCR_GOAL)state.push('磨き残しがあります');if(ex&&ex.findings&&ex.findings.calculus==='有')state.push('歯石がついています');if(bleed)state.push('歯ぐきに発赤・出血・腫れがあります');
    return Object.assign(base,{state,statePart:'',other:[],otherText:'',guidance:[],lip:'',tongue:'',timeFrom:'',timeTo:'',hygienist:''});
  }
  let p4='',mob='';
  let note='';
  if(ex&&measuresPpd(ex.type||'basic')){let any4=false,anyM=false,measP=0,measM=0,usable=0;
    ORDER.forEach(n=>{const x=ex.teeth[n];if(!x||x.missing||x.primary)return;usable++;const mx=toothMaxPpd(x);if(mx!=null){measP++;if(mx>=4)any4=true;}if(x.mobility!=null)measM++;if(x.mobility>0)anyM=true;});
    // 測っていない項目は「無」にしない（確かめていない「異常なし」を患者さんに渡さないため）
    p4=any4?'有':(measP?'無':'');mob=anyM?'有':(measM?'無':'');
    const L=[];if(measP<usable)L.push(`深さ未入力 ${usable-measP}歯`);if(measM<usable&&!anyM)L.push(`動揺度未入力 ${usable-measM}歯`);
    if(L.length)note=`直近の検査に未入力があります（${L.join('・')}）。${!measP?'4mm以上ポケットは空欄にしています。':''}${!measM&&!anyM?'動揺は空欄にしています。':''}確認して入れてください。`;
    const cr=(ex.carried||[]).filter(n=>{const x=ex.teeth[n];return x&&!x.missing&&!x.primary;});
    if(cr.length)note+=(note?'　':'')+`直近の検査に「前回値のまま（今回は確認していない）」の歯が ${cr.length}歯あります（${cr.slice(0,4).map(regionName).join('・')}${cr.length>4?' ほか':''}）。ポケット・動揺の有無はその値も含めて判定しています。確認してください。`;}
  const calc=ex&&ex.findings&&ex.findings.calculus==='有';const plq=pcr==null?(calc?'多い':''):pcr>PCR_GOAL?'多い':(pcr>0||calc)?'少ない':'無';
  const d=Object.assign(base,{pocket4:p4,mobility:mob,autoNote:note,swelling:(ex&&ex.findings&&ex.findings.redness)||'',plaque:plq,caries:'',toothOther:'',
    oralFuncNone:false,oralFunc:[],pedoFuncNone:false,pedoFunc:[],pedoOther:'',remarks:'',
    goals:[],goalsOther:'',plan:[],planPrev:[],planOther:'',
    disease:[],diseaseOther:'',maina:false,medState:'',medsText:'',smoke:false,habitOther:'',otherTop:'',
    pastTx:[],pastTxOther:''});
  if(kind==='s1c'){ // 前回の様式1から引き継ぎ（検査由来の項目は上で最新化済み）
    const pv=store.patientDocs(pid).find(x=>x.kind==='s1i'||x.kind==='s1c');
    if(pv){const pd=pv.data;
      ['swelling','caries','toothOther','remarks','goalsOther'].forEach(k=>{if(pd[k])d[k]=pd[k];});if(!d.plaque&&pd.plaque)d.plaque=pd.plaque; // プラークは最新の検査のPCRを優先
      ['oralFunc','pedoFunc','goals'].forEach(k=>{d[k]=(pd[k]||[]).slice();});
      d.oralFuncNone=!!pd.oralFuncNone;d.pedoFuncNone=!!pd.pedoFuncNone;}
    if(ex&&ex.findings&&ex.findings.redness)d.swelling=ex.findings.redness; // 腫れは最新の検査（P混検の所見）を優先
  }
  return d;
}
// 口腔内の状況：実物用紙と同じ「楕円アーチ＋乳歯内側」の歯式図（インラインSVG・タップで 現在→欠損→乳歯）
function docArchSVG(teeth,editable){
  const W=480,H=336,cx=240,cy=168;
  let s='';
  const ln=(x1,y1,x2,y2,st)=>`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" ${st}/>`;
  const cross=(x,y,r)=>{const k=r*0.7;return ln(x-k,y-k,x+k,y+k,'stroke="#ccd2d9" stroke-width="1"')+ln(x-k,y+k,x+k,y-k,'stroke="#ccd2d9" stroke-width="1"');};
  const xmark=(x,y,r)=>{const k=r*0.8;return ln(x-k,y-k,x+k,y+k,'stroke="#333" stroke-width="2.6"')+ln(x-k,y+k,x+k,y-k,'stroke="#333" stroke-width="2.6"');};
  function drawPerm(list,lower){
    const n=list.length,rx=204,ry=138,r=13,sgn=lower?1:-1;
    list.forEach((t,i)=>{const th=Math.PI*(1-(i+0.5)/n);
      const x=cx+rx*Math.cos(th),y=cy+sgn*ry*Math.sin(th);
      const lx=cx+(rx+21)*Math.cos(th),ly=cy+sgn*(ry+21)*Math.sin(th);
      const st=teeth[t]||0;
      if(st===2)s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="#fff" stroke="#c5cbd3" stroke-width="1.2" stroke-dasharray="3 2.5"/>`;
      else if(st===1)s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="#f1f3f6" stroke="#9aa6b2" stroke-width="1.2"/>`+xmark(x,y,r);
      else s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="#fff" stroke="#333" stroke-width="1.3"/>`+cross(x,y,r);
      s+=`<text x="${lx.toFixed(1)}" y="${(ly+3.5).toFixed(1)}" text-anchor="middle" font-size="11" fill="${st===1?'#9aa6b2':'#333'}">${t%10}</text>`;
      if(editable)s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="17" fill="transparent" style="cursor:pointer" onclick="APP.docTooth(${t})"/>`;
    });
  }
  function drawDec(list,lower){
    const n=list.length,rx=127,ry=81,r=9.5,sgn=lower?1:-1;
    list.forEach((t,i)=>{const th=Math.PI*(1-(i+0.5)/n);
      const x=cx+rx*Math.cos(th),y=cy+sgn*ry*Math.sin(th);
      const lx=cx+(rx+17)*Math.cos(th),ly=cy+sgn*(ry+17)*Math.sin(th);
      const on=(teeth[t-40]||0)===2; // 乳歯FDI−40＝同位置の永久歯FDI
      s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${on?'#ede9fe':'#fff'}" stroke="${on?'#7c3aed':'#d7dce2'}" stroke-width="${on?2:1}"/>`;
      s+=`<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="middle" font-size="9" fill="${on?'#6d28d9':'#b8c0c9'}">${PRIMARY_LETTER[t%10]}</text>`;
    });
  }
  drawPerm(UPPER,false);drawPerm(LOWER,true);
  drawDec([55,54,53,52,51,61,62,63,64,65],false);drawDec([85,84,83,82,81,71,72,73,74,75],true);
  s+=`<text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="15" font-weight="700" fill="#111">（ ${docPresent(teeth)} ）本</text>`;
  s+=`<text x="24" y="26" font-size="11" fill="#666">右上</text><text x="${W-24}" y="26" text-anchor="end" font-size="11" fill="#666">左上</text><text x="24" y="${H-14}" font-size="11" fill="#666">右下</text><text x="${W-24}" y="${H-14}" text-anchor="end" font-size="11" fill="#666">左下</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${s}</svg>`;
}

let docBusy=false;
async function docSaveCore(){ // 戻り値false＝端末への保存失敗（画面の入力と dirty は残し、保存済みの文書は元の内容に戻す）
  if(docBusy)return false;docBusy=true;
  try{
    dc.data.date=dc.data.date||ymdToday();
    if(dc.docId){const doc=store.docs.find(x=>x.id===dc.docId);
      if(doc){const bak={kind:doc.kind,date:doc.date,data:doc.data};
        doc.kind=dc.kind;doc.date=dc.data.date;doc.data=clone(dc.data);
        if(!await db.saveDoc(doc,false)){Object.assign(doc,bak);showErr(SAVE_FAIL_MSG);refreshDocSave();return false;}
        dc.dirty=false;clearDraft('doc');refreshDocSave();clearSaveErr();return true;}
      dc.docId=null; // 元の文書が見当たらない（復元などで消えた）→ 入力を捨てずに新しい文書として保存
    }
    const nd={id:generateId(),patientId:dc.pid,kind:dc.kind,date:dc.data.date,data:clone(dc.data)};
    if(!await db.saveDoc(nd,true)){showErr(SAVE_FAIL_MSG);refreshDocSave();return false;}
    dc.docId=nd.id;dc.dirty=false;clearDraft('doc');refreshDocSave();clearSaveErr();return true;
  }finally{docBusy=false;}
}
