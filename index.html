// ───────── レセコンCSV 一方向取り込み（患者番号キー・手動・依存ゼロ） ─────────
// Shift_JIS / UTF-8 を自動判定（日本のレセコンは Shift_JIS が多い）
function decodeBytes(buf){
  let sj='',u8='';
  try{sj=new TextDecoder('shift_jis').decode(buf);}catch(e){}
  try{u8=new TextDecoder('utf-8',{fatal:false}).decode(buf);}catch(e){}
  const score=s=>((s||'').match(/患者|氏名|生年月日|予約|番号/g)||[]).length;
  return score(sj)>=score(u8)?(sj||u8):(u8||sj);
}
// クオート対応の簡易CSVパーサ
function parseCSV(text){
  const rows=[];let i=0,field='',row=[],inQ=false;const s=text.replace(/^﻿/,'');
  while(i<s.length){const c=s[i];
    if(inQ){if(c==='"'){if(s[i+1]==='"'){field+='"';i+=2;continue;}inQ=false;i++;continue;}field+=c;i++;continue;}
    if(c==='"'){inQ=true;i++;continue;}
    if(c===','){row.push(field);field='';i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field='';i++;continue;}
    field+=c;i++;}
  if(field!==''||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(x=>(x||'').trim()!==''));
}
function findCol(headers,cands){ // ★完全一致を優先（「旧患者番号」より「患者番号」を選ぶ）→ 無ければ部分一致
  const H=headers.map(h=>(h||'').replace(/\s/g,''));
  for(const c of cands){const i=H.indexOf(c);if(i>=0)return i;}
  for(let i=0;i<H.length;i++)for(const c of cands)if(H[i].includes(c))return i;
  return -1;}
function splitName(full){const s=(full||'').trim().replace(/[　\s]+/g,' ');const p=s.split(' ');return p.length>=2?{sei:p[0],mei:p.slice(1).join(' ')}:{sei:s,mei:''};}
function parseBirth(v){const m=String(v||'').trim().match(/(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);if(!m)return '';
  const y=+m[1],mo=+m[2],dd=+m[3];const dt=new Date(y,mo-1,dd); // ★実在しない日付（13月・2/30等）は不採用
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==dd)return '';
  return m[1]+'-'+pad2(mo)+'-'+pad2(dd);}
function processImport(rows){
  if(!rows.length)return{error:'ファイルが空か、読み取れませんでした。'};
  const headers=rows[0];
  const ci={no:findCol(headers,['患者番号']),name:findCol(headers,['患者氏名']),birth:findCol(headers,['生年月日'])};
  if(ci.no<0||ci.name<0)return{error:'「患者番号」「患者氏名」の列見出しが見つかりませんでした。CSVの1行目に見出しが含まれているか確認してください。'};
  const byNo={};
  for(let r=1;r<rows.length;r++){const row=rows[r];const recNo=(row[ci.no]||'').trim();if(!recNo)continue;
    const nm=splitName(row[ci.name]);const birth=ci.birth>=0?parseBirth(row[ci.birth]):'';
    const cur=byNo[recNo]||{recNo,sei:'',mei:'',birth:''};
    if(nm.sei){cur.sei=nm.sei;cur.mei=nm.mei;}if(birth)cur.birth=birth;byNo[recNo]=cur;} // 氏名の空の行で名を消さない
  const linked=new Set();
  const items=Object.values(byNo).map(p=>{const name=(p.sei+' '+p.mei).trim();
    const ex=store.patients.find(x=>x.recNo&&normNo(x.recNo)===normNo(p.recNo)); // 先頭の0の違いは同じ番号
    // ★氏名が空の行では既存の氏名を消さない（空氏名は「差分」と見なさない）。新規で氏名なしは登録しない
    let status='new',link=null;
    if(ex)status=((name&&nz(ex.name)!==nz(name))||(p.birth&&ex.birth!==p.birth))?'update':'same';
    else if(!name)status='same';
    else{ // 番号の無い既存患者（手で登録した人）で、氏名と生年月日が同じなら「結び付け」（新しく増やさない）
      link=p.birth?store.patients.find(x=>!x.recNo&&!linked.has(x.id)&&x.birth===p.birth&&nz(x.name)===nz(name)):null;
      if(link){status='link';linked.add(link.id);}}
    const tgt=ex||link;
    return{...p,name,status,exId:tgt?tgt.id:null,oldName:tgt?tgt.name:'',oldBirth:tgt?tgt.birth:''};});
  return{items,total:rows.length-1,
    counts:{new:items.filter(i=>i.status==='new').length,update:items.filter(i=>i.status==='update').length,link:items.filter(i=>i.status==='link').length,same:items.filter(i=>i.status==='same').length}};
}
// まとめて1回で端末に保存。失敗したら追加・更新をすべて元に戻して null
async function applyImport(items){const added=[],baks=[];
  items.forEach(it=>{
    if(it.status==='new'){const np={id:generateId(),no:store.nextNo(),recNo:it.recNo,chartNo:'',sei:it.sei,mei:it.mei,seiKana:'',meiKana:'',name:it.name,kana:'',birth:it.birth,gender:'',notes:''};store.patients.push(np);added.push(np);}
    else if(it.status==='update'){const p=store.getPatient(it.exId);if(p){baks.push([p,{sei:p.sei,mei:p.mei,name:p.name,birth:p.birth,seiKana:p.seiKana,meiKana:p.meiKana,kana:p.kana}]);
      if(it.name&&nz(p.name)!==nz(it.name)){p.sei=it.sei;p.mei=it.mei;p.name=it.name;p.seiKana='';p.meiKana='';p.kana='';} // 氏名が変わったら古い読みを残さない（編集で入れ直す）
      if(it.birth)p.birth=it.birth;}}
    else if(it.status==='link'){const p=store.getPatient(it.exId);if(p){baks.push([p,{recNo:p.recNo}]);p.recNo=it.recNo;}}}); // 結び付け＝番号を付けるだけ（氏名は変えない）
  const changed=added.concat(baks.map(b=>b[0]));
  if(changed.length&&!await db.savePatients(changed)){
    store.patients=store.patients.filter(p=>added.indexOf(p)<0);baks.forEach(([p,b])=>Object.assign(p,b));return null;}
  return{added:added.length,updated:baks.length-items.filter(i=>i.status==='link').length,linked:items.filter(i=>i.status==='link').length};
}
// ───────── 患者名簿（レセコンCSV）＝カルテ番号から氏名・生年月日を引く（口腔機能管理アプリの「予測変換辞書」と同じ使い方） ─────────

    kana:findCol(h,['患者カナ','フリガナ','カナ氏名','患者氏名カナ','カナ']),sex:findCol(h,['性別'])};
  if(ci.no<0||ci.name<0)return{error:'「患者番号」（またはカルテ番号）と「患者氏名」の列見出しが見つかりませんでした。CSVの1行目に見出しがあるか確かめてください。'};

    const nm=splitName(row[ci.name]);const kn=ci.kana>=0?splitName(toKata(row[ci.kana]||'')):{sei:'',mei:''};const b=ci.birth>=0?parseBirth(row[ci.birth]):'';
    const sx=ci.sex>=0?(/女/.test(row[ci.sex]||'')?'female':/男/.test(row[ci.sex]||'')?'male':''):'';

// 検査を画面を移らずに保存。戻り値 false＝失敗（入力は画面に残す）／'updated'／'created'／'recreated'（元の検査が消えていた）／'unchanged'
let saveBusy=false,clinicTimer=null;
async function saveExamCore(){
  if(saveBusy)return false;
  const cur=pe; // 保存中に別の検査へ移っても、保存の結果は保存を始めた検査にだけ反映する
  if(cur.examId&&!cur.dirty&&store.exams.some(e=>e.id===cur.examId))return 'unchanged';
  saveBusy=true;
  const sig=()=>JSON.stringify([cur.date,cur.examiner,cur.teeth,cur.findings]);const at=sig();
  // 保存中に入力が続いたら、その分は未保存のまま残す（下書きも消さない）
  const settle=()=>{if(sig()===at){cur.dirty=false;if(pe===cur)clearDraft('exam');}if(pe===cur)refreshSaveBtn();clearSaveErr();};
  try{
    let lost=false;
    if(cur.examId){const ex=store.exams.find(e=>e.id===cur.examId);
      if(ex){const bak={date:ex.date,examiner:ex.examiner,teeth:ex.teeth,carried:ex.carried,updatedAt:ex.updatedAt,rev:ex.rev,findings:ex.findings};
        const crd=carriedList();

        cur.carriedIn=crd.slice();cur.rev=ex.rev;cur.updatedAt=ex.updatedAt;settle();return 'updated';}
      lost=true; // 編集中に元の検査が消えていた（復元・別の画面での削除など）→ 入力を捨てずに新しい検査として残す
    }
    const now=new Date().toISOString();const crd=carriedList();

    const ne={id:generateId(),patientId:cur.pid,date:cur.date,examiner:cur.examiner,type:cur.type,teeth:clone(cur.teeth),carried:crd,createdAt:now,updatedAt:now,rev:1};if(cur.type==='mixed')ne.findings=Object.assign({},cur.findings);

// ファイルの書き出し：iPad は共有シート（「ファイルに保存」・AirDrop）、それ以外はダウンロード。戻り値 'shared'|'downloaded'|'aborted'|'failed'
async function saveFile(name,text,mime){
  try{if(isIOSDevice()&&navigator.canShare&&typeof File!=='undefined'){const file=new File([text],name,{type:mime});
      if(navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return 'shared';}catch(e){if(e&&e.name==='AbortError')return 'aborted';}}}}catch(_){}
  try{const blob=new Blob([text],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);return 'downloaded';}catch(_){return 'failed';}}

function examsCsv(){const head=['患者番号','カルテ番号','レセコン番号','氏名','フリガナ','検査日','種別','担当','記録歯数','対象歯数','BOP率(%)','4mm以上','4mm以上の単位','6mm以上(歯)','動揺あり(歯)','排膿(歯)','PCR(%)','前回値のまま(歯)','版'];
  const rows=byDateDesc(store.exams).reverse().map(e=>{const p=store.getPatient(e.patientId)||{};const ty=e.type||'basic';const st=examStats(e.teeth,ty);const m=examMetrics(e);const g=examGaps(e.teeth,ty);
    const sev=ORDER.filter(n=>{const x=e.teeth[n];if(!x||x.missing||x.primary)return false;const mx=toothMaxPpd(x);return mx!=null&&mx>=6;}).length;
    const mob=ORDER.filter(n=>{const x=e.teeth[n];return x&&!x.missing&&!x.primary&&x.mobility>0;}).length;const pcr=hasPlaque(ty)?pcrOf(e.teeth,ty).pct:null;
    return [p.no,p.chartNo,p.recNo,p.name,p.kana,e.date,{basic:'基本',precision:'精密',mixed:'P混検'}[ty],e.examiner,measuresPpd(ty)?st.measured:'',measuresPpd(ty)?g.usable:'',measuresPpd(ty)?(st.bopPct==null?'':st.bopPct):'',measuresPpd(ty)?st.deep:'',measuresPpd(ty)?st.deepUnit:'',measuresPpd(ty)?sev:'',measuresPpd(ty)?mob:'',ty==='basic'?st.pus:'',pcr==null?'':pcr,(e.carried||[]).length,e.rev||1];});

        const sel=document.querySelector('#date-row select');if(sel)sel.value=pe.examiner;

      route=Object.assign({},route,{date:v});}
    pe[k]=v;pe.dirty=true;refreshSaveBtn();if(k==='examiner'&&v)rememberExaminer(v);refreshExrChip();},
  setTapMode:m=>{if(pe.readOnly)return;const was=pe.tapMode,wasIntro=!!pe.intro;pe.tapMode=(was===m?null:m);pe.intro=false;

  // v0.15：操作盤のモード。深さ・動揺度＝テンキー（入れたら次の歯へ）、出血・欠損・乳歯＝歯式のマスをタップ

  // テンキー：深さモードは 1〜9（押すと次の歯／部位へ）、動揺度モードは 0〜3（押すと次の歯へ）、塗るときは塗る値を選ぶ

  // 10mm以上：押すたびに 10→11→…→15（15の次は10）。次の歯へは「次 →」

  // 欠損の登録を終える：how='voice'＝話す欄を開く（キーボードを出すため、押したその場で欄にフォーカス）／'plaque'＝P混検のプラークへ／それ以外＝テンキー

  selTooth:n=>{

    if(tm==='prim'){if(!canBePrimary(n)){toast('⚠ 6〜8番は乳歯にできません（乳歯は1〜5番＝A〜E）');return;}if(!t.missing){pushHist();touchT(n,'ppd');t.primary=!t.primary;if(t.primary){t.ppd=null;t.mobility=null;t.bop=false;t.pus=false;t.ppd6=null;t.bop6=null;}pe.dirty=true;refreshSaveBtn();refreshTooth(n);updateStats();refreshMissBar();}return;}
    if(tm==='bop'){if(pe.type==='precision')return;if(!t.missing&&!t.primary){pushHist();touchT(n,'bop');const p=pe.bopPaint;

      toast('「🍼 乳歯」か「🦷 欠損」を選んでから歯をタップしてください');return;}

  // 歯の移動は VORDER（巡回順：右上8→左上8→左下8→右下8）で統一。歯式の表示順ORDERとは別。
  advance:(dir,skip)=>{let idx=pe.sel==null?-1:VORDER.indexOf(pe.sel);
    if(skip&&dir>0){ // 自動送り：最後の歯の先は先頭に戻らず終了（続けて押した数字で先頭の歯を上書きしない）

      finishAll();return;}
    for(let s=0;s<VORDER.length;s++){idx=(idx+dir+VORDER.length)%VORDER.length;const n=VORDER[idx];if(!skip||!(pe.teeth[n].missing||pe.teeth[n].primary)){APP.selTooth(n);tileIntoView(n);return;}}},
  // 六点法：部位単位で前後移動（VORDER基準・歯の境界を越え、欠損歯はスキップ）

    for(let g=0;g<VORDER.length*6+6;g++){p+=dir;if(p>5){p=0;vi++;}if(p<0){p=5;vi--;}if(vi<0){vi=0;p=0;break;}if(vi>=VORDER.length){vi=VORDER.length-1;p=5;break;}const xv=pe.teeth[VORDER[vi]];if(!xv.missing&&!xv.primary)break;}
    const n=VORDER[vi],old=pe.sel;pe.sel=n;pe.site=siteOrder(n)[p];if(old!=null&&old!==n)refreshTooth(old);refreshTooth(n);renderEditor();

// CSVファイル選択 → デコード → 解析 → プレビューへ
document.getElementById('csvfile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{try{const text=decodeBytes(reader.result);importData=processImport(parseCSV(text));}catch(err){importData={error:'読み込みに失敗しました：'+(err&&err.message||err)};}go({name:'import'});};
  reader.onerror=()=>{importData={error:'ファイルを読み込めませんでした。'};go({name:'import'});};
  reader.readAsArrayBuffer(f);
});

  eq('v14 フリガナはカタカナに・番号の先頭の0',[toKata('やまもと'),toKata('ﾊﾅｺ'),normNo('00123'),normNo('123')],['ヤマモト','ハナコ','123','123']);
  {const pr=freshTeeth();pr[16].ppd6=[3,7,4,6,3,3];pr[16].mobility=1;pr[24].missing=true;const old=freshTeeth();ORDER.forEach(n=>{old[n].ppd=3;});
   const pb=prevBaseFor('basic',[{id:'p',type:'precision',date:'2026-04-01',teeth:pr},{id:'o',type:'basic',date:'2025-10-01',teeth:old}]);

   const h=buildPrint({name:'T',no:'#1',birth:'1968-05-12'},{type:'basic',date:'2024-01-10',teeth:t,carried:[17],createdAt:'x'});

  eq('v14 CSV：数式として動く先頭文字を無効に',[csvCell('=1+1'),csvCell('a,b'),csvCell('山田')],["'=1+1",'"a,b"','山田']);
  ok('v14 onclick に埋める値は引用符が破れない（jsq）',!/["']/.test(jsq(`a"b'c`).replace(/&quot;|&#39;/g,'')),jsq(`a"b'c`));
  ok('v14 版の比較',verGt('0.14.0','0.13.2')&&!verGt('0.13.2','0.14.0')&&verGt('0.14.1','0.14.0')&&!verGt('0.14.0','0.14.0'));

  selfTestIDB().then(r=>{if(r){T.push(r);renderSelfTest(T);}}).catch(()=>{});

async function selfTestIDB(){if(typeof indexedDB==='undefined'||!indexedDB)return null;const name='perio_selftest';
  try{const d=await new Promise((res,rej)=>{const r=indexedDB.open(name,1);r.onupgradeneeded=()=>r.result.createObjectStore('t');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
    await new Promise((res,rej)=>{const tx=d.transaction(['t'],'readwrite');tx.objectStore('t').put({v:'歯周'},'k');tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});
    const got=await new Promise((res,rej)=>{const q=d.transaction(['t'],'readonly').objectStore('t').get('k');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
    d.close();await new Promise(res=>{const q=indexedDB.deleteDatabase(name);q.onsuccess=q.onerror=q.onblocked=()=>res();});
    return {name:'v14 端末の保存場所（IndexedDB）に書いて読み戻せる（一時DB）',pass:!!got&&got.v==='歯周',got:JSON.stringify(got),want:'{"v":"歯周"}'};}
  catch(e){return {name:'v14 端末の保存場所（IndexedDB）に書いて読み戻せる（一時DB）',pass:false,got:String(e&&e.message||e),want:'書けて読める'};}}
function renderSelfTest(T){
  const fails=T.filter(t=>!t.pass);
  document.getElementById('app').innerHTML=`
    <header class="bar"><div class="htxt"><h1>セルフテスト</h1><div class="sub">v${APP_VERSION} ・ 純関数の回帰チェック</div></div></header>
    <div class="wrap">
      <div class="card" style="padding:18px;margin-top:20px;text-align:center">
        <div style="font-size:1.6rem;font-weight:700;color:${fails.length?'var(--bad)':'var(--ok)'}">${fails.length?'❌ '+fails.length+' 件失敗':'✅ 全 '+T.length+' 件成功'}</div>
        <div style="font-size:.78rem;color:var(--soft);margin-top:4px">${T.length} 項目実行</div>
      </div>
      <div class="card" style="padding:6px 16px;margin-top:14px;font-size:.78rem">
        ${[...fails,...T.filter(t=>t.pass)].map(t=>`<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2)">
          <span>${t.pass?'✅':'❌'}</span><span style="flex:1">${esc(t.name)}</span>
          ${t.pass?'':`<span class="mono" style="color:var(--bad);font-size:.68rem">got ${esc(t.got)} / want ${esc(t.want)}</span>`}
        </div>`).join('')}
      </div>
      <button class="btn-primary" style="margin-top:16px" onclick="location.href=location.pathname">アプリに戻る</button>
    </div>`;
}
// 予期しないエラー：黙ってボタンが効かなくなるのを防ぐ。入力は下書きに書き切ってから知らせる（同じ内容は続けて出さない）
let lastErrAt=0;
function reportUnexpected(err){const msg=String(err&&(err.message||err.reason&&err.reason.message)||err||'').slice(0,160);
  if(!msg||/ResizeObserver|Script error/i.test(msg))return;
  try{flushDraftsNow();}catch(_){}
  const now=Date.now();if(now-lastErrAt<4000)return;lastErrAt=now;
  showErr('予期しないエラーが起きました（'+msg+'）。入力途中の内容は下書きに残しています。うまく動かないときはこの画面を撮って院長に知らせ、アプリを開き直してください。');}
window.addEventListener('error',e=>reportUnexpected(e.error||e.message));
window.addEventListener('unhandledrejection',e=>reportUnexpected(e.reason));
// 未保存の検査があるときはタブ/リロードで警告
window.addEventListener('beforeunload',e=>{if((route.name==='perio'&&pe&&pe.dirty)||(route.name==='doc'&&dc&&dc.dirty)){e.preventDefault();e.returnValue='';}});
// iPad では beforeunload が働かないので、アプリの切り替え・画面を閉じる瞬間に下書きを書き切る
function flushDraftsNow(){if(route.name==='perio'&&pe&&pe.dirty)flushDraft('exam',true);if(route.name==='doc'&&dc&&dc.dirty)flushDraft('doc',true);if(route.name==='patientForm'&&pf&&pf._dirty)flushDraft('pf',true);}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraftsNow();else checkUpdate(false);});
window.addEventListener('pagehide',flushDraftsNow);
// 起動：PB接続→サーバー / 未接続→端末内保存（IndexedDB。使えない端末だけ localStorage） / 不可→メモリ
(async function init(){
  if(/selftest/.test(location.search)){runSelfTest();return;} // ?selftest で回帰チェックのみ実行
  if(db.connected())app.innerHTML='<div style="text-align:center;color:var(--soft);padding:80px 0;font-size:.9rem">サーバーに接続中…</div>';
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){} // 端末保存の永続化を要求（iOSの自動削除対策）
  try{await db.load();}
  catch(e){console.error(e);netState='memory';LOCAL.backend=null;store.patients=[];store.exams=[];store.docs=[];
    storageProblem='起動時に保存データを読み込めませんでした（'+String(e&&e.message||e).slice(0,100)+'）。記録は消えていません。入力は保存されないので、アプリを閉じて開き直してください。直らないときは院長に連絡してください。';}
  try{if(netState==='local'){initVault();watchVaultCover();}}catch(e){console.warn('院内保管庫の初期化に失敗',e);} // 端末内保存モードのときだけ
  try{drafts=await draftReadAll();}catch(_){}
  try{roster=await kvGet('chartDict');if(roster&&!Array.isArray(roster.items))roster=null;}catch(_){roster=null;}
  nrInit();
  try{preRestoreInfo=await kvGet('pre_restore_info');
    if(preRestoreInfo&&Date.now()-new Date(preRestoreInfo.at)>3*86400000){await kvPut('pre_restore',null);await kvPut('pre_restore_info',null);preRestoreInfo=null;} /* 復元の控えは3日で片づける（患者情報を端末に余分に残さない） */if(LOCAL.backend==='ls'&&!lastExport){const r=localStorage.getItem('perio_last_export');lastExport=r?JSON.parse(r):null;}}catch(_){}
  try{await refreshStorageInfo();}catch(_){}
  initTabGuard();renderTopBars();checkUpdate(true);sttProbe();if(rsWanted())rsStart();
  // オフラインでも開けるように（https の公開URLのときだけ。ネット優先なので古い版に固定されない）
  try{if(location.protocol==='https:'&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});}catch(_){}
  try{render();}catch(e){console.error(e);route={name:'home'};try{render();}catch(_){}showErr('画面を表示できませんでした（'+String(e&&e.message||e).slice(0,120)+'）。院長に連絡してください。');}
})();
})();
